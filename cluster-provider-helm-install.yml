---
# Install fleet-helm-release-sp on a console-provisioned cluster.

- name: Fleet cluster provider | Install helm SP
  hosts: hub
  become: true
  gather_facts: false
  vars:
    fleet_site_name: "{{ fleet_cluster_name }}"
    fleet_site_ocm_name: "{{ fleet_cluster_name }}"
    fleet_site_wg_ip: "{{ fleet_site_sp_endpoint }}/32"
    harbor_host: "{{ fleet_hub_wireguard_ip | default('10.10.0.1') }}"
    harbor_proxy_project_quay: "{{ harbor_proxy_project_quay | default('quay-proxy') }}"
    harbor_fleet_image_prefix: "{{ harbor_host }}:{{ harbor_nodeport_https }}/fleet"
    phase5_dcm_registry: "{{ harbor_host }}:{{ harbor_nodeport_https }}/{{ harbor_proxy_project_quay }}"
  tasks:
    - ansible.builtin.import_role:
        name: fleet_site
        tasks_from: push_site_helm_provider.yml
      tags: [fleet_cluster_provider, fleet_cluster_provider_helm]
