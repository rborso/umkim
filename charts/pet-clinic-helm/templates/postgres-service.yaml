apiVersion: v1
kind: Service
metadata:
  name: {{ include "pet-clinic-helm.postgresHost" . }}
  labels:
    {{- include "pet-clinic-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
