apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "pet-clinic-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.auth.database | quote }}
  POSTGRES_USER: {{ .Values.database.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.auth.password | quote }}
  SPRING_DATASOURCE_URL: {{ printf "jdbc:postgresql://%s-postgres:5432/%s" .Release.Name .Values.database.auth.database | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.auth.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.database.auth.password | quote }}
