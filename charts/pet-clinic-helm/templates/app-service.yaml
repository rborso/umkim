apiVersion: v1
kind: Service
metadata:
  name: {{ include "pet-clinic-helm.appHost" . }}
  labels:
    {{- include "pet-clinic-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.app.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
