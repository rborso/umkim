apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: llama-cpp-helm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.useRuntimeClass }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: llama-cpp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -hf
            - {{ .Values.hfRepo }}:{{ .Values.hfQuant }}
            {{- if .Values.model }}
            - --alias
            - {{ .Values.model | quote }}
            {{- end }}
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - -c
            - {{ .Values.ctxSize | quote }}
            - -ngl
            - {{ .Values.nGpuLayers | quote }}
            - -np
            - {{ .Values.parallel | quote }}
            {{- if .Values.jinja }}
            - --jinja
            {{- end }}
            {{- if .Values.chatTemplateKwargs }}
            - --chat-template-kwargs
            - {{ .Values.chatTemplateKwargs | quote }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.useGpuResource }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- else }}
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | default "4" | quote }}
              memory: {{ .Values.resources.limits.memory | default "6Gi" | quote }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | default "2" | quote }}
              memory: {{ .Values.resources.requests.memory | default "4Gi" | quote }}
          {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-model-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
