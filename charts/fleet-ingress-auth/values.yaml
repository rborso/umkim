namespace: fleet-ingress-auth

enabled: true
createNamespace: false

# PVC storage class for LLDAP/Authelia data (use local-path on single-node spokes; empty = cluster default).
persistence:
  storageClass: ""

lldap:
  deploy: true
  externalUrl: ""
  image: ghcr.io/lldap/lldap:stable@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
  ldapPort: 3890
  httpPort: 17170
  baseDN: dc=example,dc=com
  adminEmail: admin@mgmt.example.com
  jwtSecret: change-me-lldap-jwt
  adminPassword: change-me-lldap-admin
  exposeWebUI: false
  webUIHost: ""
  # Shared low-privilege LLDAP bind account for apps (Authelia, Jellyfin, ...).
  # Created by a post-install/upgrade Job and added to lldap_strict_readonly.
  # Set password from the role (per-cluster); empty disables creation.
  bindAccount:
    enabled: true
    username: svc-bind
    displayName: "Shared service bind account"
    group: lldap_strict_readonly
    password: ""
    secretName: lldap-service-accounts

authelia:
  image: ghcr.io/authelia/authelia:4.38.19
  port: 9091
  sessionSecret: change-me-authelia-session
  storageEncryptionKey: change-me-authelia-storage
  resetPasswordJWTSecret: change-me-authelia-reset-jwt
  ldapPassword: ""
  # LDAP bind user DN. Defaults to the directory admin; set to a read-only bind
  # account (e.g. uid=svc-bind,ou=people,<baseDN>) for shared directories.
  ldapUser: ""
  cookieDomain: mgmt.example.com
  portalHost: auth.mgmt.example.com
  publicURL: "https://auth.mgmt.example.com"
  accessDomains:
    - "*.mgmt.example.com"
    - "mgmt.example.com"
  # Host-level rules that restrict a route to directory groups (tenants). These
  # are evaluated before accessDomains. Empty groups means any authenticated user.
  accessRules: []

# Cluster-local invite sign-up page. Enabled for clusters using the shared hub
# directory (directory: hub); the form proxies redemption to the hub over WG.
signup:
  enabled: false
  image: nginx:1.27-alpine
  hubRedeemURL: ""

traefik:
  deploySpokeMiddleware: true
  middlewareName: fleet-ingress-authelia
  middlewareNamespace: fleet-ingress
  stripAuthorizationMiddlewareName: strip-authorization
  # Portal entrypoint/TLS. port_forward spokes terminate TLS (websecure + ACME);
  # reverse_proxy spokes publish the portal on web for the external proxy.
  portalEntrypoint: websecure
  portalTLS: true

registry:
  prefix: ""
