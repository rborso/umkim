{{- if and .Values.enabled .Values.lldap.deploy .Values.lldap.managedGroups }}
{{/*
Reconcile the groups this cluster's routes declare (route.requireAuthGroups) into
its own directory.

The Job name is keyed to the declared set: the manifests are applied through a
ManifestWork rather than by Helm, so the hook annotations below do nothing and a
stable name would be a no-op on re-apply. A changed set therefore yields a new
Job, which runs immediately. The CronJob then restores a group that is deleted
out of band.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-managed-groups-{{ .Values.lldap.managedGroups | join "," | sha256sum | trunc 8 }}
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
  labels:
    app.kubernetes.io/name: fleet-ingress-auth
    app.kubernetes.io/component: lldap-managed-groups
spec:
  ttlSecondsAfterFinished: 600
{{ include "fleet-ingress-auth.managedGroupsJobSpec" . | indent 2 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lldap-managed-groups-sync
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
  labels:
    app.kubernetes.io/name: fleet-ingress-auth
    app.kubernetes.io/component: lldap-managed-groups
spec:
  schedule: {{ .Values.lldap.managedGroupsSchedule | default "*/10 * * * *" | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
{{ include "fleet-ingress-auth.managedGroupsJobSpec" . | indent 6 }}
{{- end }}
