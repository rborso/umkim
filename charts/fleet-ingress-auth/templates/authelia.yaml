{{- if .Values.enabled }}
{{- $ldapPass := .Values.authelia.ldapPassword | default .Values.lldap.adminPassword }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
data:
  configuration.yml: |
    theme: light
    server:
      address: 'tcp://0.0.0.0:{{ .Values.authelia.port }}'
    log:
      level: info
    identity_validation:
      reset_password:
        jwt_secret: {{ .Values.authelia.resetPasswordJWTSecret | quote }}
    authentication_backend:
      ldap:
        address: {{ .Values.lldap.externalUrl | default (printf "ldap://lldap.%s.svc.cluster.local:%v" (include "fleet-ingress-auth.namespace" .) .Values.lldap.ldapPort) | quote }}
        implementation: lldap
        base_dn: {{ .Values.lldap.baseDN | quote }}
        user: {{ .Values.authelia.ldapUser | default (printf "uid=admin,ou=people,%s" .Values.lldap.baseDN) | quote }}
        password: {{ $ldapPass | quote }}
{{- if .Values.authelia.oidc.enabled }}
    identity_providers:
      oidc:
        hmac_secret: {{ .Values.authelia.oidc.hmacSecret | quote }}
        issuer_private_key: |
{{ .Values.authelia.oidc.issuerPrivateKey | indent 10 }}
        clients:
{{- range .Values.authelia.oidc.clients }}
          - client_id: {{ .clientId | quote }}
            client_name: {{ .clientName | default .clientId | quote }}
            client_secret: {{ .clientSecret | quote }}
            public: false
            authorization_policy: {{ .authorizationPolicy | default "one_factor" }}
            require_pkce: {{ .requirePkce | default true }}
            pkce_challenge_method: S256
            redirect_uris:
{{- range .redirectUris }}
              - {{ . | quote }}
{{- end }}
            scopes:
{{- range (.scopes | default (list "openid" "profile" "email")) }}
              - {{ . | quote }}
{{- end }}
            response_types:
              - code
            grant_types:
              - authorization_code
            token_endpoint_auth_method: {{ .tokenEndpointAuthMethod | default "client_secret_basic" }}
{{- end }}
{{- end }}
    access_control:
      default_policy: deny
      rules:
        - domain: {{ .Values.authelia.portalHost | quote }}
          policy: bypass
{{- range .Values.authelia.accessRules }}
        - domain: {{ .domain | quote }}
          subject:
{{- range .groups }}
            - {{ printf "group:%s" . | quote }}
{{- end }}
          policy: one_factor
        # Deny authenticated users who are not in the allowed groups; Authelia
        # skips a subject rule when it does not match, so an explicit deny must
        # precede the zone wildcard rules.
        - domain: {{ .domain | quote }}
          policy: deny
{{- end }}
{{- range .Values.authelia.accessDomains }}
        - domain: {{ . | quote }}
          policy: one_factor
{{- end }}
    session:
      secret: {{ .Values.authelia.sessionSecret | quote }}
      cookies:
        - domain: {{ .Values.authelia.cookieDomain | quote }}
          name: authelia_session
          same_site: lax
          expiration: 8h
          inactivity: 30m
          authelia_url: {{ .Values.authelia.publicURL | quote }}
          default_redirection_url: {{ printf "https://%s" .Values.authelia.cookieDomain | quote }}
    storage:
      encryption_key: {{ .Values.authelia.storageEncryptionKey | quote }}
      local:
        path: /data/db.sqlite3
    notifier:
      filesystem:
        filename: /data/notification.txt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-data
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
{{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
      annotations:
        # Roll Authelia when its rendered config changes (access rules/domains,
        # LDAP bind, secrets); it reads configuration.yml only at startup.
        checksum/authelia-config: {{ .Values.authelia | toYaml | sha256sum }}
    spec:
      enableServiceLinks: false
{{- if .Values.lldap.deploy }}
      initContainers:
        - name: wait-lldap-ldap
          image: alpine:3.20
          env:
            - name: LLDAP_BIND_DN
              value: {{ .Values.authelia.ldapUser | default (printf "uid=admin,ou=people,%s" .Values.lldap.baseDN) | quote }}
            - name: LLDAP_BIND_PASSWORD
              value: {{ $ldapPass | quote }}
          command:
            - sh
            - -ec
            - |
              apk add --no-cache openldap-clients >/dev/null
              for i in $(seq 1 60); do
                if ldapwhoami -H ldap://lldap:{{ .Values.lldap.ldapPort }} -x \
                  -D "$LLDAP_BIND_DN" -w "$LLDAP_BIND_PASSWORD" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 5
              done
              echo "lldap LDAP bind not ready" >&2
              exit 1
{{- else if .Values.lldap.externalUrl }}
      initContainers:
        - name: wait-external-lldap
          image: alpine:3.20
          env:
            - name: LLDAP_BIND_DN
              value: {{ .Values.authelia.ldapUser | default (printf "uid=admin,ou=people,%s" .Values.lldap.baseDN) | quote }}
            - name: LLDAP_BIND_PASSWORD
              value: {{ $ldapPass | quote }}
            - name: LLDAP_URL
              value: {{ .Values.lldap.externalUrl | quote }}
          command:
            - sh
            - -ec
            - |
              apk add --no-cache openldap-clients >/dev/null
              for i in $(seq 1 60); do
                if ldapwhoami -H "$LLDAP_URL" -x \
                  -D "$LLDAP_BIND_DN" -w "$LLDAP_BIND_PASSWORD" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 5
              done
              echo "external LLDAP bind not ready" >&2
              exit 1
{{- end }}
      containers:
        - name: authelia
          image: {{ .Values.authelia.image | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.authelia.port }}
          volumeMounts:
            - name: config
              mountPath: /config/configuration.yml
              subPath: configuration.yml
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: data
          persistentVolumeClaim:
            claimName: authelia-data
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
spec:
  selector:
    app: authelia
  ports:
    - name: http
      port: {{ .Values.authelia.port }}
      targetPort: http
{{- end }}
