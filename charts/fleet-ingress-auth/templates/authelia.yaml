{{- if .Values.enabled }}
{{- $ldapPass := .Values.authelia.ldapPassword | default .Values.lldap.adminPassword }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
data:
  configuration.yml: |
{{ include "fleet-ingress-auth.autheliaConfig" . | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-data
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
{{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
      annotations:
        # Roll Authelia when its rendered config changes (access rules/domains,
        # LDAP bind, secrets); it reads configuration.yml only at startup.
        checksum/authelia-config: {{ include "fleet-ingress-auth.autheliaConfig" . | sha256sum }}
    spec:
      enableServiceLinks: false
{{- if .Values.lldap.deploy }}
      initContainers:
        - name: wait-lldap-ldap
          image: alpine:3.20
          env:
            - name: LLDAP_BIND_DN
              value: {{ .Values.authelia.ldapUser | default (printf "uid=admin,ou=people,%s" .Values.lldap.baseDN) | quote }}
            - name: LLDAP_BIND_PASSWORD
              value: {{ $ldapPass | quote }}
          command:
            - sh
            - -ec
            - |
              apk add --no-cache openldap-clients >/dev/null
              for i in $(seq 1 60); do
                if ldapwhoami -H ldap://lldap:{{ .Values.lldap.ldapPort }} -x \
                  -D "$LLDAP_BIND_DN" -w "$LLDAP_BIND_PASSWORD" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 5
              done
              echo "lldap LDAP bind not ready" >&2
              exit 1
{{- else if .Values.lldap.externalUrl }}
      initContainers:
        - name: wait-external-lldap
          image: alpine:3.20
          env:
            - name: LLDAP_BIND_DN
              value: {{ .Values.authelia.ldapUser | default (printf "uid=admin,ou=people,%s" .Values.lldap.baseDN) | quote }}
            - name: LLDAP_BIND_PASSWORD
              value: {{ $ldapPass | quote }}
            - name: LLDAP_URL
              value: {{ .Values.lldap.externalUrl | quote }}
          command:
            - sh
            - -ec
            - |
              apk add --no-cache openldap-clients >/dev/null
              for i in $(seq 1 60); do
                if ldapwhoami -H "$LLDAP_URL" -x \
                  -D "$LLDAP_BIND_DN" -w "$LLDAP_BIND_PASSWORD" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 5
              done
              echo "external LLDAP bind not ready" >&2
              exit 1
{{- end }}
      containers:
        - name: authelia
          image: {{ .Values.authelia.image | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.authelia.port }}
          volumeMounts:
            - name: config
              mountPath: /config/configuration.yml
              subPath: configuration.yml
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: data
          persistentVolumeClaim:
            claimName: authelia-data
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: {{ include "fleet-ingress-auth.namespace" . }}
spec:
  selector:
    app: authelia
  ports:
    - name: http
      port: {{ .Values.authelia.port }}
      targetPort: http
{{- end }}
