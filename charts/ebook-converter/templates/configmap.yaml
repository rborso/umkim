apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-content
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  index.html: |
{{ .Files.Get "static/index.html" | indent 4 }}
  app.js: |
{{ .Files.Get "static/app.js" | indent 4 }}
  fflate.js: |
{{ .Files.Get "static/fflate.js" | indent 4 }}
