<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ebook Converter</title>
  <style>
    :root {
      --bg: #14120f;
      --panel: #1f1b17;
      --border: #3d342c;
      --text: #f3ebe2;
      --muted: #a89888;
      --accent: #c97840;
      --accent2: #5a8f7b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: radial-gradient(ellipse at top, #221c18, var(--bg) 55%);
      color: var(--text);
    }
    header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(31, 27, 23, 0.92);
    }
    h1 { margin: 0; font-size: 1.4rem; font-weight: 600; font-family: system-ui, sans-serif; }
    .sub { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.92rem; font-family: system-ui, sans-serif; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 2.5rem;
      font-family: system-ui, sans-serif;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
    }
    .drop {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop.drag { border-color: var(--accent); background: rgba(201, 120, 64, 0.08); }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; align-items: center; }
    button, select {
      border: 1px solid var(--border);
      background: #2a241f;
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.primary { background: var(--accent); border-color: #a85f30; color: #fff; }
    button.secondary { background: var(--accent2); border-color: #467a68; color: #fff; }
    #status { color: var(--muted); font-size: 0.88rem; margin-left: auto; }
    #status.ok { color: #7dcea0; }
    #status.err { color: #e88; }
    #preview {
      margin-top: 1rem;
      padding: 1.25rem 1.5rem;
      background: #faf6f0;
      color: #1a1512;
      border-radius: 10px;
      min-height: 120px;
      max-height: 50vh;
      overflow: auto;
      line-height: 1.65;
      font-family: Georgia, serif;
    }
    #preview h1, #preview h2, #preview h3 { font-family: system-ui, sans-serif; }
    #preview .chapter { margin-bottom: 1.5rem; }
    label.field { display: block; margin: 0.5rem 0; font-size: 0.9rem; color: var(--muted); }
    input[type=text] {
      width: 100%;
      max-width: 320px;
      padding: 0.4rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #12100e;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <h1>Ebook Converter</h1>
    <p class="sub">Convert plain text, Markdown, or EPUB into a single downloadable HTML ebook — no server upload.</p>
  </header>
  <main>
    <div class="card">
      <div class="drop" id="drop">
        <strong>Drop a file here</strong> or click to browse<br />
        <span>.txt · .md · .epub</span>
        <input type="file" id="file" accept=".txt,.md,.markdown,.epub,text/plain,text/markdown,application/epub+zip" hidden />
      </div>
      <div class="row">
        <label class="field">Book title
          <input type="text" id="title" placeholder="My Ebook" />
        </label>
        <label class="field">Author
          <input type="text" id="author" placeholder="Anonymous" />
        </label>
      </div>
      <div class="row">
        <button type="button" class="primary" id="btn-convert" disabled>Convert to HTML</button>
        <button type="button" class="secondary" id="btn-download" disabled>Download .html</button>
        <span id="status">Choose a file to begin</span>
      </div>
    </div>
    <div class="card">
      <strong>Preview</strong>
      <div id="preview"><em>Converted content will appear here.</em></div>
    </div>
  </main>
  <script src="fflate.js"></script>
  <script src="app.js"></script>
</body>
</html>
