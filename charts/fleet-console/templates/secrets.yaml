{{- if and .Values.auth.enabled .Values.auth.htpasswdLine }}
apiVersion: v1
kind: Secret
metadata:
  name: fleet-console-auth-htpasswd
  namespace: {{ include "fleet-console.namespace" . }}
type: Opaque
stringData:
  auth: {{ .Values.auth.htpasswdLine | quote }}
---
{{- end }}
{{- if and .Values.auth.enabled .Values.auth.ldap.bindPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: fleet-console-auth-ldap
  namespace: {{ include "fleet-console.namespace" . }}
type: Opaque
stringData:
  bindPassword: {{ .Values.auth.ldap.bindPassword | quote }}
---
{{- end }}
