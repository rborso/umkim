{{- if and .Values.lldap.enabled .Values.lldap.bootstrap.enabled }}
{{- $groups := .Values.lldap.bootstrap.groups | default list }}
{{- $defaultTenant := .Values.lldap.bootstrap.defaultTenant | default "" }}
{{- if and $defaultTenant (not (has $defaultTenant $groups)) }}
{{- $groups = append $groups $defaultTenant }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: lldap-bootstrap-groups
  namespace: {{ include "fleet-console.namespace" . }}
  labels:
    app: lldap
    app.kubernetes.io/component: bootstrap
data:
{{- range $groups }}
  {{ . }}.json: |
    {"name": {{ . | quote }}}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lldap-bootstrap-user-schemas
  namespace: {{ include "fleet-console.namespace" . }}
  labels:
    app: lldap
    app.kubernetes.io/component: bootstrap
data:
  user-schemas.json: |
{{ .Values.lldap.bootstrap.userSchemas | default list | toJson | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-bootstrap
  namespace: {{ include "fleet-console.namespace" . }}
  labels:
    app: lldap
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app: lldap-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.lldap.image | quote }}
          command: ["/app/bootstrap.sh"]
          env:
            - name: LLDAP_URL
              value: "http://lldap:{{ .Values.lldap.httpPort }}"
            - name: LLDAP_ADMIN_USERNAME
              value: admin
            - name: LLDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lldap-credentials
                  key: LLDAP_LDAP_USER_PASS
            - name: GROUP_CONFIGS_DIR
              value: /bootstrap/group-configs
            - name: USER_SCHEMAS_DIR
              value: /bootstrap/user-schemas
            - name: DO_CLEANUP
              value: "false"
          volumeMounts:
            - name: group-configs
              mountPath: /bootstrap/group-configs
              readOnly: true
            - name: user-schemas
              mountPath: /bootstrap/user-schemas
              readOnly: true
      volumes:
        - name: group-configs
          configMap:
            name: lldap-bootstrap-groups
        - name: user-schemas
          configMap:
            name: lldap-bootstrap-user-schemas
{{- end }}
