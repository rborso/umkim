{{- if .Values.auth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-console-auth
  namespace: {{ include "fleet-console.namespace" . }}
  labels:
    app: fleet-console-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-console-auth
  template:
    metadata:
      labels:
        app: fleet-console-auth
    spec:
      serviceAccountName: fleet-console-auth
      containers:
        - name: auth
          image: {{ include "fleet-console.authImage" . }}
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.auth.port }}
          env:
            - name: FLEET_AUTH_NAMESPACE
              value: {{ include "fleet-console.namespace" . | quote }}
            - name: FLEET_AUTH_API_BIND
              value: {{ printf ":%v" .Values.auth.port | quote }}
            - name: FLEET_AUTH_SESSION_SECRET
              value: {{ .Values.auth.sessionSecret | quote }}
            - name: FLEET_AUTH_SESSION_TTL
              value: {{ .Values.auth.sessionTTL | quote }}
            - name: FLEET_AUTH_SESSION_SECURE
              value: {{ ternary "true" "false" .Values.auth.sessionSecure | quote }}
            - name: FLEET_AUTH_BYPASS
              value: {{ ternary "true" "false" .Values.auth.bypass | quote }}
            - name: FLEET_AUTH_HTPASSWD_PATH
              value: /etc/auth/htpasswd
            - name: FLEET_AUTH_HTPASSWD_LINE
              value: {{ .Values.auth.htpasswdLine | quote }}
            - name: FLEET_AUTH_BOOTSTRAP_ADMIN_USER
              value: {{ .Values.auth.bootstrapAdminUser | quote }}
            - name: FLEET_AUTH_BOOTSTRAP_INSTALL_TOKEN
              value: {{ .Values.auth.bootstrapInstallToken | quote }}
            - name: FLEET_AUTH_BOOTSTRAP_LDAP_GROUP
              value: {{ .Values.auth.bootstrapLdapGroup | quote }}
            - name: FLEET_AUTH_BOOTSTRAP_LDAP_GROUP_CN
              value: {{ .Values.auth.bootstrapLdapGroupCN | quote }}
            - name: FLEET_AUTH_FLEET_UPSTREAM
              value: {{ .Values.auth.fleetUpstream | quote }}
            - name: FLEET_AUTH_LLM_UPSTREAM
              value: {{ .Values.auth.llmUpstream | quote }}
            - name: FLEET_AUTH_LLM_MASTER_KEY_SECRET_NS
              value: {{ .Values.auth.llmMasterKeySecretNamespace | quote }}
            - name: FLEET_AUTH_LLM_MASTER_KEY_SECRET
              value: {{ .Values.auth.llmMasterKeySecretName | quote }}
            - name: FLEET_AUTH_LLM_MASTER_KEY_SECRET_KEY
              value: {{ .Values.auth.llmMasterKeySecretKey | quote }}
            - name: FLEET_AUTH_LDAP_URL
              value: {{ .Values.auth.ldap.url | quote }}
            - name: FLEET_AUTH_LDAP_BASE_DN
              value: {{ .Values.auth.ldap.baseDN | quote }}
            - name: FLEET_AUTH_LDAP_BIND_DN
              value: {{ .Values.auth.ldap.bindDN | quote }}
            - name: FLEET_AUTH_LDAP_USER_FILTER
              value: {{ .Values.auth.ldap.userFilter | quote }}
            - name: FLEET_AUTH_LDAP_GROUP_FILTER
              value: {{ .Values.auth.ldap.groupFilter | quote }}
            - name: FLEET_AUTH_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: FLEET_AUTH_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            - name: FLEET_AUTH_OIDC_CLIENT_SECRET
              value: {{ .Values.auth.oidc.clientSecret | quote }}
            - name: FLEET_AUTH_OIDC_REDIRECT_URL
              value: {{ .Values.auth.oidc.redirectUrl | quote }}
            - name: FLEET_AUTH_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-console-auth-ldap
                  key: bindPassword
                  optional: true
          volumeMounts:
            - name: htpasswd
              mountPath: /etc/auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: htpasswd
          secret:
            secretName: fleet-console-auth-htpasswd
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-console-auth
  namespace: {{ include "fleet-console.namespace" . }}
spec:
  selector:
    app: fleet-console-auth
  ports:
    - name: http
      port: {{ .Values.auth.port }}
      targetPort: http
{{- end }}
