{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umkim-console
  namespace: {{ include "fleet-console.namespace" . }}
  labels:
    app: umkim-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umkim-console
  template:
    metadata:
      labels:
        app: umkim-console
      annotations:
        fleet.umkim.com/build-id: {{ .Values.dashboard.buildId | default "" | quote }}
    spec:
      containers:
        - name: nginx
          image: {{ include "fleet-console.dashboardImage" . }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: FLEET_AUTH_HOST
              value: {{ .Values.dashboard.fleetAuthHost | quote }}
            - name: FLEET_SITE_HOST
              value: {{ .Values.dashboard.fleetSiteHost | quote }}
          readinessProbe:
            httpGet:
              path: /fleet/
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: umkim-console
  namespace: {{ include "fleet-console.namespace" . }}
spec:
  type: NodePort
  selector:
    app: umkim-console
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: {{ .Values.dashboard.nodePort }}
{{- end }}
