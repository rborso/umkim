{{- if and .Values.lldap.enabled .Values.lldap.serviceAccounts.enabled }}
{{- $sa := .Values.lldap.serviceAccounts }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sa.secretName | default "lldap-service-accounts" }}
  namespace: {{ include "fleet-console.namespace" . }}
  labels:
    app: lldap
    app.kubernetes.io/component: service-accounts
type: Opaque
stringData:
  bind-username: {{ $sa.bind.username | quote }}
  bind-password: {{ $sa.bind.password | quote }}
  admin-username: {{ $sa.admin.username | quote }}
  admin-password: {{ $sa.admin.password | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-service-accounts
  namespace: {{ include "fleet-console.namespace" . }}
  labels:
    app: lldap
    app.kubernetes.io/component: service-accounts
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "11"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 8
  template:
    metadata:
      labels:
        app.kubernetes.io/component: service-accounts
    spec:
      restartPolicy: OnFailure
      containers:
        - name: service-accounts
          image: {{ .Values.lldap.image | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              url="http://lldap:{{ .Values.lldap.httpPort }}"
              for i in $(seq 1 40); do curl -fsS "${url}/health" >/dev/null 2>&1 && break; sleep 3; done
              token=$(curl -fsS -X POST "${url}/auth/simple/login" -H 'Content-Type: application/json' \
                -d "{\"username\":\"admin\",\"password\":\"${LLDAP_ADMIN_PASSWORD}\"}" \
                | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
              [ -n "${token}" ] || { echo "LLDAP admin login failed"; exit 1; }
              gql() { curl -fsS -X POST "${url}/api/graphql" -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data "$1"; }
              groups=$(gql '{"query":"{ groups { id displayName } }"}' 2>/dev/null || true)
              gid() { printf '%s' "${groups}" | tr '{' '\n' | grep -F "\"displayName\":\"$1\"" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9][0-9]*'; }
              ensure() {
                gql "{\"query\":\"mutation(\$u:CreateUserInput!){createUser(user:\$u){id}}\",\"variables\":{\"u\":{\"id\":\"$1\",\"displayName\":\"$1\"}}}" >/dev/null 2>&1 || true
                g=$(gid "$3" || true)
                if [ -n "${g}" ]; then
                  gql "{\"query\":\"mutation(\$u:String!,\$g:Int!){addUserToGroup(userId:\$u,groupId:\$g){__typename}}\",\"variables\":{\"u\":\"$1\",\"g\":${g}}}" >/dev/null 2>&1 || true
                fi
                /app/lldap_set_password --base-url "${url}" --admin-username admin --admin-password "${LLDAP_ADMIN_PASSWORD}" --username "$1" --password "$2"
                echo "==> service account $1 ready ($3)"
              }
              ensure "${BIND_USERNAME}" "${BIND_PASSWORD}" "${BIND_GROUP}"
              ensure "${ADMIN_USERNAME}" "${ADMIN_PASSWORD}" "${ADMIN_GROUP}"
          env:
            - name: LLDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lldap-credentials
                  key: LLDAP_LDAP_USER_PASS
            - { name: BIND_USERNAME, value: {{ $sa.bind.username | quote }} }
            - { name: BIND_PASSWORD, value: {{ $sa.bind.password | quote }} }
            - { name: BIND_GROUP, value: {{ $sa.bind.group | quote }} }
            - { name: ADMIN_USERNAME, value: {{ $sa.admin.username | quote }} }
            - { name: ADMIN_PASSWORD, value: {{ $sa.admin.password | quote }} }
            - { name: ADMIN_GROUP, value: {{ $sa.admin.group | quote }} }
{{- end }}
