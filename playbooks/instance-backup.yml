---
# Velero backup for a catalog instance workload (invoked by fleet-site-controller Job).
- name: Instance backup
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fleet_backup_velero_version: "{{ fleet_velero_version | default('v1.15.2') }}"
    fleet_backup_velero_cli: /tmp/velero
    fleet_backup_hub_kc: /etc/kube/config
    fleet_backup_artifact_secret: "{{ fleet_instance_backup_artifact_secret | default('') }}"
    fleet_backup_cr_name: "{{ fleet_instance_backup_cr_name | default('') }}"
    fleet_backup_velero_name: "{{ fleet_instance_backup_velero_name | default('') }}"
  tasks:
    - name: Require backup parameters
      ansible.builtin.assert:
        that:
          - fleet_instance_backup_cluster | length > 0
          - fleet_instance_backup_instance_id | length > 0
          - fleet_instance_backup_release | length > 0
          - fleet_backup_velero_name | length > 0
          - fleet_backup_artifact_secret | length > 0

    - name: Download Velero CLI
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          if [[ ! -x {{ fleet_backup_velero_cli }} ]]; then
            curl -fsSL "https://github.com/vmware-tanzu/velero/releases/download/{{ fleet_backup_velero_version }}/velero-{{ fleet_backup_velero_version }}-linux-amd64.tar.gz" \
              | tar -xz -C /tmp
            mv "/tmp/velero-{{ fleet_backup_velero_version }}-linux-amd64/velero" {{ fleet_backup_velero_cli }}
            chmod +x {{ fleet_backup_velero_cli }}
          fi
        executable: /bin/bash
      changed_when: false

    - name: Fetch spoke kubeconfig
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          kubectl --kubeconfig={{ fleet_backup_hub_kc }} -n fleet-system get secret "fleet-kubeconfig-{{ fleet_instance_backup_cluster }}" \
            -o jsonpath='{.data.kubeconfig}' | base64 -d > /tmp/spoke-kc.yaml
        executable: /bin/bash
      changed_when: false

    - name: Create Velero backup
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          export KUBECONFIG=/tmp/spoke-kc.yaml
          {{ fleet_backup_velero_cli }} backup create {{ fleet_backup_velero_name }} \
            --include-namespaces "{{ fleet_instance_backup_namespace | default('default') }}" \
            --selector "app.kubernetes.io/instance={{ fleet_instance_backup_release }}" \
            --labels "fleet.umkim.com/instance-id={{ fleet_instance_backup_instance_id }},fleet.umkim.com/backup=enabled" \
            --wait={{ fleet_instance_backup_wait | default(true) | bool | lower }}
        executable: /bin/bash
      register: velero_backup

    - name: Export DCM instance manifest
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          curl -sf "{{ fleet_site_dcm_api_url | default('http://gateway.dcm.svc.cluster.local/api/v1alpha1') }}/catalog-item-instances/{{ fleet_instance_backup_instance_id }}" \
            > /tmp/dcm-instance.json
        executable: /bin/bash
      changed_when: false

    - name: Store DCM export in Secret
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          kubectl --kubeconfig={{ fleet_backup_hub_kc }} -n {{ fleet_site_controller_namespace | default('fleet-console') }} \
            create secret generic {{ fleet_backup_artifact_secret }} \
            --from-file=dcm-instance.json=/tmp/dcm-instance.json \
            --from-literal=velero-backup-name={{ fleet_backup_velero_name }} \
            --dry-run=client -o yaml | kubectl --kubeconfig={{ fleet_backup_hub_kc }} apply -f -
        executable: /bin/bash
      no_log: true

    - name: Patch backup CR status velero name
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          kubectl --kubeconfig={{ fleet_backup_hub_kc }} -n {{ fleet_site_controller_namespace | default('fleet-console') }} \
            patch fleetinstancebackup {{ fleet_backup_cr_name }} --type=merge \
            -p '{"status":{"veleroBackupName":"{{ fleet_backup_velero_name }}"}}' \
            --subresource=status || true
        executable: /bin/bash
      when: fleet_backup_cr_name | length > 0
