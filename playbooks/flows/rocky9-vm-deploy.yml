---
# Deploy rocky9-vm catalog instance (bridge LAN + cloud-init).
#
#   ansible-playbook $INV playbooks/flows/rocky9-vm-deploy.yml \
#     -e @playbooks/flows/examples/rocky9-vm-lab-ext02.yml

- name: Fleet flow | Deploy rocky9-vm instance
  hosts: hub
  gather_facts: false
  vars:
    fleet_flow_dcm_api: "{{ fleet_dcm_seed_api_url | default('http://127.0.0.1:' ~ (phase5_gateway_nodeport | default(30908)) ~ '/api/v1alpha1') }}"
    fleet_flow_vm_catalog_item_id: rocky9-vm
    fleet_flow_vm_workload_profile: kubevirt-test
    fleet_flow_vm_placement_scope: single
  tasks:
    - name: Require flow variables
      ansible.builtin.assert:
        that:
          - fleet_flow_vm_name is defined
          - fleet_flow_vm_name | length > 0
          - fleet_flow_cluster is defined
          - fleet_flow_cluster | length > 0
          - fleet_flow_vm_ip is defined
          - fleet_flow_vm_ip | length > 0
          - fleet_flow_ssh_public_key is defined
          - fleet_flow_ssh_public_key | length > 0
        fail_msg: >-
          Set fleet_flow_vm_name, fleet_flow_cluster, fleet_flow_vm_ip, and fleet_flow_ssh_public_key.
      tags: [fleet_flow_rocky9_vm]

    - name: Build catalog instance body
      ansible.builtin.set_fact:
        fleet_flow_rocky_body: >-
          {{
            {
              'api_version': 'v1alpha1',
              'display_name': fleet_flow_vm_name,
              'spec': {
                'catalog_item_id': fleet_flow_vm_catalog_item_id,
                'label_selector': {
                  'fleet.workload/profile': fleet_flow_vm_workload_profile,
                  'fleet.placement/scope': fleet_flow_vm_placement_scope,
                },
                'user_values': [
                  {'path': 'metadata.name', 'value': fleet_flow_vm_name},
                  {'path': 'vcpu.count', 'value': (fleet_flow_vm_vcpu | default(2) | int)},
                  {'path': 'memory.size', 'value': (fleet_flow_vm_memory | default('2GB'))},
                  {'path': 'storage.disks', 'value': [
                    {'name': 'boot', 'capacity': (fleet_flow_vm_disk | default('20GB'))}
                  ]},
                  {'path': 'access.ssh_public_key', 'value': fleet_flow_ssh_public_key},
                  {'path': 'network.mode', 'value': 'bridge'},
                  {'path': 'network.multus_network', 'value': (fleet_flow_vm_multus_network | default('default/mgmt-l2'))},
                  {'path': 'network.ip', 'value': fleet_flow_vm_ip},
                  {'path': 'network.gateway', 'value': (fleet_flow_vm_gateway | default('192.168.1.1'))},
                  {'path': 'network.nameservers', 'value': (fleet_flow_vm_nameservers | default(['192.168.1.1']))},
                  {'path': 'routing.cluster', 'value': fleet_flow_cluster},
                ],
              },
            }
          }}
      tags: [fleet_flow_rocky9_vm]

    - name: POST catalog-item-instance
      ansible.builtin.uri:
        url: "{{ fleet_flow_dcm_api }}/catalog-item-instances"
        method: POST
        body_format: json
        status_code: [200, 201, 409]
        body: "{{ fleet_flow_rocky_body }}"
      register: fleet_flow_rocky_create
      tags: [fleet_flow_rocky9_vm]

    - name: Deploy result
      ansible.builtin.debug:
        msg: >-
          rocky9-vm {{ fleet_flow_vm_name }} on {{ fleet_flow_cluster }}
          IP {{ fleet_flow_vm_ip }} (HTTP {{ fleet_flow_rocky_create.status }}).
          Wait for CDI import + VMI Running, then: ping {{ fleet_flow_vm_ip }}
          ssh -i <key> rocky@{{ fleet_flow_vm_ip | regex_replace('/.*$','') }}
      tags: [fleet_flow_rocky9_vm]
