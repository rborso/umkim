---
# API-first cluster delete (console-equivalent).
#
# Default: detach from fleet (keeps K3s + user workloads).
# Set fleet_flow_cleanup_kubernetes=true to reset K3s on all nodes.
# Set fleet_flow_cleanup_apps=true to uninstall the cluster's applications first
# (needs the spoke reachable; independent of the flags below).
# Set fleet_flow_cleanup_storage=true to delete the cluster's NFS export
# directory on the storage host (this deletes data; independent of the others).
# Set fleet_flow_cleanup_vms=true to also destroy the site VMs backing the cluster
# (YAIDAP sites only; implies the Kubernetes reset).
# Set fleet_flow_cleanup_vm_declarations=true to also drop the destroyed guests
# from the site inventory (implies fleet_flow_cleanup_vms).
#
#   ansible-playbook $INV playbooks/flows/cluster-delete.yml \
#     -e fleet_flow_cluster_name=CLUSTER \
#     -e fleet_flow_cleanup_kubernetes=true

- name: Fleet flow | Cluster delete
  hosts: hub
  gather_facts: false
  become: false
  vars:
    _flow_api_default: http://127.0.0.1:18080/api/v1alpha1
    _flow_poll_interval_default: 20
    _flow_poll_retries_default: 30
  tasks:
    - name: Require cluster name
      ansible.builtin.assert:
        that:
          - fleet_flow_cluster_name | length > 0

    - name: Build delete query
      ansible.builtin.set_fact:
        fleet_flow_delete_query: >-
          {{ ['cleanupKubernetes=true' if (fleet_flow_cleanup_kubernetes | default(false) | bool
              or fleet_flow_cleanup_vms | default(false) | bool
              or fleet_flow_cleanup_vm_declarations | default(false) | bool) else '',
              'cleanupVms=true' if (fleet_flow_cleanup_vms | default(false) | bool
              or fleet_flow_cleanup_vm_declarations | default(false) | bool) else '',
              'cleanupVmDeclarations=true' if (fleet_flow_cleanup_vm_declarations | default(false) | bool) else '',
              'cleanupApps=true' if (fleet_flow_cleanup_apps | default(false) | bool) else '',
              'cleanupStorage=true' if (fleet_flow_cleanup_storage | default(false) | bool) else '']
             | select('!=', '') | join('&') }}

    - name: Build delete URL
      ansible.builtin.set_fact:
        fleet_flow_delete_url: >-
          {{ fleet_flow_api_url | default(_flow_api_default) }}/clusters/{{ fleet_flow_cluster_name }}{{
            ('?' ~ fleet_flow_delete_query) if (fleet_flow_delete_query | length > 0) else ''
          }}

    - name: DELETE /clusters/{name}
      ansible.builtin.uri:
        url: "{{ fleet_flow_delete_url }}"
        method: DELETE
        headers:
          X-Fleet-Subject-Kind: User
          X-Fleet-Subject-Name: fleet-flow
          X-Fleet-DC-Admin: "true"
        status_code: [202, 204, 404]
      register: fleet_flow_delete

    - name: Wait until cluster removed from API
      ansible.builtin.uri:
        url: "{{ fleet_flow_api_url | default(_flow_api_default) }}/clusters/{{ fleet_flow_cluster_name }}"
        method: GET
        status_code: [200, 404]
      register: fleet_flow_delete_poll
      until: fleet_flow_delete_poll.status == 404
      retries: "{{ fleet_flow_poll_retries | default(_flow_poll_retries_default) }}"
      delay: "{{ fleet_flow_poll_interval | default(_flow_poll_interval_default) }}"
      when: fleet_flow_delete.status != 404

    - name: Flow complete
      ansible.builtin.debug:
        msg: >-
          Cluster {{ fleet_flow_cluster_name }} deleted{{
            ' (applications uninstalled)' if (fleet_flow_cleanup_apps | default(false) | bool) else ''
          }}{{
            ' (K3s reset on nodes)' if (fleet_flow_cleanup_kubernetes | default(false) | bool
              or fleet_flow_cleanup_vms | default(false) | bool
              or fleet_flow_cleanup_vm_declarations | default(false) | bool) else ''
          }}{{
            ' (site VMs destroyed)' if (fleet_flow_cleanup_vms | default(false) | bool
              or fleet_flow_cleanup_vm_declarations | default(false) | bool) else ''
          }}{{
            ' (VM declarations removed)' if (fleet_flow_cleanup_vm_declarations | default(false) | bool) else ''
          }}{{
            ' (storage export deleted)' if (fleet_flow_cleanup_storage | default(false) | bool) else ''
          }}
