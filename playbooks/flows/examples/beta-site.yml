# Org beta registry site — dedicated hardware + site routing for beta-lab02.
# Point DNS for *.homelab.example.com at the site edge (router WAN / reverse proxy).
#   ansible-playbook $INV playbooks/flows/site-create.yml -e @playbooks/flows/examples/beta-site.yml

fleet_flow_site_name: beta-site
fleet_flow_site_spec:
  siteName: beta-site
  siteId: beta-site
  orgId: beta
  provisioningMode: registry
  displayName: Beta dedicated site (homelab edge)
  region: homelab
  edge:
    edgeDomain: homelab.example.com
    wildcard: "*.homelab.example.com"
    exposureMode: port_forward
    defaultExposureMode: port_forward
    externalEndpoints:
      - id: router-wan
        address: "203.0.113.1"
        role: primary
        description: Site edge WAN — port-forward to beta-lab02 NodePorts
    domains:
      - id: site-zone
        zone: homelab.example.com
        wildcard: "*.homelab.example.com"
        tlsPolicy: acme_cluster
        ingressEndpointId: router-wan
    wanEgress:
      enabled: true
      dnsTargetNote: "homelab.example.com → site edge 203.0.113.1 → beta-lab02 :30080/:30443"
