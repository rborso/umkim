fleet_flow_site_name: homelab
fleet_flow_site_spec:
  siteName: homelab
  siteId: homelab
  provisioningMode: registry
  displayName: Homelab
  region: homelab
  edge:
    edgeDomain: apps.example.com
    wildcard: "*.apps.example.com"
    exposureMode: port_forward
    defaultExposureMode: port_forward
    domains:
      - id: homelab-zone
        zone: apps.example.com
        wildcard: "*.apps.example.com"
        tlsPolicy: acme_cluster
