# Deprecated alias — use beta-site.yml (org beta + site.example.com site routing).
fleet_flow_site_name: beta-site
fleet_flow_site_spec:
  siteName: beta-site
  siteId: beta-site
  orgId: beta
  provisioningMode: registry
  displayName: Beta dedicated site (homelab edge)
  region: homelab
  edge:
    edgeDomain: site.example.com
    wildcard: "*.site.example.com"
    exposureMode: port_forward
    defaultExposureMode: port_forward
    externalEndpoints:
      - id: router-wan
        address: "wan.example.com"
        role: primary
        description: Homelab DynDNS (wan.example.com) — port-forward to beta-lab02 NodePorts
    domains:
      - id: homelab-zone
        zone: site.example.com
        wildcard: "*.site.example.com"
        tlsPolicy: acme_cluster
        ingressEndpointId: router-wan
    wanEgress:
      enabled: true
      dnsTargetNote: "site.example.com CNAME → wan.example.com (DynDNS) → beta-lab02 (203.0.113.12) :30080/:30443"
