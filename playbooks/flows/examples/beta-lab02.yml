# beta-lab02 — dedicated single-node cluster for org beta.
# Site: beta-site (orgId=beta) with site DNS zone + ACME + Authelia.
# Cluster gets fleet.org=beta, fleet.pool=dedicated.
#
#   ansible-playbook $INV playbooks/flows/site-create.yml -e @playbooks/flows/examples/beta-site.yml
#   ansible-playbook $INV playbooks/flows/cluster-create.yml -e @playbooks/flows/examples/beta-lab02.yml \
#     --vault-password-file ~/.umkim-vault-pass

fleet_flow_cluster_name: beta-lab02
fleet_flow_site_id: beta-site
fleet_flow_bootstrap_host: 203.0.113.12
# Optional SSH jump (omit or set to your bastion):
# fleet_flow_jumphost: linux@jumphost.example.com:22
fleet_flow_topology: single_node
fleet_flow_domain_bindings:
  - site-zone
fleet_flow_edge:
  exposureMode: port_forward
  tlsPolicy: acme_cluster
  ingressEndpointId: router-wan
fleet_flow_install_k8s: true
fleet_flow_install_helm: true
fleet_flow_ingress_auth_password: "{{ beta_lab02_lldap_password_vault }}"
fleet_flow_cluster_labels:
  fleet.pool: dedicated
fleet_flow_nodes:
  - hostname: beta-lab02
    address: 203.0.113.12
    role: control

# Single-node local NFS (node exports /srv/fleet-nfs for RWX without external server).
fleet_flow_storage:
  backend: nfs_local
  rwo: true
  rwx: true
  nfs:
    exportBase: /srv/fleet-nfs
    storageClass: nfs-client
