# lab-gpu03 — shared-pool GPU cluster for all orgs + LLM inference.
# Site: homelab-shared (platform, no orgId). After Ready, set pool=shared (dc-admin PATCH).
#
# 1. Site:
#   ansible-playbook $INV playbooks/flows/site-create.yml -e @playbooks/flows/examples/homelab-shared-site.yml
# 2. Host NVIDIA driver:
#   ansible-playbook $INV playbooks/flows/gpu-host-prep.yml -e @playbooks/flows/examples/lab-gpu03.yml
# 3. Cluster:
#   ansible-playbook $INV playbooks/flows/cluster-create.yml -e @playbooks/flows/examples/lab-gpu03.yml
# 4. GPU enable + shared pool:
#   ansible-playbook $INV playbooks/flows/gpu-cluster-enable.yml -e @playbooks/flows/examples/lab-gpu03.yml
#   curl -b $ADMIN_JAR -X PATCH .../clusters/lab-gpu03 -d '{"pool":"shared"}'

fleet_flow_cluster_name: lab-gpu03
fleet_flow_site_id: homelab-shared
fleet_flow_bootstrap_host: 203.0.113.13
# Optional SSH jump (omit or set to your bastion):
# fleet_flow_jumphost: linux@jumphost.example.com:22
fleet_flow_topology: single_node
fleet_flow_ingress_auth_password: ""
fleet_flow_install_k8s: true
fleet_flow_install_helm: true
fleet_flow_gpu: true
# Platform admin create may set shared; confirm with PATCH after Ready if needed.
fleet_flow_cluster_labels:
  fleet.pool: shared
fleet_flow_edge:
  exposureMode: none
fleet_flow_nodes:
  - hostname: lab-gpu03
    address: 203.0.113.13
    role: control
    gpu: true

gpu_host_driver_branch: "535"

# Single-node local NFS (node exports /srv/fleet-nfs for RWX without external server).
fleet_flow_storage:
  backend: nfs_local
  rwo: true
  rwx: true
  nfs:
    exportBase: /srv/fleet-nfs
    storageClass: nfs-client
