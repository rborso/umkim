# llama.cpp on lab-gpu03 (virt03 GTX 1050 Ti) — hub LLM proxy E2E.
#
#   ansible-playbook $INV playbooks/flows/llama-cpp-helm-deploy.yml \
#     -e @playbooks/flows/examples/llama-lab-gpu03.yml
#
# Model: Hugging Face GGUF repo + OpenAI model id (LiteLLM /llm/ must use values.model).
# Context: values.ctxSize → llama.cpp -c flag.

fleet_flow_cluster: lab-gpu03
fleet_flow_release_name: llama-cpp
fleet_flow_model: Qwen2.5-0.5B-Instruct
fleet_flow_hf_repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
fleet_flow_hf_quant: Q4_K_M
fleet_flow_ctx_size: 2048
