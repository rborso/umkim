---
fleet_flow_cluster_name: lab-ha-0
fleet_flow_site_id: homelab
fleet_flow_topology: ha_3_node
fleet_flow_bootstrap_host: 172.16.10.101
fleet_flow_control_plane_vip: 172.16.10.100
fleet_flow_jumphost: linux@jump.otthol.hu:30200
fleet_flow_ssh_user: linux
fleet_flow_min_root_disk_gi: 20
fleet_flow_install_k8s: false
fleet_flow_install_helm: false
fleet_flow_ingress_auth_password: "{{ fleet_lldap_admin_password_vault }}"
fleet_flow_storage:
  longhorn: { enabled: true, device: "", minDataDiskGi: 5 }
  localPath: { enabled: false }
fleet_flow_nodes:
  - { address: 172.16.10.101, hostname: lab-ha-0-cp1, role: control }
  - { address: 172.16.10.102, hostname: lab-ha-0-cp2, role: control }
  - { address: 172.16.10.103, hostname: lab-ha-0-cp3, role: control }
  - { address: 172.16.10.140, hostname: lab-ha-0-w1, role: worker }
