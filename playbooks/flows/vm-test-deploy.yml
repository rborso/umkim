---
# Deploy a vm-test catalog instance via DCM API (kubevirt provider must be Ready on target cluster).
#
#   ansible-playbook $INV playbooks/flows/vm-test-deploy.yml \
#     -e @playbooks/flows/examples/vm-test-lab-int01.yml
#
# Prereqs:
#   curl -sf -X POST http://127.0.0.1:18080/api/v1alpha1/clusters/<name>/providers/kubevirt/install
#   ansible-playbook $INV fleet-dcm.yml -l hub --tags dcm_seed_vm

- name: Fleet flow | Deploy vm-test instance
  hosts: hub
  gather_facts: false
  vars:
    fleet_flow_dcm_api: "{{ fleet_dcm_seed_api_url | default('http://127.0.0.1:' ~ (phase5_gateway_nodeport | default(30908)) ~ '/api/v1alpha1') }}"
    fleet_flow_vm_catalog_item_id: vm-test
    fleet_flow_vm_workload_profile: kubevirt-test
    fleet_flow_vm_placement_scope: single
  tasks:
    - name: Require flow variables
      ansible.builtin.assert:
        that:
          - fleet_flow_vm_name is defined
          - fleet_flow_vm_name | length > 0
          - fleet_flow_cluster is defined
          - fleet_flow_cluster | length > 0
        fail_msg: Set fleet_flow_vm_name and fleet_flow_cluster (target cluster with kubevirt provider Ready).
      tags: [fleet_flow_vm_test]

    - name: POST catalog-item-instance
      ansible.builtin.uri:
        url: "{{ fleet_flow_dcm_api }}/catalog-item-instances"
        method: POST
        body_format: json
        status_code: [200, 201, 409]
        body:
          api_version: v1alpha1
          display_name: "{{ fleet_flow_vm_name }}"
          spec:
            catalog_item_id: "{{ fleet_flow_vm_catalog_item_id }}"
            label_selector:
              fleet.workload/profile: "{{ fleet_flow_vm_workload_profile }}"
              fleet.placement/scope: "{{ fleet_flow_vm_placement_scope }}"
            user_values:
              - path: metadata.name
                value: "{{ fleet_flow_vm_name }}"
              - path: routing.cluster
                value: "{{ fleet_flow_cluster }}"
      register: fleet_flow_vm_create
      tags: [fleet_flow_vm_test]

    - name: Deploy result
      ansible.builtin.debug:
        msg: >-
          vm-test instance {{ fleet_flow_vm_name }} on {{ fleet_flow_cluster }}
          (HTTP {{ fleet_flow_vm_create.status }}).
          Verify: kubectl get vm -A -l dcm.instance/id
          on the spoke after placement completes.
      tags: [fleet_flow_vm_test]
