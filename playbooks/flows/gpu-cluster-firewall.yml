---
# Apply fleet_spoke_firewall on GPU cluster bootstrap hosts (lab flows).
#
#   ansible-playbook playbooks/flows/gpu-cluster-firewall.yml \
#     -e @playbooks/flows/examples/lab-gpu-0.yml
#   ansible-playbook playbooks/flows/gpu-cluster-firewall.yml \
#     -e @playbooks/flows/examples/lab-single-0-gpu.yml

- name: GPU cluster firewall | Register target node
  hosts: localhost
  gather_facts: false
  vars:
    _flow_remote_user_default: linux
  tasks:
    - name: Require flow variables
      ansible.builtin.assert:
        that:
          - fleet_flow_bootstrap_host | length > 0
        fail_msg: Set fleet_flow_bootstrap_host.

    - name: Parse jumphost user@host:port
      ansible.builtin.set_fact:
        fleet_flow_jump_ssh_user: "{{ fleet_flow_jumphost.split('@')[0] if ('@' in fleet_flow_jumphost) else (fleet_flow_ssh_user | default(_flow_remote_user_default)) }}"
        fleet_flow_jump_hostport: "{{ fleet_flow_jumphost.split('@')[-1] }}"
      when: fleet_flow_jumphost | default('') | length > 0

    - name: Build jumphost proxy args
      ansible.builtin.set_fact:
        fleet_flow_jump_host: "{{ fleet_flow_jump_hostport.split(':')[0] }}"
        fleet_flow_jump_port: "{{ fleet_flow_jump_hostport.split(':')[1] if (':' in fleet_flow_jump_hostport) else '22' }}"
      when: fleet_flow_jumphost | default('') | length > 0

    - name: Set fleet_flow_ssh_proxy
      ansible.builtin.set_fact:
        fleet_flow_ssh_proxy: '-o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -p {{ fleet_flow_jump_port }} -W %h:%p {{ fleet_flow_jump_ssh_user }}@{{ fleet_flow_jump_host }}"'
      when: fleet_flow_jumphost | default('') | length > 0

    - name: Register GPU firewall host
      ansible.builtin.add_host:
        name: "{{ fleet_flow_cluster_name | default('gpu-host') }}"
        ansible_host: "{{ fleet_flow_bootstrap_host }}"
        ansible_user: "{{ fleet_flow_ssh_user | default(_flow_remote_user_default) }}"
        ansible_ssh_common_args: "{{ fleet_flow_ssh_proxy | default('') }}"
        groups: gpu_prep_hosts

- name: GPU cluster firewall | firewalld for hub overlay + LLM
  hosts: gpu_prep_hosts
  become: true
  gather_facts: true
  vars:
    configure_firewalld: true
    fleet_spoke_firewall_enabled: true
  roles:
    - role: fleet_spoke_firewall
      tags: [fleet_spoke_firewall, gpu_firewall]
