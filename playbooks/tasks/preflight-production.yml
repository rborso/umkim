---
- name: Preflight | Optional sibling git pin enforcement
  ansible.builtin.import_tasks: preflight-git-pins.yml
  when: fleet_enforce_git_pins | default(false) | bool

- name: Preflight | Require hub WAN IPv4 for ACME
  ansible.builtin.assert:
    that:
      - not (fleet_edge_acme_enabled | default(false) | bool) or (
          (fleet_hub_public_ipv4 | default('') | length > 0)
          and (fleet_hub_public_ipv4 | default('')) is not search('CHANGE_ME')
          and (fleet_hub_public_ipv4 | default('')) != '127.0.0.1'
          and (fleet_hub_public_ipv4 | default('') | lower) != 'localhost'
        )
    fail_msg: >-
      Set fleet_hub_public_ipv4 in inventory/host_vars/<hub>.yml (hub WAN IPv4; same as hosts.yml ansible_host).
      Required for Let's Encrypt DNS checks and fleet-edge-controller probes.

- name: Preflight | Require VERSIONS.md
  ansible.builtin.stat:
    path: "{{ playbook_dir | dirname }}/VERSIONS.md"
  delegate_to: localhost
  become: false
  run_once: true
  register: _pf_versions
  failed_when: not _pf_versions.stat.exists

- name: Preflight | Require umkim_version
  ansible.builtin.assert:
    that:
      - umkim_version is defined
      - umkim_version | length > 0
      - umkim_version != 'main'
    fail_msg: "Production deploy requires umkim_version (see VERSIONS.md)."

- name: Preflight | Require LDAP for production console
  ansible.builtin.assert:
    that:
      - (fleet_auth_lldap_enabled | default(false) | bool) or (fleet_auth_lldap_enabled_profile | default(false) | bool)
    fail_msg: "Production requires fleet_auth_lldap_enabled (set fleet_profile=production or enable in hub.yml)."

- name: Preflight | Require secure session cookies
  ansible.builtin.assert:
    that:
      - (fleet_console_auth_session_secure | default(false) | bool) or (fleet_console_auth_session_secure_profile | default(false) | bool)
    fail_msg: "Production requires fleet_console_auth_session_secure (HTTPS console path)."

- name: Preflight | Reject placeholder DCM postgres password
  ansible.builtin.assert:
    that:
      - dcm_postgres_password is not search('ChangeMe')
      - dcm_postgres_password is not search('change-me')
      - dcm_postgres_password is not search('REPLACE_ME')
    fail_msg: "Set dcm_postgres_password_vault in encrypted vault.yml (docs/secrets.md)."

- name: Preflight | Reject placeholder Harbor admin password
  ansible.builtin.assert:
    that:
      - harbor_admin_password is not search('ChangeMe')
      - harbor_admin_password is not search('change-me')
      - harbor_admin_password is not search('REPLACE_ME')
    fail_msg: "Set harbor_admin_password_vault in encrypted vault.yml (docs/secrets.md)."

- name: Preflight | Reject placeholder console session secret
  ansible.builtin.assert:
    that:
      - fleet_console_auth_session_secret is not search('change-me')
      - fleet_console_auth_session_secret is not search('REPLACE_ME')
    fail_msg: "Set fleet_console_auth_session_secret_vault in encrypted vault.yml."

- name: Preflight | Fleet images must not use main tag
  ansible.builtin.assert:
    that:
      - harbor_fleet_image_tag | default('0.1.0') != 'main'
    fail_msg: "Production requires harbor_fleet_image_tag={{ umkim_version }}, not main."
