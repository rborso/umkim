---
- name: Preflight | Verify sibling git pins
  ansible.builtin.command:
    cmd: "{{ playbook_dir | dirname }}/scripts/fleet-verify-pins.sh --strict"
  delegate_to: localhost
  become: false
  environment:
    PINS_FILE: "{{ playbook_dir | dirname }}/inventory/group_vars/all/fleet_git_pins.yml"
  changed_when: false
