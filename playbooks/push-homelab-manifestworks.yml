---
- name: Push UMKIM platform ManifestWorks to homelab spokes
  hosts: hub
  become: true
  gather_facts: false
  vars:
    ocm_register_cluster_names: "{{ groups['spokes'] }}"
    ocm_manifestwork_clusters: "{{ groups['spokes'] }}"
  tasks:
    - ansible.builtin.import_role:
        name: ocm
        tasks_from: push_umkim_manifestworks.yml
