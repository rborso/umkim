---
# Install KubeVirt platform + kubevirt-service-provider on a console-provisioned cluster.
#
#   ansible-playbook cluster-provider-kubevirt-install.yml -e fleet_cluster_name=my-cluster \
#     -e fleet_site_dcm_kubevirt_sp_nodeport=30220 -e fleet_site_sp_endpoint=10.10.0.15 \
#     -i inventory/from-controller.ini

- name: Fleet cluster provider | KubeVirt platform on cluster
  hosts: site_bootstrap
  become: true
  gather_facts: false
  vars:
    fleet_site_name: "{{ fleet_cluster_name }}"
    fleet_site_enable_kubevirt: true
    ocm_kubeconfig: /etc/rancher/k3s/k3s.yaml
    k3s_command_path: /usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  tasks:
    - ansible.builtin.import_role:
        name: fleet_site
        tasks_from: push_site_kubevirt_platform.yml
      tags: [fleet_cluster_provider, fleet_cluster_provider_kubevirt]

- name: Fleet cluster provider | Install kubevirt SP
  hosts: hub
  become: true
  gather_facts: false
  vars:
    fleet_site_name: "{{ fleet_cluster_name }}"
    fleet_site_ocm_name: "{{ fleet_cluster_name }}"
    fleet_site_wg_ip: "{{ fleet_site_sp_endpoint }}/32"
    harbor_host: "{{ fleet_hub_wireguard_ip | default('10.10.0.1') }}"
    phase5_kubevirt_sp_manifestwork_name: phase5-kubevirt-sp
    phase5_manifestwork_name: phase5-kubevirt-sp
  tasks:
    - ansible.builtin.import_role:
        name: fleet_site
        tasks_from: push_site_kubevirt_sp.yml
      tags: [fleet_cluster_provider, fleet_cluster_provider_kubevirt]
