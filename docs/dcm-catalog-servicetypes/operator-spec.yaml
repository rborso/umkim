# Reference servicetype for dcm-project/catalog-manager (upstream).
# Copy to: api/v1alpha1/servicetypes/operator/spec.yaml
#
# UMKIM seeds catalog items with service_type: operator using these field paths.

name: operator
schemaVersion: v1alpha1
description: Install an OLM Subscription (tenant operator) on a workload cluster.

fields:
  - path: metadata.name
    display_name: Subscription name
    editable: true
    required: true
    validation_schema:
      type: string

  - path: subscription.package
    display_name: OLM package name
    editable: true
    default: cloudnative-pg
    validation_schema:
      type: string

  - path: subscription.channel
    display_name: OLM channel
    editable: true
    default: stable-v1
    validation_schema:
      type: string

  - path: subscription.source
    display_name: CatalogSource name
    editable: true
    default: operatorhubio-catalog
    validation_schema:
      type: string

  - path: subscription.sourceNamespace
    display_name: CatalogSource namespace
    editable: true
    default: olm
    validation_schema:
      type: string

  - path: operatorGroup.targetNamespace
    display_name: Operator target namespace
    editable: true
    default: operators
    validation_schema:
      type: string

  - path: installPlanApproval
    display_name: InstallPlan approval
    editable: true
    default: Automatic
    validation_schema:
      type: string
      enum: [Automatic, Manual]

provider_hints:
  serviceType: operator
  operations: [CREATE, DELETE, READ]
