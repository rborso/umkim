# Reference servicetype for dcm-project/catalog-manager (upstream).
# Copy to: api/v1alpha1/servicetypes/helm/spec.yaml
#
# UMKIM seeds catalog items with service_type: helm using these field paths.
#
# Values overlay convention: paths prefixed with "values." are UI projections into
# the Helm values blob. Undeclared keys in the catalog values.default stay hidden.
# On deploy the console collapses overlays + defaults + optional full YAML into one
# user_values entry: { path: values, value: <merged YAML string> }.
# Catalog items with values.* overlay fields may store values.default as an object
# (no type constraint on that field) so DCM can merge overlay defaults; the console
# always sends the final Helm blob as a YAML string.

name: helm
schemaVersion: v1alpha1
description: Install or upgrade a Helm chart release from Harbor OCI or an allowed external OCI registry (docker.io, quay.io, ghcr.io, …) on a workload cluster.

fields:
  - path: metadata.name
    display_name: Helm release name
    editable: true
    required: true
    ui_tier: required
    ui_widget: dns-label
    validation_schema:
      type: string

  - path: chart.repository
    display_name: Chart OCI repository prefix
    editable: false
    default: oci://10.10.0.1:30443/charts
    validation_schema:
      type: string

  - path: chart.name
    display_name: Chart name
    editable: false
    validation_schema:
      type: string

  - path: chart.version
    display_name: Chart version
    editable: false
    validation_schema:
      type: string

  - path: release.namespace
    display_name: Target namespace
    editable: true
    ui_tier: common
    default: default
    validation_schema:
      type: string

  - path: values
    display_name: Helm values (full YAML)
    editable: true
    ui_tier: advanced
    ui_widget: yaml
    validation_schema:
      type: string
      format: yaml

  # Example values overlay (per-catalog; not all helm items need this)
  - path: values.fleet.ingress.baseDomain
    display_name: Base domain for per-app hostnames
    editable: true
    ui_tier: common
    ui_widget: domain
    required: true
    validation_schema:
      type: string

  - path: install.wait
    display_name: Wait for resources
    editable: true
    ui_tier: advanced
    ui_widget: boolean
    default: "true"
    validation_schema:
      type: string

  - path: install.timeout
    display_name: Install timeout (seconds)
    editable: true
    ui_tier: advanced
    ui_widget: number
    default: "600"
    validation_schema:
      type: integer
      minimum: 60

  - path: install.atomic
    display_name: Atomic install
    editable: true
    ui_tier: advanced
    ui_widget: boolean
    default: "true"
    validation_schema:
      type: string

# Console-only extensions (under validation_schema unless noted):
#
# x-ui-depends-on — show field only when another field matches:
#   { path: "values.__preset.database", equals: "postgres" }
#   { path: "routing.mode", in: ["hub", "site"] }
#   { path: "routing.mode", notEquals: "none" }
# Console renders dependents immediately under the controlling field (same UI tier as parent).
#
# x-value-preset — virtual selector at values.__preset.<name>; drives multiple values.* keys:
#   enum sqlite3/postgres sets gitea.postgresql.enabled, sqlite.enabled, DB_TYPE, etc.
#
# x-sensitive — password/secret; never stored in DCM user_values (fleet-site spoke Secret).
#
# x-secret-bind — maps sensitive overlay to spoke Secret + chart existingSecret:
#   secretName: "{{release}}-admin"  ({{release}} = metadata.name)
#   secretKey: password
#   secretDataFrom: { username: values.gitea.gitea.admin.username }
#   valuesSet: { gitea.gitea.admin.existingSecret: "{{secretName}}" }
#   valuesClear: [gitea.gitea.admin.password]
#
# depends_on (top-level field, control-plane) — server-side allowed-values constraint;
# console filters enum options (pet-clinic database.version per database.engine).

provider_hints:
  serviceType: helm
  operations: [CREATE, DELETE, READ]
