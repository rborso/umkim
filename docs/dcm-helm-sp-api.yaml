openapi: 3.0.3
info:
  title: fleet-helm-release-sp API
  version: v1alpha1
paths:
  /api/v1alpha1/releases/health:
    get:
      summary: Health check
  /api/v1alpha1/releases:
    post:
      summary: Create or upgrade release (helm upgrade --install)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
  /api/v1alpha1/releases/{id}:
    get:
      summary: Release status
    delete:
      summary: Uninstall release
  /api/v1alpha1/releases/{id}/history:
    get:
      summary: Helm release history
  /api/v1alpha1/releases/{id}/rollback:
    post:
      summary: Rollback to revision
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
components:
  schemas:
    CreateRequest:
      type: object
      properties:
        resource_id:
          type: string
        user_values:
          type: array
          items:
            $ref: '#/components/schemas/UserValue'
    UserValue:
      type: object
      properties:
        path:
          type: string
        value: {}
    ReleaseStatus:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        revision:
          type: integer
        message:
          type: string
