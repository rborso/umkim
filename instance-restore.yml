---
# Velero restore for a catalog instance workload (invoked by fleet-site-controller Job).
- name: Instance restore
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fleet_backup_velero_version: "{{ fleet_velero_version | default('v1.15.2') }}"
    fleet_backup_velero_cli: /tmp/velero
    fleet_backup_hub_kc: /etc/kube/config
    fleet_restore_velero_backup: "{{ fleet_instance_restore_velero_backup | default('') }}"
    fleet_restore_velero_restore_name: "{{ fleet_instance_restore_velero_restore_name | default('') }}"
  tasks:
    - name: Require restore parameters
      ansible.builtin.assert:
        that:
          - fleet_instance_restore_target_cluster | length > 0
          - fleet_instance_restore_release | length > 0
          - fleet_restore_velero_backup | length > 0
          - fleet_restore_velero_restore_name | length > 0

    - name: Download Velero CLI
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          if [[ ! -x {{ fleet_backup_velero_cli }} ]]; then
            curl -fsSL "https://github.com/vmware-tanzu/velero/releases/download/{{ fleet_backup_velero_version }}/velero-{{ fleet_backup_velero_version }}-linux-amd64.tar.gz" \
              | tar -xz -C /tmp
            mv "/tmp/velero-{{ fleet_backup_velero_version }}-linux-amd64/velero" {{ fleet_backup_velero_cli }}
            chmod +x {{ fleet_backup_velero_cli }}
          fi
        executable: /bin/bash
      changed_when: false

    - name: Fetch spoke kubeconfig
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          kubectl --kubeconfig={{ fleet_backup_hub_kc }} -n fleet-system get secret "fleet-kubeconfig-{{ fleet_instance_restore_target_cluster }}" \
            -o jsonpath='{.data.kubeconfig}' | base64 -d > /tmp/spoke-kc.yaml
        executable: /bin/bash
      changed_when: false

    - name: Restore Velero backup
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          export KUBECONFIG=/tmp/spoke-kc.yaml
          {{ fleet_backup_velero_cli }} restore create {{ fleet_restore_velero_restore_name }} \
            --from-backup {{ fleet_restore_velero_backup }} \
            --include-namespaces "{{ fleet_instance_restore_namespace | default('default') }}" \
            --selector "app.kubernetes.io/instance={{ fleet_instance_restore_release }}" \
            --wait
        executable: /bin/bash
      register: velero_restore
