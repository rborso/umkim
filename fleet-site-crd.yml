---
# Install FleetSite CRD on the hub.
#
#   ansible-playbook fleet-site-crd.yml -l hub

- name: Fleet site CRD on hub
  hosts: hub
  become: true
  gather_facts: false
  tags: [fleet_site_crd, fleet_site]
  tasks:
    - name: Fleet site | Copy CRD manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/deploy/fleet-site/crd-fleetsite.yaml"
        dest: /tmp/fleetsite-crd.yaml
        mode: "0644"
      tags: [fleet_site_crd, fleet_site]

    - name: Fleet site | Apply CRD
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/fleetsite-crd.yaml
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig }}"
        PATH: "{{ k3s_command_path }}"
      register: fleet_site_crd_apply
      changed_when: >-
        'created' in fleet_site_crd_apply.stdout
        or 'configured' in fleet_site_crd_apply.stdout
      tags: [fleet_site_crd, fleet_site]

    - name: Fleet site | Wait for CRD Established
      ansible.builtin.command:
        cmd: >-
          kubectl wait --for=condition=Established crd/fleetsites.fleet.umkim.com
          --timeout=120s
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig }}"
        PATH: "{{ k3s_command_path }}"
      changed_when: false
      tags: [fleet_site_crd, fleet_site]

    - name: Fleet cluster join | Copy CRD manifest
