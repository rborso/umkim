---
# Hub Job playbook: run a YAIDAP action on a site jumphost.
#
# Inventory must define group [jumphost] with ansible_host / ansible_user.
# Extra vars (from fleet-site Job):
#   fleet_provision_action, fleet_provision_subject, fleet_provision_confirm
#   fleet_provision_inventory_path, fleet_provision_yaidap_root
#   fleet_provision_playbook, fleet_provision_tags, fleet_provision_extra (optional)
#   fleet_provision_sync_host, fleet_provision_vm_location, fleet_provision_memory,
#   fleet_provision_cores, fleet_provision_os (optional hub→YAIDAP inventory sync)

- name: Fleet site provision connector | YAIDAP on jumphost
  hosts: jumphost
  gather_facts: false
  become: false
  vars:
    fleet_provision_yaidap_root: "{{ fleet_provision_yaidap_root | default('~/yaidap') }}"
    fleet_provision_confirm: "{{ fleet_provision_confirm | default(false) | bool }}"
    fleet_provision_guest_host_vars: "{{ fleet_provision_inventory_path }}/host_vars/{{ fleet_provision_subject }}.yml"
  tasks:
    - name: Require action and subject
      ansible.builtin.assert:
        that:
          - fleet_provision_action | default('') | length > 0
          - fleet_provision_inventory_path | default('') | length > 0
        fail_msg: Set fleet_provision_action and fleet_provision_inventory_path.
      when: fleet_provision_action != 'sync_inventory'

    - name: Require subject for non-inventory actions
      ansible.builtin.assert:
        that:
          - fleet_provision_subject | default('') | length > 0
        fail_msg: Set fleet_provision_subject.
      when: fleet_provision_action not in ['sync_inventory', 'import_inventory']

    - name: Push connector inventory bundle to jumphost
      when: >-
        fleet_provision_action == 'sync_inventory'
        or (fleet_provision_sync_from_store | default(false) | bool)
      block:
        - name: Require inventory bundle
          ansible.builtin.assert:
            that:
              - fleet_provision_inventory_bundle_b64 | default('') | length > 0
            fail_msg: fleet_provision_inventory_bundle_b64 is required for inventory sync.

        - name: Write projected inventory atomically
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_inventory_path }}"
            TMP="$(mktemp -d)"
            python3 - <<'PY' > "$TMP/manifest.json"
            import base64, json, os, sys
            raw = os.environ.get("BUNDLE_B64", "")
            data = json.loads(base64.b64decode(raw).decode())
            json.dump(data.get("files", {}), sys.stdout)
            PY
            cd "$TMP"
            python3 - <<'PY'
            import json, os, pathlib
            files = json.load(open("manifest.json"))
            for rel, content in files.items():
                path = pathlib.Path(rel)
                path.parent.mkdir(parents=True, exist_ok=True)
                path.write_text(content if content.endswith("\n") else content + "\n")
            PY
            rsync -a "$TMP"/*.yml "$ROOT/" 2>/dev/null || true
            mkdir -p "$ROOT/group_vars/all" "$ROOT/host_vars"
            if [ -d "$TMP/group_vars" ]; then
              rsync -a --delete "$TMP/group_vars/" "$ROOT/group_vars/"
            fi
            if [ -d "$TMP/host_vars" ]; then
              rsync -a --delete "$TMP/host_vars/" "$ROOT/host_vars/"
            fi
            rm -rf "$TMP"
            echo "FLEET_INVENTORY_SYNCED=1"
          environment:
            BUNDLE_B64: "{{ fleet_provision_inventory_bundle_b64 }}"
          args:
            executable: /bin/bash
          register: fleet_inventory_sync

        - name: Emit inventory sync marker
          ansible.builtin.debug:
            msg: "{{ fleet_inventory_sync.stdout | default('') | trim }}"

    - name: Import YAIDAP inventory from jumphost
      when: fleet_provision_action == 'import_inventory'
      block:
        - name: Collect jumphost inventory as JSON
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_inventory_path }}"
            python3 - <<'PY'
            import json, pathlib, yaml, sys
            root = pathlib.Path("{{ fleet_provision_inventory_path }}")
            out = {"guests": {}, "catalog": {}}
            guests_yml = root / "guests.yml"
            if guests_yml.exists():
                doc = yaml.safe_load(guests_yml.read_text()) or {}
                for name, entry in (doc.get("guests", {}).get("hosts") or {}).items():
                    out["guests"][name] = entry or {}
            hv = root / "host_vars"
            if hv.is_dir():
                for p in hv.glob("*.yml"):
                    name = p.stem
                    spec = yaml.safe_load(p.read_text()) or {}
                    out["guests"].setdefault(name, {})
                    out["guests"][name].update(spec)
            print(json.dumps(out))
            PY
          args:
            executable: /bin/bash
          register: fleet_import_payload

        - name: Emit import JSON for hub
          ansible.builtin.debug:
            msg: "FLEET_INVENTORY_IMPORT={{ fleet_import_payload.stdout | trim }}"

    - name: Stop after standalone inventory sync
      ansible.builtin.meta: end_play
      when: fleet_provision_action == 'sync_inventory'

    - name: Stop after standalone inventory import
      ansible.builtin.meta: end_play
      when: fleet_provision_action == 'import_inventory'

    - name: Import YAIDAP inventory preview from jumphost
      when: fleet_provision_action == 'import_inventory_preview'
      block:
        - name: Collect inventory files as JSON
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_inventory_path }}"
            python3 - <<'PY'
            import json, pathlib
            root = pathlib.Path("{{ fleet_provision_inventory_path }}")
            out = {}
            for p in sorted(root.glob("*.yml")):
                if p.name in ("guests.yml", "hypervisors.yml") or p.name.endswith(".yml"):
                    out[p.name] = p.read_text()
            gv = root / "group_vars"
            if gv.is_dir():
                for p in sorted(gv.rglob("*.yml")):
                    rel = str(p.relative_to(root))
                    out[rel] = p.read_text()
            hv = root / "host_vars"
            if hv.is_dir():
                for p in sorted(hv.glob("*.yml")):
                    out[f"host_vars/{p.name}"] = p.read_text()
            gen_hv = root / "generated" / "host_vars"
            if gen_hv.is_dir():
                for p in sorted(gen_hv.glob("*.yml")):
                    if ".notes." in p.name:
                        continue
                    rel = str(p.relative_to(root))
                    out[rel] = p.read_text()
            gen_hosts = root / "generated" / "hosts"
            if gen_hosts.is_dir():
                for p in sorted(gen_hosts.glob("*.yml")):
                    rel = str(p.relative_to(root))
                    out[rel] = p.read_text()
            print(json.dumps(out))
            PY
          args:
            executable: /bin/bash
          register: fleet_import_files_payload

        - name: Emit import files JSON for hub
          ansible.builtin.debug:
            msg: "FLEET_INVENTORY_FILES_B64={{ fleet_import_files_payload.stdout | trim | b64encode }}"

    - name: Stop after standalone inventory import preview
      ansible.builtin.meta: end_play
      when: fleet_provision_action == 'import_inventory_preview'

    - name: Resolve YAIDAP playbook defaults
      ansible.builtin.set_fact:
        _prov_playbook: "{{ fleet_provision_playbook | default('') }}"
        _prov_tags: "{{ fleet_provision_tags | default('') }}"
        _yaidap_extra_argv: >-
          {{
            (['-e', 'confirm_destroy=true']
              if fleet_provision_action == 'destroy' and (fleet_provision_confirm | default(false) | bool)
              else [])
            + (['-e', 'tempxe_confirm=true']
              if fleet_provision_action in ['install_bm', 'discover_pxe'] and (fleet_provision_confirm | default(false) | bool)
              else [])
            + (['-e', 'install_os=true']
              if fleet_provision_action in ['install_bm', 'discover_pxe'] and (fleet_provision_confirm | default(false) | bool)
              else [])
          }}

    - name: Fail when playbook mapping missing
      ansible.builtin.assert:
        that:
          - _prov_playbook | length > 0
        fail_msg: fleet_provision_playbook is required (set by hub connector).

    - name: Check YAIDAP guest host_vars before legacy sync
      ansible.builtin.stat:
        path: "{{ fleet_provision_guest_host_vars }}"
      register: fleet_guest_host_vars
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)

    - name: Create YAIDAP guest host_vars stub for legacy hub sync
      ansible.builtin.copy:
        dest: "{{ fleet_provision_guest_host_vars }}"
        content: |
          ---
          # Managed by UMKIM fleet-site provision connector.
        mode: "0644"
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)
        - not fleet_guest_host_vars.stat.exists | default(false)

    - name: Sync vm_location into YAIDAP guest host_vars
      ansible.builtin.lineinfile:
        path: "{{ fleet_provision_guest_host_vars }}"
        regexp: '^vm_location:\s*.*'
        line: "vm_location: {{ fleet_provision_vm_location }}"
        create: true
        mode: "0644"
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_vm_location | default('') | length > 0

    - name: Sync memory into YAIDAP guest host_vars
      ansible.builtin.lineinfile:
        path: "{{ fleet_provision_guest_host_vars }}"
        regexp: '^memory:\s*.*'
        line: "memory: {{ fleet_provision_memory }}"
        create: true
        mode: "0644"
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_memory | default('') | length > 0

    - name: Sync cores into YAIDAP guest host_vars
      ansible.builtin.lineinfile:
        path: "{{ fleet_provision_guest_host_vars }}"
        regexp: '^cores:\s*.*'
        line: "cores: {{ fleet_provision_cores }}"
        create: true
        mode: "0644"
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_cores | default('') | length > 0

    - name: Sync os into YAIDAP guest host_vars
      ansible.builtin.lineinfile:
        path: "{{ fleet_provision_guest_host_vars }}"
        regexp: '^os:\s*.*'
        line: "os: {{ fleet_provision_os }}"
        create: true
        mode: "0644"
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_os | default('') | length > 0

    - name: Derive lab MAC from ansible_host when provided
      ansible.builtin.set_fact:
        fleet_provision_mac_suffix: "{{ '%02x' | format(fleet_provision_ansible_host.split('.')[-2] | int) }}:{{ '%02x' | format(fleet_provision_ansible_host.split('.')[-1] | int) }}:01"
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_ansible_host | default('') | length > 0

    - name: Sync ansible_host into YAIDAP guest host_vars
      ansible.builtin.lineinfile:
        path: "{{ fleet_provision_guest_host_vars }}"
        regexp: '^ansible_host:\s*.*'
        line: "ansible_host: {{ fleet_provision_ansible_host }}"
        create: true
        mode: "0644"
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_ansible_host | default('') | length > 0

    - name: Require guest mgmt IP for VM create (legacy sync)
      ansible.builtin.assert:
        that:
          - fleet_provision_ansible_host | default('') | length > 0
        fail_msg: >-
          fleet_provision_ansible_host is required for create_vm (patch site host ansible_host before provision).
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_action in ['create_vm', 'plan_vm']

    - name: Require guest mgmt IP for VM create (connector store)
      ansible.builtin.shell: |
        set -euo pipefail
        ip=""
        if [ -f "{{ fleet_provision_guest_host_vars }}" ]; then
          ip=$(awk '/^ansible_host:/ { sub(/^ansible_host:[[:space:]]*/, ""); print; exit }' "{{ fleet_provision_guest_host_vars }}")
        fi
        test -n "$ip"
      args:
        executable: /bin/bash
      when:
        - fleet_provision_sync_from_store | default(false) | bool
        - fleet_provision_action in ['create_vm', 'plan_vm']

    - name: Resolve placed hypervisor for stale guest cleanup
      ansible.builtin.shell: |
        set -euo pipefail
        hv=""
        if [ -f "{{ fleet_provision_guest_host_vars }}" ]; then
          hv=$(awk '/^vm_location:/ { sub(/^vm_location:[[:space:]]*/, ""); print; exit }' "{{ fleet_provision_guest_host_vars }}")
        fi
        if [ -z "$hv" ] || [ "$hv" = "least-utilized" ] || [ "$hv" = "least_utilized" ]; then
          hv=$(awk -v n="{{ fleet_provision_subject }}" '$0 ~ "^[[:space:]]*" n ":[[:space:]]*$" { f=1; next } f && /^[[:space:]]+[A-Za-z0-9._-]+:[[:space:]]*$/ { exit } f && /^[[:space:]]+vm_location:[[:space:]]*/ { sub(/^.*vm_location:[[:space:]]*/, ""); print; exit }' "{{ fleet_provision_inventory_path }}/guests.yml" 2>/dev/null || true)
        fi
        echo "${hv:-}"
      args:
        executable: /bin/bash
      register: fleet_provision_resolved_hv
      changed_when: false
      when:
        - fleet_provision_action == 'create_vm'
        - >-
          (fleet_provision_sync_host | default(false) | bool)
          or (fleet_provision_sync_from_store | default(false) | bool)

    - name: Drop stale libvirt guest before create_vm re-provision
      ansible.builtin.shell: |
        set -euo pipefail
        ROOT="{{ fleet_provision_yaidap_root }}"
        cd "$ROOT"
        ansible-playbook "{{ _prov_playbook }}" \
          -i "{{ fleet_provision_inventory_path }}" \
          --limit "{{ fleet_provision_subject }}" \
          --tags destroy \
          -e confirm_destroy=true
      args:
        executable: /bin/bash
      register: fleet_preclean_destroy
      failed_when: false
      changed_when: fleet_preclean_destroy.rc == 0
      when:
        - fleet_provision_action == 'create_vm'
        - >-
          (fleet_provision_sync_host | default(false) | bool)
          or (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_resolved_hv.stdout | default('') | trim | length > 0

    - name: Ensure YAIDAP libvirt guest profile in host_vars
      ansible.builtin.blockinfile:
        path: "{{ fleet_provision_guest_host_vars }}"
        marker: "# {mark} UMKIM fleet-site VM profile"
        block: |
          os: {{ fleet_provision_os | default('rocky-10') }}
          legacy: false
          configure_firewalld: false
          provisioning_provider: libvirt
          memory: {{ fleet_provision_memory | default(4096) }}
          cores: {{ fleet_provision_cores | default(2) }}
          disks:
            - name: bootdisk
              disk: vda
              bootdisk: true
              device: 0
              format: qcow2
              size: {{ fleet_provision_disk_gi | default(40) }}
              storage: local
          uplinks:
            - name: n0p0
              physical_network: lab_access_l1
              mac_address: "52:54:00:{{ fleet_provision_mac_suffix | default('01:00:01') }}"
              networks:
                - zone: lab
                  network_name: lab_nw
                  model: virtio
                  cloudinit: true
                  pxe: false
                  vm_network: false
                  hypervisor_uplink: n0p0
                  bridge_name: n0p0_lab_nw
                  ip: "{{ fleet_provision_ansible_host }}"
                  default_route: true
                  tcp_open:
                    - 22
                  udp_open: []
                  services_open: []
        create: true
        mode: "0644"
      when:
        - fleet_provision_sync_host | default(false) | bool
        - not (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_action in ['create_vm', 'plan_vm']

    - name: Bare-metal install_bm composite workflow
      when: fleet_provision_action == 'install_bm'
      block:
        - name: Require confirm for install_bm
          ansible.builtin.assert:
            that:
              - fleet_provision_confirm | default(false) | bool
            fail_msg: install_bm requires fleet_provision_confirm=true

        - name: Resolve BM target ansible_host
          ansible.builtin.shell: |
            set -euo pipefail
            HV="{{ fleet_provision_inventory_path }}/hypervisors.yml"
            HV_VARS="{{ fleet_provision_inventory_path }}/host_vars/{{ fleet_provision_subject }}.yml"
            ip=""
            if [ -f "$HV" ]; then
              ip=$(python3 - <<'PY'
            import yaml, pathlib
            hv = pathlib.Path("{{ fleet_provision_inventory_path }}/hypervisors.yml")
            subj = "{{ fleet_provision_subject }}"
            doc = yaml.safe_load(hv.read_text()) or {}
            print((doc.get("hypervisors", {}).get("hosts", {}).get(subj) or {}).get("ansible_host", ""))
            PY
            )
            fi
            if [ -z "$ip" ] && [ -f "$HV_VARS" ]; then
              ip=$(awk '/^ansible_host:/ { sub(/^ansible_host:[[:space:]]*/, ""); print; exit }' "$HV_VARS")
            fi
            test -n "$ip"
            echo "$ip"
          args:
            executable: /bin/bash
          register: fleet_bm_target_ip
          changed_when: false

        - name: Refresh known_hosts before BM install SSH
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -R
              - "{{ fleet_bm_target_ip.stdout | trim }}"
          changed_when: true
          failed_when: false

        - name: Capture pre-install boot_id from BM target
          ansible.builtin.shell: |
            set -euo pipefail
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              linux@"{{ fleet_bm_target_ip.stdout | trim }}" \
              'cat /proc/sys/kernel/random/boot_id'
          args:
            executable: /bin/bash
          register: fleet_bm_old_boot_id
          changed_when: false
          failed_when: false

        - name: Arm and start TempXE for BM install
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_yaidap_root }}"
            cd "$ROOT"
            TAGS_ARGS=()
            if [ -n "{{ _prov_tags }}" ]; then
              TAGS_ARGS=(--tags "{{ _prov_tags }}")
            fi
            ansible-playbook "{{ _prov_playbook }}" \
              -i "{{ fleet_provision_inventory_path }}" \
              --limit "{{ fleet_provision_subject }}" \
              --connection local \
              "${TAGS_ARGS[@]}" \
              -e tempxe_confirm=true \
              -e install_os=true
          args:
            executable: /bin/bash
          register: fleet_bm_tempxe_start

        - name: PXE reboot BM target
          ansible.builtin.shell: |
            set -euo pipefail
            TARGET="{{ fleet_bm_target_ip.stdout | trim }}"
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "linux@${TARGET}" 'bash -s' <<'REMOTE'
            set -euo pipefail
            pxe_boot=""
            current=""
            while IFS= read -r line; do
              case "$line" in
                Boot[0-9A-F][0-9A-F][0-9A-F][0-9A-F]*)
                  current="${line%% *}"
                  current="${current#Boot}"
                  current="${current%\*}"
                  ;;
              esac
              case "$line" in
                *IPv4*|*PXE*|*Network*)
                  if [ -n "$current" ]; then
                    pxe_boot="$current"
                    break
                  fi
                  ;;
              esac
            done < <(sudo efibootmgr -v)
            if [ -z "$pxe_boot" ]; then
              echo "no UEFI IPv4/PXE boot entry found in efibootmgr -v" >&2
              exit 1
            fi
            order=$(sudo efibootmgr | awk -F': ' '/BootOrder/ {print $2; exit}')
            if [ -n "$order" ]; then
              sudo efibootmgr -o "${pxe_boot},${order}"
            fi
            sudo efibootmgr -n "$pxe_boot"
            sudo reboot
            REMOTE
          args:
            executable: /bin/bash
          register: fleet_bm_pxe_reboot
          changed_when: true

        - name: Wait for BM OS install to complete
          ansible.builtin.shell: |
            set -euo pipefail
            TARGET="{{ fleet_bm_target_ip.stdout | trim }}"
            OLD_ID="{{ fleet_bm_old_boot_id.stdout | default('') | trim }}"
            TIMEOUT="{{ fleet_provision_bm_wait_timeout | default(900) }}"
            START=$(date +%s)
            while true; do
              NOW=$(date +%s)
              if [ $((NOW - START)) -gt "$TIMEOUT" ]; then
                echo "timeout waiting for BM install on ${TARGET}" >&2
                exit 1
              fi
              if OUT=$(ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "linux@${TARGET}" \
                'bid=$(cat /proc/sys/kernel/random/boot_id); sudo test -s /root/ks-post.log && printf "%s" "$bid"' 2>/dev/null); then
                NEW_ID="$(printf '%s' "$OUT" | tr -d '[:space:]')"
                if [ -z "$OLD_ID" ] || [ "$NEW_ID" != "$OLD_ID" ]; then
                  echo "BM install complete boot_id=${NEW_ID}"
                  exit 0
                fi
              fi
              sleep 15
            done
          args:
            executable: /bin/bash
          register: fleet_bm_wait
          changed_when: true

        - name: Disarm TempXE after BM install
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_yaidap_root }}"
            cd "$ROOT"
            ansible-playbook "{{ _prov_playbook }}" \
              -i "{{ fleet_provision_inventory_path }}" \
              --limit "{{ fleet_provision_subject }}" \
              --connection local \
              --tags tempxe_stop
          args:
            executable: /bin/bash
          register: fleet_bm_tempxe_stop

        - name: Refresh known_hosts after BM reinstall
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -R
              - "{{ fleet_bm_target_ip.stdout | trim }}"
          changed_when: true
          failed_when: false

        - name: Show BM install recap
          ansible.builtin.debug:
            msg: >-
              install_bm {{ fleet_provision_subject }} complete
              ({{ fleet_bm_target_ip.stdout | trim }}).
              {{ fleet_bm_wait.stdout | default('') | trim }}

    - name: PXE discovery discover_pxe composite workflow
      when: fleet_provision_action == 'discover_pxe'
      block:
        - name: Require confirm for discover_pxe
          ansible.builtin.assert:
            that:
              - fleet_provision_confirm | default(false) | bool
            fail_msg: discover_pxe requires fleet_provision_confirm=true

        - name: Resolve PXE discovery target ansible_host
          ansible.builtin.shell: |
            set -euo pipefail
            HV="{{ fleet_provision_inventory_path }}/hypervisors.yml"
            HV_VARS="{{ fleet_provision_inventory_path }}/host_vars/{{ fleet_provision_subject }}.yml"
            ip=""
            if [ -f "$HV" ]; then
              ip=$(python3 - <<'PY'
            import yaml, pathlib
            hv = pathlib.Path("{{ fleet_provision_inventory_path }}/hypervisors.yml")
            subj = "{{ fleet_provision_subject }}"
            doc = yaml.safe_load(hv.read_text()) or {}
            print((doc.get("hypervisors", {}).get("hosts", {}).get(subj) or {}).get("ansible_host", ""))
            PY
            )
            fi
            if [ -z "$ip" ] && [ -f "$HV_VARS" ]; then
              ip=$(awk '/^ansible_host:/ { sub(/^ansible_host:[[:space:]]*/, ""); print; exit }' "$HV_VARS")
            fi
            echo "$ip"
          args:
            executable: /bin/bash
          register: fleet_pxe_disc_target_ip
          changed_when: false
          failed_when: false

        - name: Resolve PXE discovery target MAC
          ansible.builtin.shell: |
            set -euo pipefail
            python3 - <<'PY'
            import pathlib, yaml, re
            p = pathlib.Path("{{ fleet_provision_inventory_path }}/host_vars/{{ fleet_provision_subject }}.yml")
            doc = yaml.safe_load(p.read_text()) or {}
            macs = []
            for key in ("uplinks", "interfaces"):
                for item in doc.get(key) or []:
                    mac = str(item.get("mac_address", "")).strip().lower()
                    mac = re.sub(r"[^0-9a-f]", "", mac)
                    if mac:
                        macs.append(mac)
            print(macs[0] if macs else "")
            PY
          args:
            executable: /bin/bash
          register: fleet_pxe_disc_target_mac
          changed_when: false

        - name: Arm and start TempXE for PXE discovery
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_yaidap_root }}"
            cd "$ROOT"
            TAGS_ARGS=()
            if [ -n "{{ _prov_tags }}" ]; then
              TAGS_ARGS=(--tags "{{ _prov_tags }}")
            fi
            ansible-playbook "{{ _prov_playbook }}" \
              -i "{{ fleet_provision_inventory_path }}" \
              --limit "{{ fleet_provision_subject }}" \
              --connection local \
              "${TAGS_ARGS[@]}" \
              -e tempxe_confirm=true \
              -e install_os=true
          args:
            executable: /bin/bash
          register: fleet_pxe_disc_tempxe_start

        - name: PXE reboot discovery target when ansible_host is known
          when: fleet_pxe_disc_target_ip.stdout | default('') | trim | length > 0
          ansible.builtin.shell: |
            set -euo pipefail
            TARGET="{{ fleet_pxe_disc_target_ip.stdout | trim }}"
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "linux@${TARGET}" 'bash -s' <<'REMOTE'
            set -euo pipefail
            pxe_boot=""
            current=""
            while IFS= read -r line; do
              case "$line" in
                Boot[0-9A-F][0-9A-F][0-9A-F][0-9A-F]*)
                  current="${line%% *}"
                  current="${current#Boot}"
                  current="${current%\*}"
                  ;;
              esac
              case "$line" in
                *IPv4*|*PXE*|*Network*)
                  if [ -n "$current" ]; then
                    pxe_boot="$current"
                    break
                  fi
                  ;;
              esac
            done < <(sudo efibootmgr -v)
            if [ -z "$pxe_boot" ]; then
              echo "no UEFI IPv4/PXE boot entry found in efibootmgr -v" >&2
              exit 1
            fi
            order=$(sudo efibootmgr | awk -F': ' '/BootOrder/ {print $2; exit}')
            if [ -n "$order" ]; then
              sudo efibootmgr -o "${pxe_boot},${order}"
            fi
            sudo efibootmgr -n "$pxe_boot"
            sudo reboot
            REMOTE
          args:
            executable: /bin/bash
          register: fleet_pxe_disc_reboot
          changed_when: true

        - name: Wait for PXE discovery tarball
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_inventory_path }}/generated/pxe-discovery"
            SUBJ="{{ fleet_provision_subject }}"
            MAC="{{ fleet_pxe_disc_target_mac.stdout | default('') | trim | lower }}"
            TIMEOUT="{{ fleet_provision_pxe_discovery_wait_timeout | default(900) }}"
            START=$(date +%s)
            while true; do
              NOW=$(date +%s)
              if [ $((NOW - START)) -gt "$TIMEOUT" ]; then
                echo "timeout waiting for PXE discovery tarball for ${SUBJ}" >&2
                exit 1
              fi
              if [ -d "$ROOT" ]; then
                for f in "$ROOT"/*.tgz; do
                  [ -e "$f" ] || continue
                  base=$(basename "$f" .tgz)
                  case "$base" in
                    *__"${SUBJ}"__*|*"__${SUBJ}_"*)
                      echo "PXE discovery archive ready: $f"
                      exit 0
                      ;;
                  esac
                  if [ -n "$MAC" ]; then
                    case "$base" in
                      *__*__"${MAC}"|*"__*__${MAC}_"*)
                        echo "PXE discovery archive ready: $f"
                        exit 0
                        ;;
                    esac
                  fi
                done
              fi
              sleep 15
            done
          args:
            executable: /bin/bash
          register: fleet_pxe_disc_wait
          changed_when: true

        - name: Collect PXE discovery drafts from TempXE
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_yaidap_root }}"
            cd "$ROOT"
            ansible-playbook "{{ _prov_playbook }}" \
              -i "{{ fleet_provision_inventory_path }}" \
              --limit "{{ fleet_provision_subject }}" \
              --connection local \
              --tags collect_discovery
          args:
            executable: /bin/bash
          register: fleet_pxe_disc_collect

        - name: Disarm TempXE after PXE discovery
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_yaidap_root }}"
            cd "$ROOT"
            ansible-playbook "{{ _prov_playbook }}" \
              -i "{{ fleet_provision_inventory_path }}" \
              --limit "{{ fleet_provision_subject }}" \
              --connection local \
              --tags tempxe_stop
          args:
            executable: /bin/bash
          register: fleet_pxe_disc_tempxe_stop

        - name: Show PXE discovery recap
          ansible.builtin.debug:
            msg: >-
              discover_pxe {{ fleet_provision_subject }} complete.
              {{ fleet_pxe_disc_wait.stdout | default('') | trim }}

    - name: Run YAIDAP ansible-playbook on jumphost
      when: fleet_provision_action not in ['install_bm', 'discover_pxe']
      block:
        - name: Resolve discover target ansible_host
          when: fleet_provision_action == 'discover'
          ansible.builtin.shell: |
            set -euo pipefail
            HV="{{ fleet_provision_inventory_path }}/hypervisors.yml"
            HV_VARS="{{ fleet_provision_inventory_path }}/host_vars/{{ fleet_provision_subject }}.yml"
            ip=""
            if [ -f "$HV" ]; then
              ip=$(python3 - <<'PY'
            import yaml, pathlib
            hv = pathlib.Path("{{ fleet_provision_inventory_path }}/hypervisors.yml")
            subj = "{{ fleet_provision_subject }}"
            doc = yaml.safe_load(hv.read_text()) or {}
            print((doc.get("hypervisors", {}).get("hosts", {}).get(subj) or {}).get("ansible_host", ""))
            PY
            )
            fi
            if [ -z "$ip" ] && [ -f "$HV_VARS" ]; then
              ip=$(awk '/^ansible_host:/ { sub(/^ansible_host:[[:space:]]*/, ""); print; exit }' "$HV_VARS")
            fi
            echo "$ip"
          args:
            executable: /bin/bash
          register: fleet_disc_target_ip
          changed_when: false
          failed_when: false

        - name: Refresh known_hosts before discover SSH
          when:
            - fleet_provision_action == 'discover'
            - fleet_disc_target_ip.stdout | default('') | trim | length > 0
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -R
              - "{{ fleet_disc_target_ip.stdout | trim }}"
          changed_when: true
          failed_when: false

        - name: Run YAIDAP ansible-playbook command on jumphost
          ansible.builtin.shell: |
            set -euo pipefail
            ROOT="{{ fleet_provision_yaidap_root }}"
            cd "$ROOT"
            TAGS_ARGS=()
            if [ -n "{{ _prov_tags }}" ]; then
              TAGS_ARGS=(--tags "{{ _prov_tags }}")
            fi
            LIMIT="{{ fleet_provision_subject }}"
            if [ "{{ fleet_provision_action }}" = "create_vm" ]; then
              LIMIT="${LIMIT},hypervisors"
            fi
            ansible-playbook "{{ _prov_playbook }}" \
              -i "{{ fleet_provision_inventory_path }}" \
              --limit "${LIMIT}" \
              "${TAGS_ARGS[@]}"{%- for arg in _yaidap_extra_argv %} {{ arg | quote }}{%- endfor %}
          args:
            executable: /bin/bash
          register: fleet_provision_remote
          changed_when: true

    - name: Read resolved vm_location from YAIDAP guest host_vars after create
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -f "{{ fleet_provision_guest_host_vars }}" ]; then
          awk '/^vm_location:/ { sub(/^vm_location:[[:space:]]*/, ""); print; exit }' "{{ fleet_provision_guest_host_vars }}"
        fi
      args:
        executable: /bin/bash
      register: fleet_resolved_vm_location
      changed_when: false
      when:
        - >-
          (fleet_provision_sync_host | default(false) | bool)
          or (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_action == 'create_vm'

    - name: Sync resolved vm_location into jumphost guests.yml
      ansible.builtin.shell: |
        set -euo pipefail
        GUESTS="{{ fleet_provision_inventory_path }}/guests.yml"
        SUBJ="{{ fleet_provision_subject }}"
        LOC="{{ fleet_resolved_vm_location.stdout | default('') | trim }}"
        [ -n "$LOC" ] || exit 0
        [ -f "$GUESTS" ] || exit 0
        awk -v n="$SUBJ" -v loc="$LOC" '
          $0 ~ "^[[:space:]]*" n ":[[:space:]]*$" { f=1; print; next }
          f && /^[[:space:]]+[A-Za-z0-9._-]+:[[:space:]]*$/ { f=0 }
          f && /^[[:space:]]+vm_location:[[:space:]]*/ {
            sub(/^.*vm_location:[[:space:]]*/, "  vm_location: " loc); print; next
          }
          { print }
        ' "$GUESTS" > "$GUESTS.tmp" && mv "$GUESTS.tmp" "$GUESTS"
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - >-
          (fleet_provision_sync_host | default(false) | bool)
          or (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_action == 'create_vm'
        - fleet_resolved_vm_location.stdout | default('') | trim | length > 0

    - name: Emit resolved vm_location marker for hub
      ansible.builtin.debug:
        msg: "FLEET_YAIDAP_VM_LOCATION={{ fleet_resolved_vm_location.stdout | default('') | trim }}"
      when:
        - >-
          (fleet_provision_sync_host | default(false) | bool)
          or (fleet_provision_sync_from_store | default(false) | bool)
        - fleet_provision_action == 'create_vm'
        - fleet_resolved_vm_location.stdout | default('') | trim | length > 0

    - name: Show YAIDAP recap
      ansible.builtin.debug:
        msg: "{{ fleet_provision_remote.stdout | default('') | trim }}"
