#
# Usage (equivalent to pre-unification fleet-webui.yml):
#   ansible-playbook fleet-webui.yml -l hub

- name: Fleet console (Helm) on hub
  ansible.builtin.import_playbook: fleet-console-auth-crd.yml

- name: Fleet console auth + dashboard
  ansible.builtin.import_playbook: fleet-console-auth.yml

- name: Fleet WebUI lab extras
  ansible.builtin.import_playbook: fleet-webui-lab.yml
