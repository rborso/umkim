# Dev fallback when running nginx without docker-entrypoint.sh.
# Production image uses nginx-default.conf.template + envsubst.
server {
    listen 8080;
    server_name _;

    location /fleet/auth/ {
        proxy_pass http://fleet-console-auth.fleet-console.svc.cluster.local:18090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location /fleet/api/v1alpha1/site-enrollments/ {
        set $site_upstream fleet-site-controller.fleet-console.svc.cluster.local:18080;
        rewrite ^/fleet/api/v1alpha1/site-enrollments/(.*)$ /api/v1alpha1/site-enrollments/$1 break;
        proxy_pass http://$site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
    }

    location /fleet/api/v1alpha1/cluster-enrollments/ {
        set $site_upstream fleet-site-controller.fleet-console.svc.cluster.local:18080;
        rewrite ^/fleet/api/v1alpha1/cluster-enrollments/(.*)$ /api/v1alpha1/cluster-enrollments/$1 break;
        proxy_pass http://$site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://fleet-console-auth.fleet-console.svc.cluster.local:18090/proxy/dcm/;
        proxy_http_version 1.1;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location /fleet/api/ {
        proxy_pass http://fleet-console-auth.fleet-console.svc.cluster.local:18090/proxy/fleet/;
        proxy_http_version 1.1;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location /llm/ {
        rewrite ^/llm/(.*)$ /proxy/llm/$1 break;
        proxy_pass http://fleet-console-auth.fleet-console.svc.cluster.local:18090;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
    }

    location /fleet/ {
        alias /usr/share/nginx/html/fleet/;
        try_files $uri $uri/ /fleet/index.html;
    }

    location / {
        root /usr/share/nginx/html/fleet;
        try_files $uri $uri/ /index.html;
    }
}
