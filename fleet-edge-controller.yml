---
# Deploy fleet-edge-controller + route-sync + failover controller on hub (catalog dual-route).
#
#   ansible-playbook fleet-edge-crd.yml -l hub
#   ansible-playbook fleet-edge-controller.yml -l hub
#
# Prereqs: fleet-edge.yml (cluster registry CM), Harbor images fleet/fleet-edge-controller and fleet/fleet-failover-controller

- name: Fleet edge controller on hub
  hosts: hub
  become: true
  gather_facts: false
  roles:
    - role: fleet_edge
      tasks_from: cluster_registry.yml
      tags: [fleet_edge, fleet_edge_registry]
    - role: fleet_edge_controller
      tags: [fleet_edge_controller]
    - role: fleet_failover_controller
      tags: [fleet_failover_controller]
    - role: fleet_edge_controller
      tasks_from: verify_e2e.yml
      tags: [fleet_edge_e2e]
      when: fleet_edge_e2e_verify | default(false) | bool
