---
# Hub-only inventory template (greenfield VPS / bare-metal hub).
# Copy to inventory/hosts.yml and replace CHANGE_ME values.
#
# See examples/inventory/hub-only/README.md and docs/install.md.
# Copy hosts.yml, site.yml, fleet_sites.yml, and group_vars/hub.yml from examples/inventory/hub-only/.

all:
  children:
    fleet_nodes:
      children:
        hub:
          hosts:
            umkim-hub:
              ansible_host: CHANGE_ME_PUBLIC_IPV4
              ansible_user: linux
        # Leave empty until you manage spokes with Ansible (optional).
        spokes:
          hosts: {}
        hypervisors:
          hosts: {}
        fleet_edge:
          hosts:
            umkim-hub:
        ocm_spoke_join:
          children:
            spokes:
        nested_parents:
          hosts: {}
