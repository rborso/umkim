---
# FleetSite overlay addressing (see docs/install.md and docs/components/fleet-site.md).
# Hub .1, inventory spokes .2-.3, FleetSite pool .10-.99, operators .100+.

fleet_site_wireguard_pool_start: 10
fleet_site_wireguard_pool_end: 99
fleet_site_namespace: fleet-console
fleet_site_controller_namespace: fleet-console
fleet_site_controller_enabled: true
fleet_site_controller_tag: "{{ harbor_fleet_image_tag }}"
fleet_site_controller_image: "{{ harbor_fleet_image_prefix }}/fleet-site-controller:{{ fleet_site_controller_tag }}"
fleet_site_ansible_runner_tag: "{{ harbor_fleet_image_tag }}"
fleet_site_ansible_runner_image: "{{ harbor_fleet_image_prefix }}/fleet-ansible-runner:{{ fleet_site_ansible_runner_tag }}"
fleet_cluster_wireguard_interface: wg-umkim
# Console NodePort (30912): nginx routes enrollment directly to fleet-site-controller.
fleet_site_enrollment_base_url: "http://{{ fleet_hub_wireguard_ip }}:{{ umkim_console_nodeport | default(30912) }}/fleet/api/v1alpha1"
fleet_site_hub_wireguard_ip: "{{ fleet_hub_wireguard_ip }}"
fleet_lldap_webui_nodeport: 30917
fleet_site_hub_public_key_path: /etc/wireguard/publickey
fleet_site_wireguard_endpoint_host: "{{ wireguard_endpoint_host }}"
fleet_site_wireguard_endpoint_port: "{{ wireguard_endpoint_port }}"
fleet_site_wireguard_persistent_keepalive: "{{ wireguard_persistent_keepalive }}"
fleet_site_bootstrap_ssh_user: linux
ocm_join_extra_args: []
fleet_site_enable_kubevirt: false
fleet_site_auto_install_kubevirt_operator: false
