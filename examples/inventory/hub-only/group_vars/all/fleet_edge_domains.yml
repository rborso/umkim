---
# Structured domain registry for fleet edge + console Domains page.
# Rendered to ConfigMap fleet-edge-domains by roles/fleet_edge.
# Sites (datacenters) are defined in fleet_sites.yml.

_fleet_edge_registry_sites: >-
  {%- set sites = [] -%}
  {%- for site_id, site in fleet_sites.items() -%}
  {%- set _ = sites.append({
    'id': site_id,
    'display_name': site.display_name,
    'zone': site.edge_domain | default(site.hub_zone | default('')),
    'wildcard': site.edge_wildcard | default(site.hub_wildcard | default('')),
    'clusters': (fleet_site_cluster_hosts | default([])) if not (site.management_site | default(false) | bool) else [],
    'dns_target_note': site.dns_target_note | default('')
  }) -%}
  {%- endfor -%}
  {{ sites }}

fleet_edge_domain_registry:
  hub_zone: "{{ fleet_edge_domain }}"
  homelab_zone: "{{ fleet_homelab_edge_domain | default('homelab.' ~ fleet_edge_domain) }}"
  hub_wildcard: "*.{{ fleet_edge_domain }}"
  homelab_wildcard: "*.{{ fleet_homelab_edge_domain | default('homelab.' ~ fleet_edge_domain) }}"
  sites: "{{ _fleet_edge_registry_sites }}"
  cluster_patterns:
    - pattern: "{app}.{{ fleet_edge_domain }}"
      description: Hub-routed app hostname
    - pattern: "{app}.{cluster}.{{ fleet_edge_domain }}"
      description: Per-cluster site hostname
    - pattern: "{app}.{{ fleet_homelab_edge_domain | default('homelab.' ~ fleet_edge_domain) }}"
      description: Homelab edge wildcard zone
  clusters: "{{ fleet_edge_clusters | default({}) }}"
