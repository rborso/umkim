---
# Enable when following docs/install.md §5 (console FleetClusterJoin workload clusters).
# Copy to inventory/group_vars/hub/fcj-workloads.yml before hub install, or merge into hub.yml.
#
# FCJ spokes register WireGuard overlay upstreams (10.10.0.x). The hub gateway must use
# hostNetwork so Traefik can reach spoke NodePorts. HA pod-network + gateway-acme solver
# is for hub-only fleets without console-managed spokes.

fleet_gateway_wireguard_upstream: true
fleet_edge_acme_legacy_gateway_scale: false
fleet_edge_acme_preflight_enabled: false
