---
# Management site only (hub gateway). Copy to inventory/group_vars/all/fleet_sites.yml
# or merge the fleet_sites: block — remove homelab/lab-remote sites from the lab inventory.

fleet_sites:
  management:
    display_name: Management DC
    region: management
    hub_gateway: true
    hub_zone: "{{ fleet_edge_domain }}"
    hub_wildcard: "*.{{ fleet_edge_domain }}"
    management_site: true
    # Use fleet_hub_public_ipv4 (WAN) — not ansible_host (127.0.0.1 when hosts-from-hub.yml is used).
    dns_target_note: "A/AAAA *.{{ fleet_edge_domain }} → hub WAN IP"
    wan_egress:
      enabled: true
      expected_wan_ip: "{{ hostvars[fleet_hub_inventory_hostname | default('umkim-hub')].fleet_hub_public_ipv4 | default(hostvars[fleet_hub_inventory_hostname | default('umkim-hub')].ansible_host | default('')) }}"
    wireguard_pool: null

fleet_site_cluster_hosts: []
