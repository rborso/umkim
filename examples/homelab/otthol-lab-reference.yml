---
# Maintainer lab reference (otthol.hu homelab). Not design-tier documentation.
# Source: git 75cbf3a inventory + playbooks/flows/examples/lab-{single,ha}-0.yml
# Operators use umkim CLI + scripts/lab/rebuild-homelab-cli.sh — not git fleet_sites.yml.

domains:
  hub: demo.otthol.hu
  homelab_edge: homelab.otthol.hu
  wireguard: wg.otthol.hu
  ldap_base: dc=otthol,dc=local

jumphost: linux@jump.otthol.hu:30200

hypervisors:
  virt01:
    ansible_host: 172.16.10.2
  virt02:
    ansible_host: 172.16.10.3

bare_metals:
  virt03:
    ansible_host: 172.16.10.4
    notes: lab-single-0; TempXE discover → install_bm → cluster enroll
  gpu-bm-1:
    ansible_host: 172.16.10.6
    mac: "70:85:c2:d4:5a:95"

yaidap:
  jumphost_root: /home/linux/yaidap
  inventory_path: /home/linux/yaidap/inventory/homelab
  provision_ssh_secret: fleet-site-homelab-provision-ssh
  guest_os: rocky-10
  base_image: /opt/local/rocky-10.qcow2
  group_vars_required:
    - alphabet
    - local_ssd
    - networks

site:
  name: homelab
  siteId: homelab
  displayName: Homelab
  region: homelab
  jumphost: linux@jump.otthol.hu:30200
  ingress:
    - id: homelab-pf
      method: port_forward
      address: 172.16.10.4
      zone: homelab.otthol.hu
      wildcard: "*.homelab.otthol.hu"
      description: "Port-forward to virt03 (lab-single-0) 80→30080, 443→30443"
    - id: edge-rp
      method: reverse_proxy
      operatorNotes: External reverse proxy terminates TLS; operator configures vhosts
  dnsTargetNote: "A/AAAA *.homelab.otthol.hu → virt03 (port-forward 80→30080, 443→30443)"

clusters:
  lab-single-0:
    siteId: homelab
    topology: single_node
    bootstrapHost: 172.16.10.4
    host: virt03
    path: discover → install_bm → cluster create/bootstrap/provision
    edge:
      ingressId: homelab-pf
      tlsPolicy: acme_cluster
    jumphost: linux@jump.otthol.hu:30200
    providers:
      install:
        k8s: false
        helm: false

  lab-ha-0:
    siteId: homelab
    topology: ha_3_node
    bootstrapHost: 172.16.10.101
    controlPlaneVip: 172.16.10.100
    minRootDiskGi: 20
    edge:
      ingressId: edge-rp
      tlsPolicy: external
    fleetAppRouting: hub
    notes: edge-rp is external TLS only; FleetApps on this cluster use route.mode hub (hub gateway)
    jumphost: linux@jump.otthol.hu:30200
    storage:
      longhorn:
        enabled: true
        device: ""
        minDataDiskGi: 5
      localPath:
        enabled: false
    nodes:
      - address: 172.16.10.101
        hostname: lab-ha-0-cp1
        role: control
        guest: lab-ha-0-cp1
      - address: 172.16.10.102
        hostname: lab-ha-0-cp2
        role: control
        guest: lab-ha-0-cp2
      - address: 172.16.10.103
        hostname: lab-ha-0-cp3
        role: control
        guest: lab-ha-0-cp3
      - address: 172.16.10.140
        hostname: lab-ha-0-w1
        role: worker
        guest: lab-ha-0-w1
    providers:
      install:
        k8s: false
        helm: false

excluded:
  sites:
    - lab-jumphost
  clusters:
    - lab-single-1
  notes: lab-single-1 was on lab-jumphost site; worker IP 172.16.10.140 is lab-ha-0-w1 only

virsh_cleanup:
  targets:
    - 172.16.10.2
    - 172.16.10.3
  skip:
    - 172.16.10.4
