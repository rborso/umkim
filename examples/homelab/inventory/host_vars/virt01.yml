---
ansible_host: 172.16.10.2
os: rocky-10
legacy: false
install_os: false
configure_firewalld: false
allow_management_nic_rewire: true
provisioning_provider: libvirt

tempxe_discovery:
  enabled: false

nfs_exports:
  - path: /export/lab
    clients:
      - 172.16.10.100
      - 172.16.10.101
      - 172.16.10.102
      - 172.16.10.103
      - 172.16.10.140
  - path: /export/virt02-vm01
    clients:
      - 172.16.10.140

disks:
  - name: bootdisk
    disk: disk/by-id/nvme-Samsung_SSD_980_500GB_S64DNL0T501915W
    bootdisk: true
    device: 0
    size: 466
    use_full_disk: true

uplinks:
  - name: n0p0
    physical_network: lab_access_l1
    interface: enp0s31f6
    mac_address: "e8:6a:64:56:e3:93"
    networks:
      - zone: lab
        model: e1000
        cloudinit: false
        pxe: true
        vm_network: true
        network_name: lab_nw
        tag: ""
        bridge_name: n0p0_lab_nw
        ip: "172.16.10.2"
        default_route: true
        tcp_open:
          - 22
          - 5900-5999
        udp_open: []
        services_open:
          - nfs
          - rpc-bind
          - mountd
  - name: n0p1
    physical_network: mgmt_access_l1
    interface: enp0s20f0u1
    mac_address: "00:0e:c6:af:26:49"
    networks:
      - zone: external
        model: e1000
        cloudinit: false
        pxe: false
        vm_network: true
        network_name: mgmt_nw
        tag: ""
        bridge_name: n0p1_mgmt_nw
        ip: "192.168.1.110"
        default_route: false
        tcp_open:
          - 22
        udp_open: []
        services_open: []
