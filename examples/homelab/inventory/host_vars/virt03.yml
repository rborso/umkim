---
ansible_host: 172.16.10.4
os: rocky-10
legacy: false
install_os: false
provisioning_provider: libvirt
vm_scheduling_pool: false
configure_firewalld: false
configure_cockpit: false
allow_management_nic_rewire: true

tempxe_discovery:
  enabled: true

disks:
  - name: bootdisk
    disk: disk/by-id/ata-TOSHIBA_THNSNJ256G8NU_45KB3082KFJX
    bootdisk: true
    device: 0
    size: 239
    use_full_disk: true

uplinks:
  - name: n0p0
    physical_network: lab_access_l1
    model: e1000
    interface: enp2s0
    mac_address: "88:d7:f6:2c:17:3b"
    networks:
      - zone: lab
        cloudinit: false
        pxe: true
        vm_network: true
        network_name: lab_nw
        tag: ""
        bridge_name: n0p0_lab_nw
        ip: "172.16.10.4"
        default_route: true
        tcp_open:
          - 22
          - 5900-5999
        udp_open: []
        services_open: []
