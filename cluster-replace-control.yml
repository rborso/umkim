---
# Replace a control plane node in a Ready HA fleet cluster.
#
#   ansible-playbook cluster-replace-control.yml -e fleet_cluster_name=my-cluster \
#     -e fleet_node_replace_old=my-cluster-2 \
#     -e fleet_node_replace_new_hostname=my-cluster-2 -i inventory.ini
#
# Inventory MUST include the old CP hostname for graceful leave. The fleet-site
# controller persists oldNodeAddress and re-injects the old host on every
# inventory rebuild while replaceControlPlane is Pending/Running.

- name: Fleet cluster replace CP | Require old node in inventory
  hosts: site_bootstrap
  become: false
  gather_facts: false
  tasks:
    - name: Fail when old control-plane host is missing from inventory
      ansible.builtin.assert:
        that:
          - fleet_node_replace_old is defined
          - fleet_node_replace_old | length > 0
          - >-
              (fleet_node_replace_force | default(false) | bool)
              or (hostvars[fleet_node_replace_old] is defined)
        fail_msg: >-
          replace control plane requires old node {{ fleet_node_replace_old }} in
          Ansible inventory (graceful leave cannot run). Controller must inject
          oldNodeAddress while replaceControlPlane is active.
      tags: [fleet_cluster_replace_cp]

- name: Fleet cluster replace CP | Remove old control plane member (force)
  hosts: site_bootstrap
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: k3s
        tasks_from: cluster_etcd_remove_member.yml
      when: fleet_node_replace_force | default(false) | bool
      vars:
        fleet_etcd_remove_member: "{{ fleet_node_replace_old }}"
      tags: [fleet_cluster_replace_cp]

    - name: Delete old control plane Kubernetes node (force)
      ansible.builtin.command:
        argv: [kubectl, delete, node, "{{ fleet_node_replace_old }}", --ignore-not-found, --force, --grace-period=0]
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig | default(/etc/rancher/k3s/k3s.yaml) }}"
      when: fleet_node_replace_force | default(false) | bool
      tags: [fleet_cluster_replace_cp]

- name: Fleet cluster replace CP | WireGuard on replacement node
  hosts: "{{ fleet_node_replace_new_hostname | default(fleet_node_replace_old) }}"
  become: true
  gather_facts: false
  tasks:
    - name: Install wireguard-tools
      ansible.builtin.package:
        name: wireguard-tools
        state: present
      tags: [wireguard, fleet_cluster_replace_cp]

    - name: Deploy overlay WireGuard config from controller
      ansible.builtin.copy:
        dest: "/etc/wireguard/{{ fleet_cluster_wireguard_interface | default(wg-umkim) }}.conf"
        mode: "0600"
        content: |
          [Interface]
          Address = {{ wireguard_address }}
          PrivateKey = {{ fleet_node_wg_private_key }}

          [Peer]
          PublicKey = {{ fleet_hub_wg_public_key }}
          Endpoint = {{ wireguard_endpoint_host | default(fleet_hub_wireguard_ip) }}:{{ wireguard_endpoint_port | default(51820) }}
          AllowedIPs = {{ wireguard_subnet | default(10.10.0.0/16) }}
          PersistentKeepalive = {{ wireguard_persistent_keepalive | default(25) }}
      when:
        - fleet_node_wg_private_key is defined
        - fleet_hub_wg_public_key is defined
      notify: Restart fleet overlay WireGuard
      tags: [wireguard, fleet_cluster_replace_cp]

    - name: Enable overlay WireGuard
      ansible.builtin.systemd:
        name: "wg-quick@{{ fleet_cluster_wireguard_interface | default(wg-umkim) }}"
        enabled: true
        state: started
        daemon_reload: true
      when: fleet_node_wg_private_key is defined
      tags: [wireguard, fleet_cluster_replace_cp]

  handlers:
    - name: Restart fleet overlay WireGuard
      ansible.builtin.systemd:
        name: "wg-quick@{{ fleet_cluster_wireguard_interface | default(wg-umkim) }}"
        state: restarted
        daemon_reload: true

- name: Fleet cluster replace CP | Host prepare on replacement
  hosts: "{{ fleet_node_replace_new_hostname | default(fleet_node_replace_old) }}"
  become: true
  gather_facts: true
  vars:
    fleet_node: true
  tasks:
    - ansible.builtin.import_role:
        name: host_prepare
      tags: [host_prepare, fleet_cluster_replace_cp]

- name: Fleet cluster replace CP | Publish join token from living control plane
  hosts: site_bootstrap
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: k3s
        tasks_from: publish_join_token.yml
      when: k3s_cluster_mode | default(false) | bool
      tags: [k3s, k3s_cluster, fleet_cluster_replace_cp]

- name: Fleet cluster replace CP | Join replacement server
  hosts: "{{ fleet_node_replace_new_hostname | default(fleet_node_replace_old) }}"
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - ansible.builtin.import_role:
        name: k3s
        tasks_from: cluster_join.yml
      when: k3s_cluster_mode | default(false) | bool
      tags: [k3s, k3s_cluster, fleet_cluster_replace_cp]

- name: Fleet cluster replace CP | Graceful leave on old node (online)
  hosts: "{{ fleet_node_replace_old }}"
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: k3s
        tasks_from: cluster_leave.yml
      when: not (fleet_node_replace_force | default(false) | bool)
      tags: [fleet_cluster_replace_cp]

- name: Fleet cluster replace CP | Remove old etcd member after leave
  hosts: site_bootstrap
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: k3s
        tasks_from: cluster_etcd_remove_member.yml
      when: not (fleet_node_replace_force | default(false) | bool)
      vars:
        fleet_etcd_remove_member: "{{ fleet_node_replace_old }}"
      tags: [fleet_cluster_replace_cp]

- name: Fleet cluster replace CP | Verify cluster nodes Ready
  hosts: site_bootstrap
  become: true
  gather_facts: false
  tasks:
    - name: Wait for replacement control plane Ready
      ansible.builtin.command:
        cmd: kubectl get nodes --no-headers
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig | default(/etc/rancher/k3s/k3s.yaml) }}"
        PATH: "{{ k3s_command_path | default(/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin) }}"
      register: fleet_cp_replace_nodes
      until: >-
        fleet_cp_replace_nodes.rc == 0
        and (fleet_cp_replace_nodes.stdout_lines
             | select(search, fleet_node_replace_new_hostname | default(fleet_node_replace_old))
             | select(search,  Ready )
             | list | length) > 0
      retries: 60
      delay: 10
      changed_when: false
      tags: [fleet_cluster_replace_cp]

    - name: Assert old control plane node is gone when hostname changed
      ansible.builtin.assert:
        that:
          - >-
              (fleet_node_replace_new_hostname | default(fleet_node_replace_old)) == fleet_node_replace_old
              or (fleet_cp_replace_nodes.stdout_lines
                  | select(search, ^ ~ (fleet_node_replace_old | regex_escape) ~ \s)
                  | list | length) == 0
        fail_msg: >-
          old control-plane node {{ fleet_node_replace_old }} still appears in
          kubectl get nodes after replace
      when: not (fleet_node_replace_force | default(false) | bool)
      tags: [fleet_cluster_replace_cp]
