---
# Current topology examples (hub-only inventory template).
# Replace RFC 5737 addresses with your own node and NFS values before running.
# Flow playbooks: -e @playbooks/flows/examples/<name>.yml
#
# | Cluster   | Shape                         | Example addresses         | Site           |
# |-----------|-------------------------------|----------------------------|----------------|
# | lab-sn01  | single node, one control      | 203.0.113.29               | homelab-shared |
# | lab-3n01  | 3 controls, no workers        | 203.0.113.26–.28 + VIP .35 | homelab-shared |
# | lab-ha01  | 3 controls + 2 workers        | 203.0.113.21–.25 + VIP .20 | homelab-shared |
#
# Create the example site first:
#   ansible-playbook $INV playbooks/flows/site-create.yml \
#     -e @playbooks/flows/examples/homelab-shared-site.yml
#
# Then choose a topology:
#   ansible-playbook $INV playbooks/flows/cluster-create.yml \
#     -e @playbooks/flows/examples/lab-sn01.yml
#   ansible-playbook $INV playbooks/flows/cluster-create.yml \
#     -e @playbooks/flows/examples/lab-3n01.yml
#   ansible-playbook $INV playbooks/flows/cluster-create.yml \
#     -e @playbooks/flows/examples/lab-ha01.yml
#
# Hub gateway (also in group_vars/hub/main.yml + vault.yml)
# fleet_edge_acme_enabled: true
# fleet_ingress_auth_enabled: true
