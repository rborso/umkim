---
# Management site only (hub_gateway). Copy to inventory/group_vars/all/fleet_sites.yml
# or merge the fleet_sites: block — remove homelab/lab-remote sites from the lab inventory.

fleet_sites:
  management:
    display_name: Management DC
    region: management
    edge_domain: "{{ fleet_edge_domain }}"
    edge_wildcard: "*.{{ fleet_edge_domain }}"
    exposure_mode: hub_gateway
    management_site: true
# Use fleet_hub_public_ipv4 (WAN) — not ansible_host (127.0.0.1 when hosts-from-hub.yml is used).
    external_endpoints:
      - id: hub-wan
        address: "{{ hostvars[fleet_hub_inventory_hostname | default('umkim-hub')].fleet_hub_public_ipv4 | default(hostvars[fleet_hub_inventory_hostname | default('umkim-hub')].ansible_host | default('')) }}"
        role: primary
        description: "Hub public IP — Traefik :80/:443"
    domains:
      - id: hub-zone
        zone: "{{ fleet_edge_domain }}"
        wildcard: "*.{{ fleet_edge_domain }}"
        tls_policy: acme_hub
    dns_target_note: "A/AAAA *.{{ fleet_edge_domain }} → hub WAN IP"
    wan_egress:
      enabled: true
      expected_wan_ip: "{{ hostvars[fleet_hub_inventory_hostname | default('umkim-hub')].fleet_hub_public_ipv4 | default(hostvars[fleet_hub_inventory_hostname | default('umkim-hub')].ansible_host | default('')) }}"
    wireguard_pool: null

  homelab:
    display_name: Homelab
    region: homelab
    edge_domain: "{{ fleet_homelab_edge_domain }}"
    edge_wildcard: "*.{{ fleet_homelab_edge_domain }}"
    exposure_mode: port_forward
    external_endpoints:
      - id: virt03-wan
        address: "134.255.112.204"
        role: primary
        description: "WAN forwards TCP 80→30080 and 443→30443 on virt03"
    domains:
      - id: homelab-zone
        zone: "{{ fleet_homelab_edge_domain }}"
        wildcard: "*.{{ fleet_homelab_edge_domain }}"
        tls_policy: acme_cluster
    dns_target_note: "A/AAAA *.{{ fleet_homelab_edge_domain }} → virt03 (port-forward 80→30080, 443→30443)"

  lab-jumphost:
    display_name: Lab jumphost (hub gateway)
    region: lab
    edge_domain: "{{ fleet_edge_domain }}"
    edge_wildcard: "*.{{ fleet_edge_domain }}"
    exposure_mode: hub_gateway
    external_endpoints:
      - id: hub-wan
        address: "{{ hostvars[fleet_hub_inventory_hostname | default('umkim-hub')].fleet_hub_public_ipv4 | default(hostvars[fleet_hub_inventory_hostname | default('umkim-hub')].ansible_host | default('')) }}"
        role: primary
        description: "Hub public IP — apps via hub Traefik :80/:443"
    domains:
      - id: hub-zone
        zone: "{{ fleet_edge_domain }}"
        wildcard: "*.{{ fleet_edge_domain }}"
        tls_policy: acme_hub
    dns_target_note: "A/AAAA *.<fleet_edge_domain> → hub WAN (no spoke port-forward)"

fleet_site_cluster_hosts: []
