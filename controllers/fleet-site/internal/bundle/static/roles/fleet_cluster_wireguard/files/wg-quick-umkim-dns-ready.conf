# UMKIM: Endpoint hostnames (e.g. wg.example.com) often fail before DNS is usable
# even after network-online.target. Wait for resolution and retry on failure.
[Unit]
After=network-online.target nss-lookup.target NetworkManager-wait-online.service systemd-resolved.service
Wants=network-online.target
# Soft deps — units may be absent on some images.
Wants=NetworkManager-wait-online.service

[Service]
ExecStartPre=/usr/local/libexec/umkim-wg-wait-dns.sh %i
Restart=on-failure
RestartSec=5s
StartLimitIntervalSec=300
StartLimitBurst=30
