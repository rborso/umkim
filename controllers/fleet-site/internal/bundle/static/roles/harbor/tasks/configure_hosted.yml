---
# Hosted (pushable) Harbor project for fleet-built images — not pull-through proxy.
- name: Harbor | Create fleet hosted project
  ansible.builtin.uri:
    url: "{{ harbor_external_url }}/api/v2.0/projects"
    method: POST
    user: admin
    password: "{{ harbor_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 409]
    body_format: json
    body:
      project_name: "{{ harbor_fleet_project }}"
      public: true
      metadata:
        public: "true"
  register: harbor_fleet_project_create
  changed_when: harbor_fleet_project_create.status == 201
  tags: [harbor, harbor_install, harbor_push_fleet]
