---
- name: Harbor | Ensure charts project exists
  ansible.builtin.include_tasks: configure_charts_project.yml
  tags: [harbor, harbor_push_charts]

- name: Harbor | Check optional catalog checkout on controller
  ansible.builtin.stat:
    path: "{{ harbor_umkim_catalog_root }}"
  delegate_to: localhost
  become: false
  register: harbor_umkim_catalog_stat
  tags: [harbor, harbor_push_charts]

- name: Harbor | Select charts available on controller
  ansible.builtin.set_fact:
    harbor_charts_to_push_effective: >-
      {{ harbor_charts_to_push_effective | default([]) + [item] }}
  loop: "{{ harbor_charts_to_push }}"
  when:
    - not (item.optional | default(false) | bool)
      or (harbor_umkim_catalog_stat.stat.isdir | default(false) | bool)
  tags: [harbor, harbor_push_charts]

- name: Harbor | Report skipped optional catalog charts
  ansible.builtin.debug:
    msg: >-
      Optional catalog checkout {{ harbor_umkim_catalog_root }} is absent;
      skipping catalog charts and continuing with built-in charts.
  when: not (harbor_umkim_catalog_stat.stat.isdir | default(false) | bool)
  tags: [harbor, harbor_push_charts]

- name: Harbor | Add upstream chart repositories on controller
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - add
      - "{{ item.name }}"
      - "{{ item.url }}"
      - --force-update
  delegate_to: localhost
  become: false
  loop: "{{ harbor_chart_repositories }}"
  when: >-
    harbor_charts_to_push_effective
    | selectattr('dependency_build', 'defined')
    | list
    | length > 0
  changed_when: true
  tags: [harbor, harbor_push_charts]

- name: Harbor | Update upstream chart repositories on controller
  ansible.builtin.command:
    cmd: helm repo update {{ item.name }}
  delegate_to: localhost
  become: false
  loop: "{{ harbor_chart_repositories }}"
  when: >-
    harbor_charts_to_push_effective
    | selectattr('dependency_build', 'defined')
    | list
    | length > 0
  changed_when: false
  tags: [harbor, harbor_push_charts]

- name: Harbor | Build chart dependencies on controller
  ansible.builtin.command:
    cmd: helm dependency build {{ item.chart_dir | default(harbor_umkim_root ~ '/charts/' ~ item.name) }}
  delegate_to: localhost
  become: false
  loop: "{{ harbor_charts_to_push_effective }}"
  when: item.dependency_build | default(false) | bool
  changed_when: true
  tags: [harbor, harbor_push_charts]

- name: Harbor | Package pilot charts on controller
  ansible.builtin.command:
    cmd: helm package {{ item.chart_dir | default(harbor_umkim_root ~ '/charts/' ~ item.name) }} -d /tmp
  delegate_to: localhost
  become: false
  loop: "{{ harbor_charts_to_push_effective }}"
  register: harbor_chart_package
  changed_when: true
  tags: [harbor, harbor_push_charts]

- name: Harbor | Upload chart tgz to hub
  ansible.builtin.copy:
    src: "/tmp/{{ item.name }}-{{ item.version }}.tgz"
    dest: "/tmp/{{ item.name }}-{{ item.version }}.tgz"
    mode: "0644"
  loop: "{{ harbor_charts_to_push_effective }}"
  tags: [harbor, harbor_push_charts]

- name: Harbor | Helm registry login on hub
  ansible.builtin.command:
    cmd: >-
      helm registry login {{ harbor_host }}:{{ harbor_nodeport_https }}
      -u admin -p {{ harbor_admin_password }} --insecure
  environment:
    PATH: "{{ k3s_command_path | default('/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  changed_when: true
  tags: [harbor, harbor_push_charts]

- name: Harbor | Push charts to Harbor OCI
  ansible.builtin.command:
    cmd: >-
      helm push /tmp/{{ item.name }}-{{ item.version }}.tgz
      oci://{{ harbor_host }}:{{ harbor_nodeport_https }}/{{ harbor_charts_project }}
      --insecure-skip-tls-verify
  environment:
    PATH: "{{ k3s_command_path | default('/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  loop: "{{ harbor_charts_to_push_effective }}"
  changed_when: true
  tags: [harbor, harbor_push_charts]
