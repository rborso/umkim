---
k3s_channel: v1.36
k3s_role: server
k3s_cluster_mode: false
k3s_cluster_init_host: ""
k3s_bind_address: "{{ ansible_host }}"
k3s_node_ip: "{{ k3s_bind_address }}"
k3s_token: ""
k3s_server_url: ""

# local-storage is disabled as well: k3s re-applies its packaged
# local-storage.yaml on every server start, and that manifest marks local-path
# the default StorageClass. That would override whichever class the cluster's
# storage backend owns (NFS or Longhorn), leaving two defaults. The fleet ships
# its own copy instead — k3s/tasks/local_path.yml — with the default flag under
# the backend's control.
k3s_disable_components:
  - traefik
  - servicelb
  - local-storage
  # metrics-server is disabled too: the fleet's copy must run on hostNetwork
  # with secure-port 10251, and leaving the addon enabled made k3s merge its
  # embedded manifest with the fleet's file — invalid duplicate ports, and a
  # revert on every server start. See tasks/patch_metrics_server.yml.
  - metrics-server
k3s_flannel_backend: none
k3s_disable_network_policy: true
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
# Used when k3s_bind_address is 0.0.0.0 (fleet cluster inventory sets bind-all).
k3s_kubeconfig_server_host: "127.0.0.1"
# Root login PATH on Rocky often omits /usr/local/bin.
k3s_command_path: /usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# Local-path storage: the fleet ships the provisioner and StorageClass that the
# disabled k3s local-storage addon used to provide. The images mirror the ones
# k3s packaged for this release.
local_path_storage_class: local-path
local_path_provisioner_image: rancher/local-path-provisioner:v0.0.37
local_path_helper_image: rancher/mirrored-library-busybox:1.37.0
# local-path is the default only when no other backend claims it: NFS when it is
# configured and left as the default, otherwise Longhorn, otherwise local-path.
# The storage roles still clear any stray default, but this decides what the
# fleet's own manifest asks for so a reinstall lands on one default.
local_path_set_default_sc: >-
  {{ not (
       ((fleet_cluster_nfs_enabled | default(false) | bool)
        and (fleet_cluster_nfs_set_default_sc | default(true) | bool))
       or ((fleet_cluster_longhorn_enabled | default(false) | bool)
           and (fleet_cluster_longhorn_set_default_sc | default(true) | bool))
     ) }}

# Metrics-server must use hostNetwork when kubelet listens on WireGuard node-ip
# (pod scrapes to InternalIP:10250 are rejected by firewalld). secure-port must
# differ from kubelet's 10250 on the host.
k3s_metrics_server_host_network: true
k3s_metrics_server_secure_port: 10251
k3s_metrics_server_image: "rancher/mirrored-metrics-server:v0.8.1@sha256:b2d2efaf5ac3b366ed0f839d2412a2c4279d4fc2a2a733f12c52133faed36c41"

k3s_install_env:
  INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"

# Spoke Traefik NodePorts. Same values as roles/spoke_ingress/defaults/main.yml
# (web 30080, websecure 30443, web-hub 30081). Opened in firewalld only when
# firewalld is already running; this role does not start it.
k3s_traefik_firewall_tcp_ports:
  - 30080
  - 30443
  - 30081
# k3s default --service-cidr. Install flags in this role do not override it.
# Calico's pool (192.168.0.0/16) is discovered at runtime; this is the service range.
k3s_service_cidr: 10.43.0.0/16
