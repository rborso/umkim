---
# The k3s local-storage addon is disabled (k3s_disable_components), so the fleet
# ships the local-path provisioner and StorageClass itself. Writing the manifest
# once is enough for the cluster: k3s no longer re-asserts the packaged default
# on every server start, which is what left a cluster with two default
# StorageClasses.
- name: Local-path | Create K3s static manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: "0755"
  tags: [k3s, k3s_local_path]

- name: Local-path | Write local-path provisioner and StorageClass manifest
  ansible.builtin.template:
    src: local-storage.yaml.j2
    # Deliberately not named local-storage.yaml: k3s removes the file matching
    # its own (disabled) local-storage addon from this directory on every
    # server start, which deleted the fleet's manifest and left the cluster with
    # no StorageClass at all.
    dest: /var/lib/rancher/k3s/server/manifests/fleet-local-path.yaml
    mode: "0644"
  tags: [k3s, k3s_local_path]
