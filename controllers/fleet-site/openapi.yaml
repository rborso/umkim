openapi: 3.0.3
info:
  title: Fleet Site API
  version: v1alpha1
  description: |
    Fleet-site HTTP API for sites, clusters, FleetApp Helm installs, and the chart library.
    See docs/components/fleet-apps.md and docs/components/fleet-site.md.
servers:
  - url: /fleet/api/v1alpha1
paths:
  /apps:
    get:
      summary: List FleetApp Helm installs and chart prefix defaults
      responses:
        '200':
          description: apps plus defaults.chartPrefix
    post:
      summary: Install an OCI chart on a selected Ready cluster
      description: clusterName is required. There is no placement engine.
      responses:
        '201':
          description: FleetApp created
        '400':
          description: Missing clusterName or disallowed chart
        '409':
          description: Cluster is not Ready, or name exists
  /apps/{name}:
    get:
      summary: Get a FleetApp
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: FleetApp
        '404':
          description: Not found
    delete:
      summary: Uninstall the Helm release and delete the FleetApp
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Uninstall started
  /charts:
    get:
      summary: List hub library charts (FleetChart)
      responses:
        '200':
          description: charts array
    post:
      summary: Publish a chart into Harbor and record a FleetChart
      description: |
        JSON body with origin (oci:// or http(s) .tgz) or multipart field chart (.tgz).
        imagePolicy is external, proxy, or copy. cluster install is a separate POST /apps.
      responses:
        '201':
          description: FleetChart created
        '200':
          description: Existing FleetChart updated for republish
        '400':
          description: Invalid origin, imagePolicy, or package
  /charts/{name}:
    get:
      summary: Get a library chart
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: FleetChart
        '404':
          description: Not found
    delete:
      summary: Remove the library record (Harbor artifact is kept)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Deleted
