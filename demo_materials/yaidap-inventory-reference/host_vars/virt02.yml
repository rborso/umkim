---
ansible_host: 172.16.10.3
os: rocky-10
legacy: false
install_os: false
configure_firewalld: false
allow_management_nic_rewire: true
provisioning_provider: libvirt

tempxe_discovery:
  enabled: false

disks:
  - name: bootdisk
    disk: disk/by-id/ata-Samsung_SSD_850_EVO_120GB_S21UNSAG413892J
    bootdisk: true
    device: 0
    size: 112
    use_full_disk: true

uplinks:
  - name: n0p0
    physical_network: lab_access_l1
    model: e1000
    interface: enp0s31f6
    mac_address: "80:e8:2c:9d:ab:99"
    networks:
      - zone: lab
        cloudinit: false
        pxe: true
        vm_network: true
        network_name: lab_nw
        tag: ""
        bridge_name: n0p0_lab_nw
        ip: "172.16.10.3"
        default_route: true
        tcp_open:
          - 22
          - 5900-5999
        udp_open: []
        services_open: []
  - name: n0p1
    physical_network: mgmt_access_l1
    model: e1000
    interface: enp0s20f0u3
    mac_address: "60:7d:09:7d:d1:c9"
    networks:
      - zone: external
        cloudinit: false
        pxe: false
        vm_network: true
        network_name: mgmt_nw
        tag: ""
        bridge_name: n0p1_mgmt_nw
        ip: "192.168.1.120"
        default_route: false
        tcp_open:
          - 22
        udp_open: []
        services_open: []
