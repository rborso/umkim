---
# Hub runner: sync fleet-system/fleet-kubeconfig-<cluster> for fleet-site node API.
#
#   ansible-playbook cluster-kubeconfig-sync.yml -e fleet_cluster_name=<name> -i inventory/from-controller.ini

- name: Fleet cluster | Sync spoke kubeconfig secret
  hosts: hub
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: ocm
        tasks_from: sync_spoke_kubeconfig_secret.yml
      vars:
        ocm_spoke_kubeconfig_sync_targets:
          - cluster: "{{ fleet_cluster_name | default(fleet_site_name) }}"
            api_host: "{{ hostvars[groups['fleet_cluster_control'][0]].fleet_site_sp_endpoint | default(hostvars[groups['fleet_cluster_control'][0]].wireguard_address | regex_replace('/32$', '') | default(hostvars[groups['fleet_cluster_control'][0]].ansible_host)) }}"
