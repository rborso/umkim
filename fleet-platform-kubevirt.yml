---
# Deprecated for managed FleetClusterJoin clusters.
# Prefer: umkim cluster platform enable-kubevirt / console Operations /
# POST /clusters/{name}/platform/kubevirt (see docs/components/fleet-kubevirt.md).
#
# Legacy inventory path (nested_parents lab hosts only):
#   ansible-playbook fleet-platform-kubevirt.yml -l nested_parents
#
# phase4-kubevirt-parents.yml imports this playbook.

- name: Fleet platform | KubeVirt on nested parents
  hosts: nested_parents
  become: true
  gather_facts: true
  roles:
    - role: kubevirt_stack
      when: kvm_capable | default(hardware_kvm_capable | default(false)) | bool
  tags: [platform, kubevirt, phase4, kubevirt_stack]
