# lab-single-0 (~4GB GPU): same weights and model alias as values-fleet-gpu-4g.yaml (LiteLLM LB).
replicaCount: 1
parallel: 1

hfRepo: unsloth/Qwen3.5-2B-GGUF
hfQuant: UD-Q8_K_XL
model: Qwen3.5-2B-UD

ctxSize: 8192
nGpuLayers: 99

jinja: true
chatTemplateKwargs: '{"enable_thinking":false}'

image:
  repository: 10.10.0.1:30443/ghcr-proxy/ggml-org/llama.cpp
  tag: server-cuda
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "4"
    memory: 6Gi
  requests:
    cpu: "2"
    memory: 4Gi

hostNetwork: true
useRuntimeClass: true
runtimeClassName: nvidia
useGpuResource: false

persistence:
  enabled: true
  size: 12Gi
