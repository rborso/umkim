# Shared llama-cpp-helm settings for Fleet GPU spokes (hostNetwork + NVIDIA runtime).
# Combine with a file under profiles/ and optional overlays/ (see scripts/render-llama-cpp-values.sh).

replicaCount: 1
parallel: 1

ctxSize: 8192
nGpuLayers: 99

jinja: true
chatTemplateKwargs: '{"enable_thinking":false}'

image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: server-cuda
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "4"
    memory: 6Gi
  requests:
    cpu: "2"
    memory: 4Gi

hostNetwork: true
useRuntimeClass: true
runtimeClassName: nvidia
useGpuResource: false

persistence:
  enabled: true
  size: 12Gi
