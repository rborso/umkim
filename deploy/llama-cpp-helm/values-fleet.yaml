# Default llama-cpp-helm values for DCM catalog seed and lab deploy flows.
replicaCount: 1

# Hugging Face GGUF repo (llama-server -hf); quant suffix added by chart.
hfRepo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
hfQuant: Q4_K_M
# OpenAI model id returned by /v1/models — LiteLLM model_name must match.
model: Qwen2.5-0.5B-Instruct

ctxSize: 2048
nGpuLayers: 99
parallel: 1

image:
  repository: ghcr.io/ggml-org/llama.cpp
  tag: server-cuda
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "4"
    memory: 6Gi
  requests:
    cpu: "2"
    memory: 4Gi

hostNetwork: true
useRuntimeClass: true
runtimeClassName: nvidia
useGpuResource: false

persistence:
  enabled: true
  size: 8Gi
