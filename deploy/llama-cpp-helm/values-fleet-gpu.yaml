# llama.cpp CUDA on lab-gpu03 (virt03, GTX 1050 Ti 4GB).
replicaCount: 1

hfRepo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
hfQuant: Q4_K_M
model: Qwen2.5-0.5B-Instruct

ctxSize: 2048
nGpuLayers: 99

image:
  repository: 10.10.0.1:30443/ghcr-proxy/ggml-org/llama.cpp
  tag: server-cuda
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "4"
    memory: 6Gi
  requests:
    cpu: "2"
    memory: 4Gi

hostNetwork: true
useRuntimeClass: true
runtimeClassName: nvidia
useGpuResource: false

persistence:
  enabled: true
  size: 8Gi
