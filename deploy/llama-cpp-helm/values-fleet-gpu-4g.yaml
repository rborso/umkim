# ~4GB GPU lab profile (e.g. GTX 1050 Ti): Unsloth Qwen3.5-2B-UD Q8_K_XL, 8k context.
# Chart passes: llama-server -hf {{ hfRepo }}:{{ hfQuant }} --alias {{ model }}
replicaCount: 1
parallel: 1

hfRepo: unsloth/Qwen3.5-2B-GGUF
# GGUF file: Qwen3.5-2B-UD-Q8_K_XL.gguf
hfQuant: UD-Q8_K_XL
model: Qwen3.5-2B-UD

ctxSize: 8192
nGpuLayers: 99

image:
  repository: 10.10.0.1:30443/ghcr-proxy/ggml-org/llama.cpp
  tag: server-cuda
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "4"
    memory: 6Gi
  requests:
    cpu: "2"
    memory: 4Gi

hostNetwork: true
useRuntimeClass: true
runtimeClassName: nvidia
useGpuResource: false

persistence:
  enabled: true
  size: 12Gi
