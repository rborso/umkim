# Pre-merged ~4GB Qwen3.5-2B-UD profile (runtime + profile + Harbor ghcr-proxy image).
# Rebuild: scripts/render-llama-cpp-values.sh deploy/llama-cpp-helm/values-fleet-runtime.yaml \
#   deploy/llama-cpp-helm/profiles/qwen35-2b-ud-4g.yaml examples/llama-cpp-helm/overlay-harbor-ghcr-proxy.yaml.example
# (set HARBOR_REGISTRY=host:port for placeholder substitution in the example overlay)
replicaCount: 1
parallel: 1

hfRepo: unsloth/Qwen3.5-2B-GGUF
# GGUF file: Qwen3.5-2B-UD-Q8_K_XL.gguf
hfQuant: UD-Q8_K_XL
model: Qwen3.5-2B-UD

ctxSize: 8192
nGpuLayers: 99

jinja: true
chatTemplateKwargs: '{"enable_thinking":false}'

image:
  repository: 10.10.0.1:30443/ghcr-proxy/ggml-org/llama.cpp
  tag: server-cuda
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "4"
    memory: 6Gi
  requests:
    cpu: "2"
    memory: 4Gi

hostNetwork: true
useRuntimeClass: true
runtimeClassName: nvidia
useGpuResource: false

persistence:
  enabled: true
  size: 12Gi
