# FleetInstanceBackup — async Velero backup for a DCM catalog instance workload.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetinstancebackups.fleet.umkim.com
spec:
  group: fleet.umkim.com
  names:
    kind: FleetInstanceBackup
    listKind: FleetInstanceBackupList
    plural: fleetinstancebackups
    singular: fleetinstancebackup
    shortNames:
      - fib
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - instanceId
                - cluster
                - release
              properties:
                instanceId:
                  type: string
                cluster:
                  type: string
                release:
                  type: string
                namespace:
                  type: string
                wait:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Complete
                    - Failed
                message:
                  type: string
                veleroBackupName:
                  type: string
                jobName:
                  type: string
                artifactSecret:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
      additionalPrinterColumns:
        - name: Instance
          type: string
          jsonPath: .spec.instanceId
        - name: Cluster
          type: string
          jsonPath: .spec.cluster
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
