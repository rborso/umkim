# FleetInstanceRestore — async Velero restore + optional DCM rebind.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetinstancerestores.fleet.umkim.com
spec:
  group: fleet.umkim.com
  names:
    kind: FleetInstanceRestore
    listKind: FleetInstanceRestoreList
    plural: fleetinstancerestores
    singular: fleetinstancerestore
    shortNames:
      - fir
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - backupRef
                - targetCluster
              properties:
                backupRef:
                  type: string
                backupCRName:
                  type: string
                veleroBackupName:
                  type: string
                instanceId:
                  type: string
                release:
                  type: string
                namespace:
                  type: string
                targetCluster:
                  type: string
                sourceCluster:
                  type: string
                rebind:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    mode:
                      type: string
                      enum:
                        - supersede
                        - clone
                    displayNameSuffix:
                      type: string
                    userValuePatches:
                      type: array
                      items:
                        type: object
                        required:
                          - path
                          - value
                        properties:
                          path:
                            type: string
                          value:
                            type: string
                storageClassHints:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Restoring
                    - Rebinding
                    - Complete
                    - Failed
                message:
                  type: string
                veleroRestoreName:
                  type: string
                jobName:
                  type: string
                newInstanceId:
                  type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetCluster
        - name: Backup
          type: string
          jsonPath: .spec.backupRef
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
