# FleetChart — hub library entry for an OCI Helm chart published to Harbor.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetcharts.fleet.umkim.com
spec:
  group: fleet.umkim.com
  names:
    kind: FleetChart
    listKind: FleetChartList
    plural: fleetcharts
    singular: fleetchart
    shortNames:
      - fchart
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Images
          type: string
          jsonPath: .spec.imagePolicy
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - source
              properties:
                source:
                  type: string
                  enum:
                    - oci
                    - http
                    - upload
                    - harbor
                origin:
                  type: string
                version:
                  type: string
                imagePolicy:
                  type: string
                  enum:
                    - external
                    - proxy
                    - copy
                    - ""
                inboxFile:
                  type: string
                valuesYaml:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Fetching
                    - Publishing
                    - Ready
                    - Failed
                message:
                  type: string
                lastJobName:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                specHash:
                  type: string
                chart:
                  type: string
                digest:
                  type: string
                versions:
                  type: array
                  items:
                    type: string
                imageValues:
                  type: string
                imagesCopied:
                  type: array
                  items:
                    type: object
                    properties:
                      from:
                        type: string
                      to:
                        type: string
                oidcDefaults:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-map-type: atomic
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
