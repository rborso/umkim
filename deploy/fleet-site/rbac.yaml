apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-site-controller
  namespace: fleet-console
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-site-controller
rules:
  - apiGroups: ["fleet.umkim.com"]
    resources:
      - fleetsites
      - fleetsites/status
      - fleetclusterjoins
      - fleetclusterjoins/status
      - fleetingressauths
      - fleetingressauths/status
      - fleetacmes
      - fleetacmes/status
      - fleetllms
      - fleetllms/status
      - fleetinstancebackups
      - fleetinstancebackups/status
      - fleetinstancerestores
      - fleetinstancerestores/status
      - fleetapps
      - fleetapps/status
      - fleetcharts
      - fleetcharts/status
      - fleetllamaprofiles
      - fleetllamaprofiles/status
      - fleetllamaprofiletests
      - fleetllamaprofiletests/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters/proxy"]
    verbs: ["get", "create"]
  - apiGroups: ["work.open-cluster-management.io"]
    resources: ["manifestworks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["edge.umkim.com"]
    resources: ["fleetapproutes", "fleetapproutes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleet-site-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleet-site-controller
subjects:
  - kind: ServiceAccount
    name: fleet-site-controller
    namespace: fleet-console
