# FleetIngressAuth — console-driven Authelia + LLDAP ingress forward-auth.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetingressauths.fleet.umkim.com
spec:
  group: fleet.umkim.com
  names:
    kind: FleetIngressAuth
    listKind: FleetIngressAuthList
    plural: fleetingressauths
    singular: fleetingressauth
    shortNames:
      - fia
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                hubEnabled:
                  type: boolean
                  default: false
                hubExposeLldapWebUI:
                  type: boolean
                  default: false
                portalHost:
                  type: string
                cookieDomain:
                  type: string
                accessDomains:
                  type: array
                  items:
                    type: string
                secretsRef:
                  type: string
                  default: fleet-ingress-auth-secrets
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Disabled
                    - Applying
                    - Ready
                    - Failed
                message:
                  type: string
                hub:
                  type: object
                  properties:
                    phase:
                      type: string
                    message:
                      type: string
                    autheliaServiceURL:
                      type: string
                    lldapWebUIEnabled:
                      type: boolean
                    lldapWebUIURL:
                      type: string
                    lldapWebUIPhase:
                      type: string
                      enum:
                        - Disabled
                        - Enabling
                        - Ready
                        - Failed
                    lldapWebUIMessage:
                      type: string
                clusters:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                      message:
                        type: string
                lastJobName:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-map-type: atomic
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Hub
          type: string
          jsonPath: .spec.hubEnabled
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
