# FleetLlamaProfileTest — verify / extended chat session for a profile.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetllamaprofiletests.fleet.umkim.com
spec:
  group: fleet.umkim.com
  names:
    kind: FleetLlamaProfileTest
    listKind: FleetLlamaProfileTestList
    plural: fleetllamaprofiletests
    singular: fleetllamaprofiletest
    shortNames:
      - fllpt
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - profileName
                - clusterName
                - mode
              properties:
                profileName:
                  type: string
                clusterName:
                  type: string
                mode:
                  type: string
                  enum:
                    - quick
                    - extended
                fleetAppName:
                  type: string
                chartVersion:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                apiBase:
                  type: string
                model:
                  type: string
                message:
                  type: string
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .spec.profileName
        - name: Cluster
          type: string
          jsonPath: .spec.clusterName
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
