# FleetLLM — optional hub LiteLLM proxy for fleet-wide LLM API.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetllms.fleet.umkim.com
spec:
  group: fleet.umkim.com
  names:
    kind: FleetLLM
    listKind: FleetLLMList
    plural: fleetllms
    singular: fleetllm
    shortNames:
      - fllm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                hubEnabled:
                  type: boolean
                  default: false
                publicHost:
                  type: string
                masterKeySecretRef:
                  type: string
                backends:
                  type: array
                  items:
                    type: object
                    properties:
                      model:
                        type: string
                      apiBase:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Disabled
                    - Applying
                    - Ready
                    - Failed
                message:
                  type: string
                hub:
                  type: object
                  properties:
                    phase:
                      type: string
                    message:
                      type: string
                    endpoint:
                      type: string
                lastJobName:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-map-type: atomic
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Hub
          type: string
          jsonPath: .spec.hubEnabled
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
