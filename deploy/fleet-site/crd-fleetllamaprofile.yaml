# FleetLlamaProfile — llama-cpp-helm values profiles on the hub.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetllamaprofiles.fleet.umkim.com
spec:
  group: fleet.umkim.com
  names:
    kind: FleetLlamaProfile
    listKind: FleetLlamaProfileList
    plural: fleetllamaprofiles
    singular: fleetllamaprofile
    shortNames:
      - fllp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                description:
                  type: string
                profileYaml:
                  type: string
                chart:
                  type: string
                chartVersion:
                  type: string
                system:
                  type: boolean
            status:
              type: object
              properties:
                mergedValuesHash:
                  type: string
      additionalPrinterColumns:
        - name: System
          type: boolean
          jsonPath: .spec.system
        - name: Chart
          type: string
          jsonPath: .spec.chartVersion
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
