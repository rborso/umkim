- id: llm.inference-e2e
  layer: [2]
  suite: [llm, regression]
  module: S3
  mode: mutating
  requires: [hub, fleet_api, console, gpu]
  profiles: [homelab]
  script: scripts/verify-llm-inference-e2e.sh
  timeout_s: 1800
  blocking: true
  env:
    # Optional GPU topology; not one of the three default cluster examples.
    FLEET_LLM_CLUSTER: example-gpu
    FLEET_GPU_CLUSTER: example-gpu
    SKIP_LLM_DEPLOY: "0"
    LLM_E2E_USE_MOCK_FALLBACK: "0"

