---
# Post-creation NFS provisioner install on an existing K3s cluster (hub Ansible Job).
#
#   ansible-playbook cluster-configure-storage.yml -e fleet_cluster_name=my-cluster \
#     -i /inventory/inventory.ini
#
# Supports nfs_external (shared server) and nfs_local (single-node self-export).

- name: Fleet cluster storage | Local NFS server on bootstrap (nfs_local)
  hosts: site_bootstrap
  become: true
  gather_facts: true
  roles:
    - role: fleet_cluster_storage
      tasks_from: nfs_local_server.yml
      tags: [fleet_cluster_storage]

- name: Fleet cluster storage | NFS node packages on all nodes
  hosts: fleet_cluster_nodes
  become: true
  gather_facts: false
  roles:
    - role: fleet_cluster_storage
      tasks_from: nfs_nodes.yml
      tags: [fleet_cluster_storage]

- name: Fleet cluster storage | NFS provisioner on bootstrap
  hosts: site_bootstrap
  become: true
  gather_facts: false
  roles:
    - role: fleet_cluster_storage
      tasks_from: nfs_cluster.yml
      tags: [fleet_cluster_storage]
