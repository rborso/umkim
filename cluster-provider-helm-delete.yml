---
# Remove fleet-helm-release-sp from a console-provisioned cluster.

- name: Fleet cluster provider | Delete helm SP
  hosts: hub
  become: true
  gather_facts: false
  vars:
    fleet_site_name: "{{ fleet_cluster_name }}"
    fleet_site_ocm_name: "{{ fleet_cluster_name }}"
  tasks:
    - ansible.builtin.import_role:
        name: fleet_site
        tasks_from: delete_site_helm_provider.yml
      tags: [fleet_cluster_provider, fleet_cluster_provider_helm]
