---
- name: Harbor | Build sibling pin check list
  ansible.builtin.set_fact:
    harbor_git_pin_checks:
      - { name: control-plane, path: "{{ harbor_fleet_control_plane_local_src }}", ref: "{{ harbor_fleet_control_plane_git_ref | default('') }}" }
      - { name: k8s-container-service-provider, path: "{{ harbor_fleet_k8s_sp_local_src }}", ref: "{{ harbor_fleet_k8s_sp_git_ref | default('') }}" }
      - { name: kubevirt-service-provider, path: "{{ harbor_fleet_kubevirt_sp_local_src }}", ref: "{{ harbor_fleet_kubevirt_sp_git_ref | default('') }}" }
      - { name: fleet-olm-subscription-sp, path: "{{ harbor_fleet_olm_sp_local_src }}", ref: "{{ harbor_fleet_olm_sp_git_ref | default('') }}" }
      - { name: fleet-helm-release-sp, path: "{{ harbor_fleet_helm_sp_local_src }}", ref: "{{ harbor_fleet_helm_sp_git_ref | default('') }}" }
  run_once: true
  tags: [harbor, harbor_push_fleet, harbor_verify_git_pins]

- name: Harbor | Stat sibling repo on controller
  ansible.builtin.stat:
    path: "{{ item.path }}/.git"
  delegate_to: localhost
  become: false
  loop: "{{ harbor_git_pin_checks }}"
  loop_control:
    label: "{{ item.name }}"
  register: harbor_git_pin_git_stat
  run_once: true
  tags: [harbor, harbor_push_fleet, harbor_verify_git_pins]

- name: Harbor | Read sibling HEAD on controller
  ansible.builtin.command:
    cmd: git -C "{{ item.item.path }}" rev-parse HEAD
  delegate_to: localhost
  become: false
  loop: "{{ harbor_git_pin_git_stat.results }}"
  when:
    - item.item.ref | length > 0
    - item.stat.exists | default(false)
  register: harbor_git_pin_heads
  changed_when: false
  run_once: true
  tags: [harbor, harbor_push_fleet, harbor_verify_git_pins]

- name: Harbor | Assert sibling HEAD matches fleet_git_pins.yml
  ansible.builtin.assert:
    that:
      - item.stdout | trim == item.item.item.ref
    fail_msg: >-
      {{ item.item.item.name }} HEAD {{ item.stdout | trim }} != pin {{ item.item.item.ref }}.
      Run ./scripts/fleet-checkout-pins.sh or ./scripts/fleet-release-prepare.sh.
  loop: "{{ harbor_git_pin_heads.results | default([]) }}"
  when: item is not skipped
  loop_control:
    label: "{{ item.item.item.name }}"
  run_once: true
  tags: [harbor, harbor_push_fleet, harbor_verify_git_pins]
