---
- name: Fleet NFS server | Skip when disabled
  ansible.builtin.meta: end_host
  when: not (fleet_nfs_server_enabled | default(false) | bool)

- name: Fleet NFS server | Install packages
  ansible.builtin.package:
    name:
      - nfs-utils
      - rpcbind
    state: present
  tags: [fleet_nfs_server]

- name: Fleet NFS server | Ensure export base exists
  ansible.builtin.file:
    path: "{{ fleet_nfs_server_export_base }}"
    state: directory
    mode: "0755"
  tags: [fleet_nfs_server]

- name: Fleet NFS server | Build export line list
  ansible.builtin.set_fact:
    _fleet_nfs_export_lines: >-
      {{
        [fleet_nfs_server_export_base ~ ' ' ~ fleet_nfs_server_export_clients]
        + (fleet_nfs_server_extra_clients | default([]) | map('regex_replace', '^', fleet_nfs_server_export_base ~ ' ') | list)
      }}
  tags: [fleet_nfs_server]

- name: Fleet NFS server | Configure /etc/exports
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ item }}"
    create: true
    mode: "0644"
  loop: "{{ _fleet_nfs_export_lines }}"
  register: fleet_nfs_exports
  tags: [fleet_nfs_server]

- name: Fleet NFS server | Enable and start rpcbind + nfs-server
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - rpcbind
    - nfs-server
  tags: [fleet_nfs_server]

- name: Fleet NFS server | Reload exports
  ansible.builtin.command: exportfs -ra
  when: fleet_nfs_exports is changed
  changed_when: true
  tags: [fleet_nfs_server]
