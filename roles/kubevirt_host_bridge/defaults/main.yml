---
# Day-0/day-2 host Linux bridge for Multus L2 KubeVirt VMs (all cluster nodes).
kubevirt_bridge_host_bridge: mgmt-l2-br
kubevirt_bridge_slave_nic: ""
kubevirt_bridge_keep_ip: true
kubevirt_bridge_cni_bin_dir: /opt/cni/bin
# Management IPv4 used to discover the NIC to enslave (inventory ansible_host).
kubevirt_bridge_mgmt_ip: "{{ fleet_node_mgmt_address | default(ansible_host) }}"
# After day-2 bridge, Calico must autodetect the bridge interface (not the enslaved NIC).
kubevirt_bridge_reconcile_calico: true
calico_kubeconfig: /etc/rancher/k3s/k3s.yaml
calico_rollout_timeout: 600
# Guests behind the host bridge need forwarded traffic allowed. When firewalld is
# active, move the bridge interface into the trusted zone so external clients can
# reach guest IPs (otherwise the public zone rejects forwarding with icmp-host-prohibited).
kubevirt_bridge_trust_firewalld: true
