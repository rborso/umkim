---
phase5_helm_sp_manifestwork_name: phase5-helm-release-sp
phase5_helm_sp_worker_namespace: dcm-worker
phase5_helm_sp_image_tag: "{{ harbor_fleet_image_tag | default('0.1.0') }}"
phase5_helm_sp_image: >-
  {{ harbor_fleet_image_prefix | default(phase5_dcm_registry ~ '/fleet/fleet-helm-release-sp')
  }}/fleet-helm-release-sp:{{ phase5_helm_sp_image_tag }}
fleet_helm_sp_harbor_pull_secret: true
fleet_helm_sp_harbor_pull_secret_name: harbor-fleet-pull
# Comma-separated OCI prefixes the helm SP may pull (see HELM_CHART_OCI_PREFIXES).
helm_chart_oci_prefixes: >-
  {{ harbor_charts_oci_prefix | default('oci://' ~ harbor_host ~ ':' ~ harbor_nodeport_https ~ '/charts') }},oci://registry-1.docker.io,oci://docker.io,oci://quay.io,oci://ghcr.io
