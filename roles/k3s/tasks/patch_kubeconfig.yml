---
# K3s writes server: https://0.0.0.0:6443 when --bind-address=0.0.0.0; kubectl cannot dial that.
- name: K3s | Patch kubeconfig when API binds on all interfaces
  ansible.builtin.replace:
    path: "{{ k3s_kubeconfig }}"
    regexp: 'https://0\.0\.0\.0:6443'
    replace: "https://{{ k3s_kubeconfig_server_host | default('127.0.0.1') }}:6443"
  when: k3s_bind_address | default('') == '0.0.0.0'
  tags: [k3s, k3s_cluster, k3s_kubeconfig]
