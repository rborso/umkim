---
# K3s binds kubelet to the node InternalIP (mgmt or WireGuard). Pod-network
# scrapes to :10250 hit firewalld REJECT ("no route to host") on hosts that keep
# firewalld (GPU/hypervisor). Run metrics-server on hostNetwork + secure-port
# 10251 so it can scrape kubelet.
#
# The k3s metrics-server addon is disabled (k3s_disable_components). With it
# enabled, k3s merged its embedded manifest with whatever the fleet left in the
# addon path on every server start: the container ports list is keyed by
# containerPort+protocol, so the fleet's 10251 landed beside k3s's port as a
# second entry that was also named "https". The merged Deployment was invalid,
# k3s logged the failure every 15s, and on restart k3s rewrote its own file and
# put metrics-server back on the pod network. The fleet now ships the whole
# addon set itself, under names k3s does not manage.
#
# Do not wait for rollout in the early k3s role: with flannel-backend=none the
# node stays NotReady until Calico, and cluster-provision-local.yml re-runs this
# after Calico and waits for the rollout there.
- name: K3s | Write metrics-server RBAC, Service and APIService
  ansible.builtin.copy:
    src: metrics-server-extras.yaml
    dest: /var/lib/rancher/k3s/server/manifests/fleet-metrics-server-extras.yaml
    owner: root
    group: root
    mode: "0600"
  when:
    - k3s_role == 'server'
    - k3s_metrics_server_host_network | default(true) | bool
  tags: [k3s, k3s_metrics_server]

- name: K3s | Write hostNetwork metrics-server deployment
  ansible.builtin.template:
    src: metrics-server-deployment.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/fleet-metrics-server-deployment.yaml
    owner: root
    group: root
    mode: "0600"
  when:
    - k3s_role == 'server'
    - k3s_metrics_server_host_network | default(true) | bool
  tags: [k3s, k3s_metrics_server]

# The staged copy under server/umkim and the addon-path overwrite loop are gone
# with the addon; remove any staging directory a previous release left behind.
- name: K3s | Remove the retired metrics-server staging directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/umkim
    state: absent
  when:
    - k3s_role == 'server'
    - k3s_metrics_server_host_network | default(true) | bool
  tags: [k3s, k3s_metrics_server]
