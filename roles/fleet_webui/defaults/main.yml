---
fleet_console_namespace: fleet-console

# OCM Lab Dashboard (open-cluster-management-io/lab) — maintainer lab only; see fleet-webui-lab.yml
ocm_lab_enabled: false
ocm_lab_nodeport: 30910
ocm_lab_helm_release: ocm-dashboard
ocm_lab_chart_path: /tmp/ocm-lab-dashboard/dashboard/charts/ocm-dashboard
ocm_lab_image_tag: ""
ocm_lab_api_image: quay.io/open-cluster-management/dashboard-api
ocm_lab_ui_image: quay.io/open-cluster-management/dashboard-ui
ocm_lab_api_image_tag: "latest@sha256:17c365a4efadcb054791df66d8ef816aee12386ef256c60789f92ae4d24da96d"
ocm_lab_ui_image_tag: "latest@sha256:a85e81c84ba953e87cab104eac69f9cda3f96ba98ca86123a6e5af51cbee9e56"
ocm_lab_bypass_auth: true
ocm_lab_api_replicas: 1
ocm_lab_ui_replicas: 1

# Legacy static HTML OCM console (superseded by lab dashboard)
ocm_console_enabled: false
ocm_console_nodeport: 30915
ocm_console_image: docker.io/library/nginx:1.27-alpine
ocm_kubectl_image: docker.io/bitnami/kubectl@sha256:9e369df7ab3386b736d162348f167bcc02cb4ba3f5203e9151be854437d6e0af

# UMKIM console (PatternFly SPA; Harbor image umkim-console).
umkim_console_enabled: true
umkim_console_nodeport: 30912
umkim_console_gateway_path: false
umkim_console_use_patternfly: true
umkim_console_image: "{{ harbor_fleet_image_prefix }}/umkim-console:{{ umkim_console_tag | default(harbor_fleet_image_tag | default('0.2.0')) }}"
umkim_console_image_pull_policy: Always
# Overridden by inventory umkim_console_tag when set (console-only bumps).
umkim_console_tag: "{{ harbor_fleet_image_tag | default('0.2.0') }}"
