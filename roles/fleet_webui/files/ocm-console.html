<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OCM Fleet Console</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f4f6f8; }
    body { margin: 0; padding: 1.5rem; max-width: 1100px; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .meta { color: #555; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    th, td { text-align: left; padding: .6rem .75rem; border-bottom: 1px solid #e5e7eb; }
    th { background: #eef2f7; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
    .ok { color: #0a7a2f; font-weight: 600; }
    .warn { color: #9a6700; font-weight: 600; }
    .err { color: #b42318; font-weight: 600; }
    pre { background: #fff; padding: 1rem; overflow: auto; border: 1px solid #e5e7eb; }
    a { color: #0b5cab; }
    #status { margin: 1rem 0; }
  </style>
</head>
<body>
  <h1>OCM Fleet Console</h1>
  <p class="meta">Read-only view of ManagedClusters and ManifestWorks on the hub (open-cluster-management).</p>
  <div id="status">Loading…</div>
  <h2>Managed clusters</h2>
  <table id="clusters">
    <thead><tr><th>Name</th><th>Accepted</th><th>Available</th><th>Hub accepted</th></tr></thead>
    <tbody></tbody>
  </table>
  <h2>ManifestWorks (sample)</h2>
  <table id="works">
    <thead><tr><th>Namespace</th><th>Name</th><th>Applied</th></tr></thead>
    <tbody></tbody>
  </table>
  <h2>Raw</h2>
  <pre id="raw"></pre>
  <script>
    const status = document.getElementById('status');
    const clustersBody = document.querySelector('#clusters tbody');
    const worksBody = document.querySelector('#works tbody');
    const raw = document.getElementById('raw');

    async function k8s(path) {
      const r = await fetch('/api/' + path.replace(/^\//, ''));
      if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
      return r.json();
    }

    function cond(item, type) {
      const c = (item.status && item.status.conditions) || [];
      const hit = c.find(x => x.type === type);
      return hit ? hit.status : '—';
    }

    (async () => {
      try {
        const [mc, mw] = await Promise.all([
          k8s('apis/cluster.open-cluster-management.io/v1/managedclusters'),
          k8s('apis/work.open-cluster-management.io/v1/manifestworks'),
        ]);
        raw.textContent = JSON.stringify({ managedClusters: mc, manifestWorks: mw }, null, 2);
        clustersBody.innerHTML = '';
        for (const item of (mc.items || [])) {
          const tr = document.createElement('tr');
          const accepted = cond(item, 'ManagedClusterAccepted');
          const available = cond(item, 'ManagedClusterConditionAvailable');
          tr.innerHTML = '<td><strong>' + item.metadata.name + '</strong></td>'
            + '<td class="' + (accepted === 'True' ? 'ok' : 'warn') + '">' + accepted + '</td>'
            + '<td class="' + (available === 'True' ? 'ok' : 'warn') + '">' + available + '</td>'
            + '<td>' + (item.spec.hubAcceptsClient || false) + '</td>';
          clustersBody.appendChild(tr);
        }
        worksBody.innerHTML = '';
        for (const item of (mw.items || []).slice(0, 40)) {
          const applied = cond(item, 'Applied');
          const tr = document.createElement('tr');
          tr.innerHTML = '<td>' + item.metadata.namespace + '</td>'
            + '<td>' + item.metadata.name + '</td>'
            + '<td class="' + (applied === 'True' ? 'ok' : 'warn') + '">' + applied + '</td>';
          worksBody.appendChild(tr);
        }
        status.textContent = 'Updated ' + new Date().toLocaleString();
      } catch (e) {
        status.innerHTML = '<span class="err">Failed: ' + e.message + '</span>';
        raw.textContent = String(e);
      }
    })();
  </script>
</body>
</html>
