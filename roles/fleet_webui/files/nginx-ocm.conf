server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index ocm-console.html;

    location / {
        try_files $uri $uri/ /ocm-console.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
