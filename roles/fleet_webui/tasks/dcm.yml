---
- name: Fleet WebUI | Ensure fleet-console namespace
  ansible.builtin.import_tasks: ensure_namespace.yml

- name: Fleet WebUI | Render DCM UI manifest
  ansible.builtin.template:
    src: dcm-ui.yaml.j2
    dest: /tmp/fleet-webui-dcm.yaml
    mode: "0600"
  when: dcm_ui_enabled | bool
  tags: [fleet_webui, dcm_webui]

- name: Fleet WebUI | Apply DCM UI
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/fleet-webui-dcm.yaml
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: fleet_webui_dcm_apply
  changed_when: "'created' in fleet_webui_dcm_apply.stdout or 'configured' in fleet_webui_dcm_apply.stdout"
  when: dcm_ui_enabled | bool
  tags: [fleet_webui, dcm_webui]

- name: Fleet WebUI | Wait for DCM UI
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ fleet_webui_namespace }} wait
      --for=condition=Available deployment/dcm-ui --timeout=300s
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  changed_when: false
  when: dcm_ui_enabled | bool
  tags: [fleet_webui, dcm_webui]

- name: Fleet WebUI | Update DCM gateway routes (ConfigMap + auto-rollout)
  ansible.builtin.import_role:
    name: dcm
    tasks_from: traefik_config.yml
  when:
    - dcm_ui_enabled | bool
    - dcm_ui_gateway_path | bool
  tags: [fleet_webui, dcm_webui]

- name: Fleet WebUI | Probe DCM UI NodePort
  ansible.builtin.command:
    cmd: curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:{{ dcm_ui_nodeport }}/
  register: fleet_webui_dcm_http
  changed_when: false
  failed_when: fleet_webui_dcm_http.stdout | trim != '200'
  when: dcm_ui_enabled | bool
  tags: [fleet_webui, dcm_webui, fleet_webui_verify]

- name: Fleet WebUI | Probe DCM UI via gateway /ui/
  ansible.builtin.command:
    cmd: curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:{{ phase5_gateway_nodeport }}/ui/
  register: fleet_webui_dcm_gw_http
  changed_when: false
  failed_when: fleet_webui_dcm_gw_http.stdout | trim != '200'
  when:
    - dcm_ui_enabled | bool
    - dcm_ui_gateway_path | bool
  tags: [fleet_webui, dcm_webui, fleet_webui_verify]
