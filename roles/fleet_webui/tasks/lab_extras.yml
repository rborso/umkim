---
- name: Fleet WebUI lab | Assert hub-only
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['hub']
    fail_msg: Fleet WebUI lab extras deploy only on the hub.
  tags: [fleet_webui_lab, ocm_webui, ocm_lab, dcm_webui]

- name: Fleet WebUI lab | Deploy OCM Lab Dashboard
  ansible.builtin.import_tasks: ocm_lab.yml
  when: ocm_lab_enabled | default(false) | bool
  tags: [fleet_webui_lab, ocm_webui, ocm_lab]

- name: Fleet WebUI lab | Deploy DCM Swagger UI
  ansible.builtin.import_tasks: dcm.yml
  when: dcm_ui_enabled | default(false) | bool
  tags: [fleet_webui_lab, dcm_webui]

- name: Fleet WebUI lab | Gateway /fleet/ routes for console
  ansible.builtin.import_role:
    name: fleet_console_helm
    tasks_from: gateway_routes.yml
  when: dcm_fleet_gateway_path | default(false) | bool
  tags: [fleet_webui_lab, dcm_webui, dcm_fleet, fleet_console_gateway_routes]

- name: Fleet WebUI lab | Access URLs
  ansible.builtin.debug:
    msg: "{{ fleet_webui_lab_access_urls }}"
  vars:
    fleet_webui_lab_access_urls: >-
      {{
        ([] if not (ocm_lab_enabled | default(false) | bool) else
          ['OCM Lab Dashboard: http://' ~ phase5_hub_wireguard_ip ~ ':' ~ ocm_lab_nodeport ~ '/'])
        + (['DCM Fleet Dashboard: http://' ~ phase5_hub_wireguard_ip ~ ':' ~ dcm_fleet_dashboard_nodeport ~ '/fleet/login']
           if dcm_fleet_dashboard_enabled | default(true) | bool else [])
        + ([] if not (dcm_ui_enabled | default(false) | bool) else
          ['DCM Swagger UI: http://' ~ phase5_hub_wireguard_ip ~ ':' ~ dcm_ui_nodeport ~ '/',
           'DCM Swagger via gateway: http://' ~ phase5_hub_wireguard_ip ~ ':' ~ phase5_gateway_nodeport ~ '/ui/'])
        + (['DCM Fleet via gateway: http://' ~ phase5_hub_wireguard_ip ~ ':' ~ phase5_gateway_nodeport ~ '/fleet/']
           if dcm_fleet_gateway_path | default(false) | bool else [])
        + ['DCM API: http://' ~ phase5_hub_wireguard_ip ~ ':' ~ phase5_gateway_nodeport ~ '/api/v1alpha1/providers']
      }}
  tags: [fleet_webui_lab, fleet_webui_verify]
