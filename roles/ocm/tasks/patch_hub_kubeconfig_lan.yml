---
# Klusterlet bootstrap kubeconfig defaults to hub WireGuard API; LAN-only spokes need mgmt IP.
- name: OCM | Require LAN hub API override
  ansible.builtin.assert:
    that:
      - ocm_hub_apiserver_lan is defined
      - ocm_hub_apiserver_lan | length > 0
    fail_msg: Set ocm_hub_apiserver_lan (e.g. https://198.51.100.10:6443) for clusters without WireGuard.
  tags: [ocm, ocm_patch_hub_kubeconfig]

- name: OCM | Check bootstrap hub kubeconfig secret
  ansible.builtin.command:
    cmd: kubectl -n open-cluster-management-agent get secret bootstrap-hub-kubeconfig
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: ocm_bootstrap_secret
  changed_when: false
  failed_when: false
  tags: [ocm, ocm_patch_hub_kubeconfig]

- name: OCM | Patch bootstrap hub kubeconfig server to LAN API
  ansible.builtin.shell: |
    set -euo pipefail
    raw="$(kubectl -n open-cluster-management-agent get secret bootstrap-hub-kubeconfig -o jsonpath='{.data.kubeconfig}')"
    cfg="$(echo "$raw" | base64 -d)"
    new_cfg="$(printf '%s' "$cfg" | sed -E "s|server: https://[^[:space:]]+|server: ${OCM_HUB_API_LAN}|")"
    if [ "$cfg" = "$new_cfg" ]; then
      echo "unchanged"
      exit 0
    fi
    enc="$(printf '%s' "$new_cfg" | base64 -w0)"
    kubectl -n open-cluster-management-agent patch secret bootstrap-hub-kubeconfig \
      --type=merge -p "{\"data\":{\"kubeconfig\":\"${enc}\"}}"
    echo "patched"
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
    OCM_HUB_API_LAN: "{{ ocm_hub_apiserver_lan }}"
  args:
    executable: /bin/bash
  when: ocm_bootstrap_secret.rc == 0
  register: ocm_patch_kc
  changed_when: "'patched' in ocm_patch_kc.stdout"
  tags: [ocm, ocm_patch_hub_kubeconfig]

- name: OCM | Restart registration agent after kubeconfig patch
  ansible.builtin.command:
    cmd: >-
      kubectl -n open-cluster-management-agent rollout restart
      deployment/klusterlet-registration-agent
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  when: ocm_patch_kc is changed
  tags: [ocm, ocm_patch_hub_kubeconfig]

- name: OCM | Wait for registration agent ready
  ansible.builtin.command:
    cmd: >-
      kubectl -n open-cluster-management-agent rollout status
      deployment/klusterlet-registration-agent --timeout=300s
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  when: ocm_patch_kc is changed
  changed_when: false
  tags: [ocm, ocm_patch_hub_kubeconfig]
