---
# clusteradm init on single-homed hubs may embed https://0.0.0.0:6443; spokes need overlay/LAN URL.
- name: OCM | Read bootstrap hub kubeconfig
  ansible.builtin.command:
    cmd: >-
      kubectl -n open-cluster-management-agent get secret bootstrap-hub-kubeconfig
      -o jsonpath={.data.kubeconfig}
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: ocm_bootstrap_kc_b64
  changed_when: false
  failed_when: false
  tags: [ocm, ocm_post_join, ocm_spoke]

- name: OCM | Compute fixed bootstrap hub kubeconfig
  ansible.builtin.set_fact:
    ocm_bootstrap_kc_fixed_b64: >-
      {{ (ocm_bootstrap_kc_b64.stdout | b64decode
          | replace('https://0.0.0.0:6443', ocm_hub_apiserver)) | b64encode }}
  when:
    - ocm_bootstrap_kc_b64.rc == 0
    - ocm_bootstrap_kc_b64.stdout | length > 0
    - ocm_hub_apiserver | default('') | length > 0
  tags: [ocm, ocm_post_join, ocm_spoke]

- name: OCM | Patch bootstrap hub API server URL
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - secret
      - bootstrap-hub-kubeconfig
      - -n
      - open-cluster-management-agent
      - --type
      - merge
      - -p
      - "{{ {'data': {'kubeconfig': ocm_bootstrap_kc_fixed_b64}} | to_json }}"
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  when:
    - ocm_bootstrap_kc_fixed_b64 is defined
    - ocm_bootstrap_kc_b64.stdout != ocm_bootstrap_kc_fixed_b64
  register: ocm_patch_bootstrap_kc
  changed_when: ocm_patch_bootstrap_kc.rc == 0
  tags: [ocm, ocm_post_join, ocm_spoke]

- name: OCM | Restart klusterlet registration agent after bootstrap kubeconfig patch
  ansible.builtin.command:
    cmd: kubectl -n open-cluster-management-agent rollout restart deploy/klusterlet-registration-agent
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  when:
    - ocm_patch_bootstrap_kc is changed
  tags: [ocm, ocm_post_join, ocm_spoke]
