---
- name: OCM | List managed clusters pending accept
  ansible.builtin.command:
    cmd: kubectl get managedclusters -o json
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
  register: ocm_managedclusters
  changed_when: false
  tags: [ocm, ocm_accept]

- name: OCM | Accept each spoke cluster
  ansible.builtin.command:
    cmd: "{{ ocm_clusteradm_path }} accept --clusters {{ item }}"
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
  loop: "{{ groups['spokes'] }}"
  register: ocm_accept
  changed_when: ocm_accept.rc == 0
  failed_when: false
  tags: [ocm, ocm_accept]

- name: OCM | Verify spoke clusters are accepted
  ansible.builtin.command:
    cmd: >-
      kubectl get managedcluster {{ item }}
      -o jsonpath={.spec.hubAcceptsClient}
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
  loop: "{{ groups['spokes'] }}"
  register: ocm_accept_check
  changed_when: false
  failed_when: false
  tags: [ocm, ocm_accept]

- name: OCM | Assert registered spokes are accepted on hub
  ansible.builtin.assert:
    that: result.rc == 0 and result.stdout | trim == 'true'
    fail_msg: >-
      Managed cluster {{ result.item }} missing or not accepted
      (rc={{ result.rc }}, hubAcceptsClient={{ result.stdout | default('') | trim }})
  loop: "{{ ocm_accept_check.results }}"
  loop_control:
    loop_var: result
    label: "{{ result.item }}"
  tags: [ocm, ocm_accept]

- name: OCM | Report managed clusters
  ansible.builtin.command:
    cmd: "{{ ocm_clusteradm_path }} get clusters"
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
  register: ocm_clusters_list
  changed_when: false
  tags: [ocm, ocm_accept]

- name: OCM | Show fleet clusters
  ansible.builtin.debug:
    var: ocm_clusters_list.stdout_lines
  tags: [ocm, ocm_accept]
