---
- name: OCM | Check managed cluster on hub
  ansible.builtin.command:
    cmd: >-
      kubectl get managedcluster {{ ocm_cluster_name }}
      -o jsonpath={.metadata.name}
  environment:
    KUBECONFIG: "{{ hostvars[ocm_hub_host].ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  delegate_to: "{{ ocm_hub_host }}"
  register: ocm_reset_mc
  changed_when: false
  failed_when: false
  tags: [ocm, ocm_reset]

- name: OCM | Delete hub ManagedCluster when forcing re-join
  ansible.builtin.command:
    cmd: kubectl delete managedcluster {{ ocm_cluster_name }} --ignore-not-found --wait=true
  environment:
    KUBECONFIG: "{{ hostvars[ocm_hub_host].ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  delegate_to: "{{ ocm_hub_host }}"
  when: ocm_force_rejoin | default(false) | bool
  tags: [ocm, ocm_reset]

- name: OCM | Check klusterlet namespace on spoke
  ansible.builtin.command:
    cmd: kubectl get ns open-cluster-management-agent
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: ocm_reset_agent_ns
  changed_when: false
  failed_when: false
  tags: [ocm, ocm_reset]

- name: OCM | Remove partial klusterlet install before re-join
  ansible.builtin.command:
    cmd: kubectl delete ns {{ item }} --ignore-not-found --wait=true
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  loop:
    - open-cluster-management
    - open-cluster-management-agent
    - open-cluster-management-agent-addon
  when:
    - ocm_force_rejoin | default(false) | bool
      or ocm_reset_mc.stdout | trim != ocm_cluster_name
      or ocm_reset_agent_ns.rc != 0
  tags: [ocm, ocm_reset]
