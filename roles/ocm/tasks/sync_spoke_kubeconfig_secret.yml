---
# Hub: copy spoke k3s kubeconfig into fleet-system/fleet-kubeconfig-<cluster> for fleet-site
# direct node API (OCM managedcluster/proxy requires cluster-gateway addon).
- name: OCM | Ensure fleet-system namespace for kubeconfig secrets
  ansible.builtin.command:
    cmd: kubectl create namespace fleet-system --dry-run=client -o yaml
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: ocm_fleet_system_ns
  changed_when: false
  tags: [ocm, ocm_spoke_kubeconfig]

- name: OCM | Apply fleet-system namespace
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ ocm_fleet_system_ns.stdout }}"
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  changed_when: "'created' in ocm_fleet_system_ns_apply.stdout or 'configured' in ocm_fleet_system_ns_apply.stdout"
  register: ocm_fleet_system_ns_apply
  tags: [ocm, ocm_spoke_kubeconfig]

- name: OCM | Sync spoke kubeconfig secret for fleet-site node API
  ansible.builtin.shell: |
    set -euo pipefail
    cluster="{{ item.cluster }}"
    api_host="{{ item.api_host }}"
    ssh_user="{{ item.ssh_user | default('linux') }}"
    secret_name="fleet-kubeconfig-${cluster}"
    ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
    if [[ -n "{{ ocm_spoke_kubeconfig_ssh_private_key_file | default('') }}" ]]; then
      ssh_opts+=(-i "{{ ocm_spoke_kubeconfig_ssh_private_key_file }}")
    fi
    kc=$(ssh "${ssh_opts[@]}" "${ssh_user}@${api_host}" 'sudo cat /etc/rancher/k3s/k3s.yaml')
    kc=$(printf '%s' "$kc" | sed -E "s|server: https://[^[:space:]]+:6443|server: https://${api_host}:6443|g")
    kubectl -n fleet-system create secret generic "$secret_name" \
      --from-literal=kubeconfig="$kc" \
      --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  delegate_to: "{{ 'localhost' if (ocm_spoke_kubeconfig_delegate_local | default(false) | bool) else omit }}"
  become: "{{ not (ocm_spoke_kubeconfig_delegate_local | default(false) | bool) }}"
  environment:
    KUBECONFIG: "{{ ocm_spoke_kubeconfig_kubectl_config | default(ocm_kubeconfig) }}"
    PATH: "{{ k3s_command_path }}"
  loop: "{{ ocm_spoke_kubeconfig_sync_targets }}"
  loop_control:
    label: "{{ item.cluster }}"
  changed_when: true
  tags: [ocm, ocm_spoke_kubeconfig]
