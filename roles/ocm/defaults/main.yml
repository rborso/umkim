---
ocm_clusteradm_install_url: https://raw.githubusercontent.com/open-cluster-management-io/clusteradm/a0fe3262ebba61db66d7820441145c9934949d2d/install.sh
ocm_clusteradm_path: /usr/local/bin/clusteradm
ocm_clusteradm_version: v1.3.1
ocm_bundle_version: "1.3.1"
ocm_hub_apiserver: ""
ocm_kubeconfig: /etc/rancher/k3s/k3s.yaml
ocm_namespace: open-cluster-management
ocm_wait: true
ocm_create_namespace: true
ocm_force_init: false
ocm_join_command_path: /etc/ocm/hub-join-command.sh
ocm_registration_drivers: csr
# Overlay spokes: klusterlet registration operator reverts hostNetwork patches; pause it during join.
ocm_klusterlet_overlay_hostnetwork: true
