  - phase6-spoke-demo
  - phase6-spoke-ingress
  - phase5-helm-release-sp
  - phase5-olm-subscription-sp
  - phase5-k8s-container-sp
  - phase5-kubevirt-sp
  - phase4-platform-bootstrap

fleet_cleanup_legacy_manifestworks:
  - phase6-spoke-ingress-demo
  - phase5-k8s-container-sp

fleet_cleanup_hub_namespaces:
  - dcm
  - fleet-console
  - fleet-ingress
  - fleet-ingress-auth
  - fleet-system
  - fleet-bootstrap
  - harbor
  - open-cluster-management
  - cert-manager
  - operators

fleet_cleanup_platform_namespaces:
  - olm
  - openshift-operators
  - kubevirt
  - cdi
