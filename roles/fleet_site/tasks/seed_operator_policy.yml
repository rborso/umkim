---
# Per-site DCM policy: route service_type operator to olm-<cluster>.
- name: Fleet site | Skip operator policy when OLM SP disabled
  ansible.builtin.meta: end_host
  when: not (fleet_site_deploy_olm_sp | default(true) | bool)

- name: Fleet site | Operator policy API base
  ansible.builtin.set_fact:
    fleet_site_operator_api_url: "{{ fleet_site_operator_api_url | default(phase5_registration_url) }}"
    fleet_site_ocm_cluster: "{{ fleet_site_ocm_name | default(fleet_site_name) }}"
    fleet_site_olm_provider: "olm-{{ fleet_site_ocm_cluster }}"
  tags: [fleet_site, fleet_site_operator, fleet_site_provision]

- name: Fleet site | Seed site-operator policy
  ansible.builtin.uri:
    url: "{{ fleet_site_operator_api_url }}/policies?id=site-operator-{{ fleet_site_ocm_cluster }}"
    method: POST
    body_format: json
    status_code: [200, 201, 409]
    body:
      display_name: "Site operator route {{ fleet_site_ocm_cluster }}"
      description: "Route operator catalog instances to {{ fleet_site_olm_provider }}"
      policy_type: GLOBAL
      enabled: true
      priority: 120
      rego_code: |
        package dcm.fleet.site.{{ fleet_site_ocm_cluster | regex_replace('[^a-zA-Z0-9]', '_') }}

        main := {
          "rejected": false,
          "selected_provider": "{{ fleet_site_olm_provider }}"
        } if input.spec.service_type == "operator"
  run_once: true
  tags: [fleet_site, fleet_site_operator, fleet_site_provision]

- name: Fleet site | Update site-operator policy
  ansible.builtin.uri:
    url: "{{ fleet_site_operator_api_url }}/policies/site-operator-{{ fleet_site_ocm_cluster }}"
    method: PATCH
    body_format: json
    status_code: [200, 404]
    headers:
      Content-Type: application/merge-patch+json
    body:
      enabled: true
      rego_code: |
        package dcm.fleet.site.{{ fleet_site_ocm_cluster | regex_replace('[^a-zA-Z0-9]', '_') }}

        main := {
          "rejected": false,
          "selected_provider": "{{ fleet_site_olm_provider }}"
        } if input.spec.service_type == "operator"
  run_once: true
  tags: [fleet_site, fleet_site_operator, fleet_site_provision]
