---
- name: Fleet site | Resolve kubevirt provider delete
  ansible.builtin.set_fact:
    fleet_site_ocm_cluster: "{{ fleet_site_ocm_name | default(fleet_site_name) }}"
    fleet_site_kubevirt_sp_name: "{{ fleet_site_dcm_kubevirt_sp_name | default('kubevirt-' ~ (fleet_site_ocm_name | default(fleet_site_name))) }}"
    fleet_site_vm_api_url: "{{ fleet_site_vm_api_url | default(fleet_site_dcm_api_url) }}"

- name: Fleet site | Delete kubevirt SP ManifestWork
  ansible.builtin.command:
    cmd: >-
      kubectl delete manifestwork {{ phase5_kubevirt_sp_manifestwork_name | default('phase5-kubevirt-sp') }}
      -n {{ fleet_site_ocm_cluster }} --ignore-not-found --wait=false
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  changed_when: true
  tags: [fleet_site, fleet_site_provider_delete]

- name: Fleet site | Unregister kubevirt provider from SPM
  ansible.builtin.import_tasks: unregister_dcm_provider.yml
  vars:
    fleet_site_unregister_provider_name: "{{ fleet_site_kubevirt_sp_name }}"
    fleet_site_unregister_provider_api_url: "{{ fleet_site_vm_api_url }}"
  tags: [fleet_site, fleet_site_provider_delete]

- name: Fleet site | Remove site-vm policy
  ansible.builtin.uri:
    url: "{{ fleet_site_vm_api_url }}/policies/site-vm-{{ fleet_site_ocm_cluster }}"
    method: DELETE
    status_code: [200, 204, 404]
  tags: [fleet_site, fleet_site_provider_delete]
