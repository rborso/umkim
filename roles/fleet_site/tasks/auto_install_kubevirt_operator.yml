---
# Optional KubeVirt is a spoke platform add-on (kubevirt_stack / ManifestWork),
# not a catalog instance. This task is a no-op so leftover extra-vars stay harmless.
- name: Fleet site | KubeVirt is not installed via catalog
  ansible.builtin.debug:
    msg: >-
      fleet_site_auto_install_kubevirt_operator is ignored.
      Install KubeVirt with the kubevirt_stack role after the cluster is Ready.
  when: fleet_site_auto_install_kubevirt_operator | default(false) | bool
  tags: [fleet_site, fleet_site_kubevirt, fleet_site_provision]
