---
# Push phase6-spoke-ingress ManifestWork for a console-provisioned cluster (hub kubectl).
- name: Fleet site | Resolve OCM cluster name for spoke ingress
  ansible.builtin.set_fact:
    fleet_site_ocm_cluster: "{{ fleet_cluster_name | default(fleet_site_name) }}"

- name: Fleet site | Resolve spoke ingress vars from site_bootstrap inventory
  ansible.builtin.set_fact:
    fleet_site_bootstrap_host: "{{ groups['site_bootstrap'][0] }}"
    fleet_site_spoke_direct_ingress: >-
      {{ hostvars[groups['site_bootstrap'][0]].fleet_cluster_spoke_direct_ingress
         | default(false) | bool }}
    fleet_site_spoke_http_port: >-
      {{ hostvars[groups['site_bootstrap'][0]].fleet_cluster_traefik_http_port
         | default(phase6_http_nodeport) }}
    fleet_site_spoke_https_port: >-
      {{ hostvars[groups['site_bootstrap'][0]].fleet_cluster_traefik_https_port
         | default(phase6_https_nodeport) }}
    fleet_site_spoke_endpoint: >-
      {{ hostvars[groups['site_bootstrap'][0]].fleet_site_sp_endpoint
         | default(hostvars[groups['site_bootstrap'][0]].ansible_host) }}

- name: Fleet site | Resolve spoke ingress method from fleet-edge-clusters
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ fleet_edge_clusters_cm_namespace | default('fleet-system') }}"
      - get
      - configmap
      - "{{ fleet_edge_clusters_cm_name | default('fleet-edge-clusters') }}"
      - -o
      - "jsonpath={.data.clusters\\.yaml}"
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: fleet_site_edge_clusters_raw
  # The registry entry is written by the fleet-site controller, which resolves the
  # site ingress (method, dns_zone) asynchronously once the cluster has joined.
  # Rendering before that lands silently drops the in-cluster name override, and a
  # pod calling one of this site's own public hostnames then leaves the cluster and
  # is refused by the site router's NAT loopback (that is what broke the
  # Nextcloud/Collabora WOPI fetch). Wait for a settled entry: either no ingress is
  # bound, or it is fully resolved.
  until: >-
    {{ (((fleet_site_edge_clusters_raw.stdout | default('{}', true) | from_yaml).clusters | default({})).get(fleet_site_ocm_cluster, {}).get('ingress_id', '') | length == 0)
       or ((((fleet_site_edge_clusters_raw.stdout | default('{}', true) | from_yaml).clusters | default({})).get(fleet_site_ocm_cluster, {}).get('method', '') | length > 0)
           and (((fleet_site_edge_clusters_raw.stdout | default('{}', true) | from_yaml).clusters | default({})).get(fleet_site_ocm_cluster, {}).get('dns_zone', '') | length > 0)) }}
  retries: 30
  delay: 10
  changed_when: false

- name: Fleet site | Parse this cluster's edge registry entry
  ansible.builtin.set_fact:
    fleet_site_edge_entry: >-
      {{ ((fleet_site_edge_clusters_raw.stdout | default('{}', true) | from_yaml).clusters | default({})).get(fleet_site_ocm_cluster, {}) }}

- name: Fleet site | Parse cluster ingress method for phase6 ACME
  ansible.builtin.set_fact:
    fleet_site_spoke_ingress_method: "{{ fleet_site_edge_entry.method | default('') }}"
    # The site zone this spoke serves. The spoke's CoreDNS answers it with the
    # in-cluster ingress, so a pod calling a public hostname of this site stays
    # inside the cluster instead of hitting the site router's NAT loopback.
    fleet_site_spoke_ingress_zone: "{{ fleet_site_edge_entry.dns_zone | default('') }}"
    # port_forward ACME: TLS-ALPN (HTTP-01 WAN 404 with websecure-only Ingress).
    fleet_site_spoke_acme_http_challenge: false

- name: Fleet site | Require the site zone when an ingress is bound
  ansible.builtin.assert:
    that:
      - fleet_site_spoke_ingress_method | length > 0
      - fleet_site_spoke_ingress_zone | length > 0
    fail_msg: >-
      Cluster {{ fleet_site_ocm_cluster }} is bound to ingress
      {{ fleet_site_edge_entry.ingress_id }} but the edge cluster registry has no
      method/dns_zone; rendering now would drop the spoke's in-cluster name
      override.
  when: fleet_site_edge_entry.ingress_id | default('') | length > 0

- name: Fleet site | Render spoke ingress ManifestWork
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/spoke_ingress/templates/manifestwork-ingress.yaml.j2"
    dest: "/tmp/manifestwork-phase6-{{ fleet_site_ocm_cluster }}.yaml"
    mode: "0600"
  vars:
    ocm_target_cluster: "{{ fleet_site_ocm_cluster }}"
    spoke_ingress_http_nodeport: "{{ fleet_site_spoke_http_port }}"
    spoke_ingress_https_nodeport: "{{ fleet_site_spoke_https_port }}"
    fleet_edge_direct_ingress: "{{ fleet_site_spoke_direct_ingress }}"
    fleet_site_spoke_ingress_method: "{{ fleet_site_spoke_ingress_method }}"
    spoke_ingress_site_zone: "{{ fleet_site_spoke_ingress_zone }}"
    phase6_spoke_acme_http_challenge: "{{ fleet_site_spoke_acme_http_challenge }}"

- name: Fleet site | Apply spoke ingress ManifestWork on hub
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --server-side
      - --force-conflicts
      - -f
      - /tmp/manifestwork-phase6-{{ fleet_site_ocm_cluster }}.yaml
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: fleet_site_spoke_ingress_apply
  changed_when: >-
    'created' in fleet_site_spoke_ingress_apply.stdout or 'configured' in fleet_site_spoke_ingress_apply.stdout

- name: Fleet site | Wait for spoke ingress ManifestWork Available
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ fleet_site_ocm_cluster }}"
      - get
      - manifestwork
      - "{{ phase6_manifestwork_name }}"
      - -o
      - 'jsonpath={.status.conditions[?(@.type=="Available")].status}'
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: fleet_site_spoke_ingress_mw
  until: fleet_site_spoke_ingress_mw.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

# Do not rollout restart Traefik here: HTTP-01 ACME validates on public :80 while the pod
# is still starting and Let's Encrypt sees connection refused. OCM applies deployment
# updates when the ManifestWork spec changes; wait for that rollout only.
- name: Fleet site | Wait for Traefik deployment after ManifestWork change
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ phase6_spoke_ingress_namespace }}"
      - rollout
      - status
      - deployment/traefik
      - --timeout=300s
  environment:
    KUBECONFIG: "{{ hostvars[fleet_site_bootstrap_host].k3s_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
    PATH: "{{ k3s_command_path }}"
  delegate_to: "{{ fleet_site_bootstrap_host }}"
  become: true
  when: fleet_site_spoke_ingress_apply.changed | default(false) | bool
  changed_when: false

- name: Fleet site | Probe spoke Traefik /ping via overlay
  ansible.builtin.command:
    cmd: >-
      curl -sf --connect-timeout 5 -o /dev/null -w "%{http_code}"
      http://{{ fleet_site_spoke_endpoint }}:{{ fleet_site_spoke_http_port }}/ping
  register: fleet_site_spoke_ping
  until: fleet_site_spoke_ping.stdout | trim == '200'
  retries: 30
  delay: 10
  changed_when: false

- name: Fleet site | Probe spoke Traefik /ping locally on cluster node (best-effort)
  ansible.builtin.command:
    cmd: >-
      curl -sf -o /dev/null -w "%{http_code}"
      http://127.0.0.1:{{ fleet_site_spoke_http_port }}/ping
  delegate_to: "{{ fleet_site_bootstrap_host }}"
  become: true
  register: fleet_site_spoke_ping_local
  until: fleet_site_spoke_ping_local.stdout | trim == '200'
  retries: 5
  delay: 5
  changed_when: false
  failed_when: false
  when: fleet_site_spoke_ping.stdout | trim != '200'
