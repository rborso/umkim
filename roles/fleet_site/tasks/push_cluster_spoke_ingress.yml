---
# Push phase6-spoke-ingress ManifestWork for a console-provisioned cluster (hub kubectl).
- name: Fleet site | Resolve OCM cluster name for spoke ingress
  ansible.builtin.set_fact:
    fleet_site_ocm_cluster: "{{ fleet_cluster_name | default(fleet_site_name) }}"

- name: Fleet site | Resolve spoke ingress vars from site_bootstrap inventory
  ansible.builtin.set_fact:
    fleet_site_bootstrap_host: "{{ groups['site_bootstrap'][0] }}"
    fleet_site_spoke_direct_ingress: >-
      {{ hostvars[groups['site_bootstrap'][0]].fleet_cluster_spoke_direct_ingress
         | default(false) | bool }}
    fleet_site_spoke_http_port: >-
      {{ hostvars[groups['site_bootstrap'][0]].fleet_cluster_traefik_http_port
         | default(phase6_http_nodeport) }}
    fleet_site_spoke_https_port: >-
      {{ hostvars[groups['site_bootstrap'][0]].fleet_cluster_traefik_https_port
         | default(phase6_https_nodeport) }}
    fleet_site_spoke_endpoint: >-
      {{ hostvars[groups['site_bootstrap'][0]].fleet_site_sp_endpoint
         | default(hostvars[groups['site_bootstrap'][0]].ansible_host) }}
    fleet_site_spoke_acme_http_challenge: >-
      {{ hostvars[groups['site_bootstrap'][0]].fleet_cluster_exposure_mode
         | default('') == 'port_forward' }}

- name: Fleet site | Render spoke ingress ManifestWork
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/spoke_ingress/templates/manifestwork-ingress.yaml.j2"
    dest: "/tmp/manifestwork-phase6-{{ fleet_site_ocm_cluster }}.yaml"
    mode: "0600"
  vars:
    ocm_target_cluster: "{{ fleet_site_ocm_cluster }}"
    spoke_ingress_http_nodeport: "{{ fleet_site_spoke_http_port }}"
    spoke_ingress_https_nodeport: "{{ fleet_site_spoke_https_port }}"
    fleet_edge_direct_ingress: "{{ fleet_site_spoke_direct_ingress }}"
    phase6_spoke_acme_http_challenge: "{{ fleet_site_spoke_acme_http_challenge }}"

- name: Fleet site | Apply spoke ingress ManifestWork on hub
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/manifestwork-phase6-{{ fleet_site_ocm_cluster }}.yaml
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: fleet_site_spoke_ingress_apply
  changed_when: >-
    'created' in fleet_site_spoke_ingress_apply.stdout or 'configured' in fleet_site_spoke_ingress_apply.stdout

- name: Fleet site | Wait for spoke ingress ManifestWork Available
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ fleet_site_ocm_cluster }}"
      - get
      - manifestwork
      - "{{ phase6_manifestwork_name }}"
      - -o
      - 'jsonpath={.status.conditions[?(@.type=="Available")].status}'
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: fleet_site_spoke_ingress_mw
  until: fleet_site_spoke_ingress_mw.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

- name: Fleet site | Restart Traefik deployment after ManifestWork sync
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ phase6_spoke_ingress_namespace }}"
      - rollout
      - restart
      - deployment/traefik
  environment:
    KUBECONFIG: "{{ hostvars[fleet_site_bootstrap_host].k3s_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
    PATH: "{{ k3s_command_path }}"
  delegate_to: "{{ fleet_site_bootstrap_host }}"
  become: true
  register: fleet_site_traefik_restart
  failed_when: false
  changed_when: fleet_site_traefik_restart.rc == 0

- name: Fleet site | Wait for Traefik deployment on spoke
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ phase6_spoke_ingress_namespace }}"
      - rollout
      - status
      - deployment/traefik
      - --timeout=300s
  environment:
    KUBECONFIG: "{{ hostvars[fleet_site_bootstrap_host].k3s_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
    PATH: "{{ k3s_command_path }}"
  delegate_to: "{{ fleet_site_bootstrap_host }}"
  become: true
  changed_when: false

- name: Fleet site | Probe spoke Traefik /ping locally on cluster node
  ansible.builtin.command:
    cmd: >-
      curl -sf -o /dev/null -w "%{http_code}"
      http://127.0.0.1:{{ fleet_site_spoke_http_port }}/ping
  delegate_to: "{{ fleet_site_bootstrap_host }}"
  become: true
  register: fleet_site_spoke_ping_local
  until: fleet_site_spoke_ping_local.stdout | trim == '200'
  retries: 30
  delay: 10
  changed_when: false

- name: Fleet site | Probe spoke Traefik /ping via overlay
  ansible.builtin.command:
    cmd: >-
      curl -sf --connect-timeout 5 -o /dev/null -w "%{http_code}"
      http://{{ fleet_site_spoke_endpoint }}:{{ fleet_site_spoke_http_port }}/ping
  register: fleet_site_spoke_ping
  until: fleet_site_spoke_ping.stdout | trim == '200'
  retries: 30
  delay: 10
  changed_when: false
