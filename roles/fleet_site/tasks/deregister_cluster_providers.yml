---
# Unregister DCM service providers and site policies before ManifestWork teardown.
# Ansible set_fact: never reference a key from the same task in another key on that task.
- name: Fleet cluster delete | Resolve OCM cluster name
  ansible.builtin.set_fact:
    fleet_site_ocm_cluster: "{{ fleet_cluster_name | default(fleet_site_ocm_name | default(fleet_site_name)) }}"
  tags: [fleet_cluster_delete]

- name: Fleet cluster delete | Resolve provider SPM names
  ansible.builtin.set_fact:
    fleet_site_k8s_sp_name: "{{ fleet_site_dcm_k8s_sp_name | default('k8s-' ~ fleet_site_ocm_cluster) }}"
    fleet_site_helm_sp_name: "{{ fleet_site_dcm_helm_sp_name | default('helm-' ~ fleet_site_ocm_cluster) }}"
    fleet_site_olm_sp_name: "{{ fleet_site_dcm_olm_sp_name | default('olm-' ~ fleet_site_ocm_cluster) }}"
  tags: [fleet_cluster_delete]

- name: Fleet cluster delete | Resolve container provider API URL
  ansible.builtin.set_fact:
    fleet_site_container_api_url: "{{ fleet_site_container_api_url | default(fleet_site_dcm_api_url) }}"
  tags: [fleet_cluster_delete]

- name: Fleet cluster delete | Resolve helm provider API URL
  ansible.builtin.set_fact:
    fleet_site_helm_api_url: "{{ fleet_site_helm_api_url | default(fleet_site_container_api_url) }}"
  tags: [fleet_cluster_delete]

- name: Fleet cluster delete | Unregister k8s provider from SPM
  ansible.builtin.import_tasks: unregister_dcm_provider.yml
  vars:
    fleet_site_unregister_provider_name: "{{ fleet_site_k8s_sp_name }}"
    fleet_site_unregister_provider_api_url: "{{ fleet_site_container_api_url }}"
  tags: [fleet_cluster_delete]

- name: Fleet cluster delete | Unregister helm provider from SPM
  ansible.builtin.import_tasks: unregister_dcm_provider.yml
  vars:
    fleet_site_unregister_provider_name: "{{ fleet_site_helm_sp_name }}"
    fleet_site_unregister_provider_api_url: "{{ fleet_site_helm_api_url }}"
  tags: [fleet_cluster_delete]

- name: Fleet cluster delete | Unregister olm provider from SPM
  ansible.builtin.import_tasks: unregister_dcm_provider.yml
  vars:
    fleet_site_unregister_provider_name: "{{ fleet_site_olm_sp_name }}"
    fleet_site_unregister_provider_api_url: "{{ fleet_site_container_api_url }}"
  when: fleet_site_deploy_olm_sp | default(true) | bool
  tags: [fleet_cluster_delete]

- name: Fleet cluster delete | Remove site-container policy
  ansible.builtin.uri:
    url: "{{ fleet_site_container_api_url }}/policies/site-container-{{ fleet_site_ocm_cluster }}"
    method: DELETE
    status_code: [200, 204, 404]
  tags: [fleet_cluster_delete]

- name: Fleet cluster delete | Remove site-helm policy
  ansible.builtin.uri:
    url: "{{ fleet_site_helm_api_url }}/policies/site-helm-{{ fleet_site_ocm_cluster }}"
    method: DELETE
    status_code: [200, 204, 404]
  tags: [fleet_cluster_delete]
