---
- name: Fleet site | Resolve k8s provider cluster
  ansible.builtin.set_fact:
    fleet_site_ocm_cluster: "{{ fleet_site_ocm_name | default(fleet_site_name) }}"
    fleet_site_sp_endpoint: "{{ fleet_site_sp_endpoint | default((fleet_site_wg_ip | regex_replace('/.*$', ''))) }}"
    fleet_site_k8s_sp_name: "{{ fleet_site_dcm_k8s_sp_name | default('k8s-' ~ (fleet_site_ocm_name | default(fleet_site_name))) }}"
  tags: [fleet_site, fleet_site_provider, phase5]

- name: Fleet site | Register synthetic host for k8s SP ManifestWork
  ansible.builtin.add_host:
    name: "{{ fleet_site_ocm_cluster }}"
    dcm_k8s_sp_nodeport: "{{ fleet_site_dcm_k8s_sp_nodeport }}"
    dcm_k8s_sp_name: "{{ fleet_site_k8s_sp_name }}"
    dcm_k8s_sp_endpoint_host: "{{ fleet_site_sp_endpoint }}"
    fleet_site: "{{ fleet_site_id | default(fleet_site_name) }}"
  tags: [fleet_site, fleet_site_provider, phase5]

- name: Fleet site | Push k8s-container SP ManifestWork
  ansible.builtin.import_role:
    name: dcm
    tasks_from: push_spokes.yml
  vars:
    ocm_manifestwork_clusters: ["{{ fleet_site_ocm_cluster }}"]
  tags: [fleet_site, fleet_site_provider, phase5]

- name: Fleet site | Wait for k8s-container SP ManifestWork Applied
  ansible.builtin.import_role:
    name: dcm
    tasks_from: verify.yml
  vars:
    ocm_manifestwork_clusters: ["{{ fleet_site_ocm_cluster }}"]
  tags: [fleet_site, fleet_site_provider, phase5]

- name: Fleet site | Wait for k8s provider registration
  ansible.builtin.import_tasks: wait_dcm_provider.yml
  vars:
    fleet_site_wait_provider_name: "{{ fleet_site_k8s_sp_name }}"
  tags: [fleet_site, fleet_site_provider, phase5]

- name: Fleet site | Seed container routing policy
  ansible.builtin.import_tasks: seed_container_policy.yml
  tags: [fleet_site, fleet_site_provider, phase5]
