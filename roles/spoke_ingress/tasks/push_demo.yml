---
- name: Tier1 demo | Push demo ManifestWork to each spoke
  ansible.builtin.template:
    src: manifestwork-demo.yaml.j2
    dest: "/tmp/manifestwork-phase6-demo-{{ item }}.yaml"
    mode: "0600"
  loop: "{{ groups['spokes'] }}"
  vars:
    ocm_target_cluster: "{{ item }}"
    spoke_demo_message: "Fleet spoke ingress demo OK on {{ item }} (Host demo.{{ item }}.{{ domain }})"
  tags: [spoke_ingress, phase6, phase6_demo]

- name: Tier1 demo | Apply demo ManifestWork on hub
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/manifestwork-phase6-demo-{{ item }}.yaml
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  loop: "{{ groups['spokes'] }}"
  register: spoke_demo_mw_apply
  changed_when: "'created' in spoke_demo_mw_apply.stdout or 'configured' in spoke_demo_mw_apply.stdout"
  tags: [spoke_ingress, phase6, phase6_demo]
