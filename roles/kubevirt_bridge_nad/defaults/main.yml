---
# defaults for roles/kubevirt_bridge_nad
kubevirt_bridge_nad_name: mgmt-l2
kubevirt_bridge_nad_namespace: default
kubevirt_bridge_host_bridge: mgmt-l2-br
# Management IPv4 used to detect an adopted bridge interface (inventory ansible_host).
kubevirt_bridge_mgmt_ip: "{{ fleet_node_mgmt_address | default(ansible_host) }}"
kubevirt_bridge_cni_bin_dir: /opt/cni/bin
ocm_kubeconfig: /etc/rancher/k3s/k3s.yaml
k3s_command_path: /usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
