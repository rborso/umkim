---
# Relay hub fleet API + K3s API from virt01 mgmt LAN to hub WireGuard IP (lab VPS hub).
- name: Virt01 hub relay | Require relay target
  ansible.builtin.assert:
    that:
      - virt01_hub_relay_lan_ip | length > 0
      - fleet_hub_wireguard_ip | length > 0
    fail_msg: Set virt01_hub_relay_lan_ip and fleet_hub_wireguard_ip
  tags: [virt01_hub_relay_dnat, virt01_hypervisor]

- name: Virt01 hub relay | Enable IPv4 forwarding
  ansible.builtin.command:
    cmd: sysctl -w net.ipv4.ip_forward=1
  changed_when: false
  tags: [virt01_hub_relay_dnat, virt01_hypervisor]

- name: Virt01 hub relay | DNAT fleet enrollment + hub K3s API
  ansible.builtin.shell: |
    set -euo pipefail
    LAN="{{ virt01_hub_relay_lan_ip }}"
    HUB="{{ fleet_hub_wireguard_ip }}"
    ENROLL="{{ phase5_gateway_nodeport | default(30908) }}"
    API="{{ virt01_hub_relay_k3s_port | default(6443) }}"
    HARBOR="{{ harbor_nodeport_https | default(30443) }}"
    for pair in "${ENROLL}:${ENROLL}" "${API}:${API}" "${HARBOR}:${HARBOR}"; do
      dport="${pair%%:*}"
      toport="${pair##*:}"
      iptables -t nat -C PREROUTING -d "${LAN}/32" -p tcp --dport "${dport}" -j DNAT --to-destination "${HUB}:${toport}" 2>/dev/null \
        || iptables -t nat -A PREROUTING -d "${LAN}/32" -p tcp --dport "${dport}" -j DNAT --to-destination "${HUB}:${toport}"
      iptables -t nat -C OUTPUT -d "${LAN}/32" -p tcp --dport "${dport}" -j DNAT --to-destination "${HUB}:${toport}" 2>/dev/null \
        || iptables -t nat -A OUTPUT -d "${LAN}/32" -p tcp --dport "${dport}" -j DNAT --to-destination "${HUB}:${toport}"
    done
    iptables -t nat -C POSTROUTING -d "${HUB}/32" -j MASQUERADE 2>/dev/null \
      || iptables -t nat -A POSTROUTING -d "${HUB}/32" -j MASQUERADE
  args:
    executable: /bin/bash
  tags: [virt01_hub_relay_dnat, virt01_hypervisor]
