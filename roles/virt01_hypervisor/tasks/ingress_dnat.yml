---
# Forward homelab bridge Traefik NodePorts to the VM cluster init node (mgmt LAN).
- name: Virt01 ingress DNAT | Require target vars
  ansible.builtin.assert:
    that:
      - virt01_ingress_dnat_homelab_ip | length > 0
      - virt01_ingress_dnat_target_ip | length > 0
    fail_msg: Set virt01_ingress_dnat_homelab_ip and virt01_ingress_dnat_target_ip
  tags: [virt01_ingress_dnat, virt01_hypervisor]

- name: Virt01 ingress DNAT | Enable IPv4 forwarding
  ansible.builtin.command:
    cmd: sysctl -w net.ipv4.ip_forward=1
  changed_when: false
  tags: [virt01_ingress_dnat, virt01_hypervisor]

- name: Virt01 ingress DNAT | Install Traefik port forwards
  ansible.builtin.shell: |
    set -euo pipefail
    HOMELAB="{{ virt01_ingress_dnat_homelab_ip }}"
    TARGET="{{ virt01_ingress_dnat_target_ip }}"
    HTTP="{{ virt01_ingress_dnat_http_port | default(30080) }}"
    HTTPS="{{ virt01_ingress_dnat_https_port | default(30443) }}"
    iptables -t nat -C PREROUTING -d "${HOMELAB}/32" -p tcp --dport "${HTTP}" -j DNAT --to-destination "${TARGET}:${HTTP}" 2>/dev/null \
      || iptables -t nat -A PREROUTING -d "${HOMELAB}/32" -p tcp --dport "${HTTP}" -j DNAT --to-destination "${TARGET}:${HTTP}"
    iptables -t nat -C PREROUTING -d "${HOMELAB}/32" -p tcp --dport "${HTTPS}" -j DNAT --to-destination "${TARGET}:${HTTPS}" 2>/dev/null \
      || iptables -t nat -A PREROUTING -d "${HOMELAB}/32" -p tcp --dport "${HTTPS}" -j DNAT --to-destination "${TARGET}:${HTTPS}"
    iptables -t nat -C OUTPUT -d "${HOMELAB}/32" -p tcp --dport "${HTTP}" -j DNAT --to-destination "${TARGET}:${HTTP}" 2>/dev/null \
      || iptables -t nat -A OUTPUT -d "${HOMELAB}/32" -p tcp --dport "${HTTP}" -j DNAT --to-destination "${TARGET}:${HTTP}"
    iptables -t nat -C OUTPUT -d "${HOMELAB}/32" -p tcp --dport "${HTTPS}" -j DNAT --to-destination "${TARGET}:${HTTPS}" 2>/dev/null \
      || iptables -t nat -A OUTPUT -d "${HOMELAB}/32" -p tcp --dport "${HTTPS}" -j DNAT --to-destination "${TARGET}:${HTTPS}"
  args:
    executable: /bin/bash
  tags: [virt01_ingress_dnat, virt01_hypervisor]
