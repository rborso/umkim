---
- name: Fleet edge | Set Traefik fragment facts
  ansible.builtin.set_fact:
    fleet_edge_routers_fragment: "{{ lookup('ansible.builtin.template', 'fleet-edge-routers.yml.j2') }}{{ lookup('ansible.builtin.template', 'fleet-edge-auth-portal-routers.yml.j2') }}"
    fleet_edge_middlewares_fragment: "{{ lookup('ansible.builtin.template', 'fleet-edge-middlewares.yml.j2') }}"
    fleet_edge_services_fragment: "{{ lookup('ansible.builtin.template', 'fleet-edge-services.yml.j2') }}{{ lookup('ansible.builtin.template', 'fleet-edge-auth-portal-services.yml.j2') }}"
  run_once: true
  when: fleet_edge_enable | default(false) | bool
  tags: [fleet_edge, fleet_edge_render]

- name: Fleet edge | Clear Traefik fragments when disabled
  ansible.builtin.set_fact:
    fleet_edge_routers_fragment: ""
    fleet_edge_middlewares_fragment: ""
    fleet_edge_services_fragment: ""
  run_once: true
  when: not (fleet_edge_enable | default(false) | bool)
  tags: [fleet_edge, fleet_edge_render]
