---
- name: WireGuard | Check interface is present
  ansible.builtin.command:
    cmd: "wg show {{ wireguard_interface }}"
  register: wireguard_show
  changed_when: false
  failed_when: wireguard_show.rc != 0
  tags: [wireguard, wireguard_verify]

- name: WireGuard | Spokes ping hub on overlay
  ansible.builtin.command:
    cmd: >-
      ping -c 3 -W 2
      {{ hostvars[wireguard_hub_host]['wireguard_address'] | ansible.utils.ipaddr('address') }}
  register: wireguard_ping_hub
  changed_when: false
  failed_when: wireguard_ping_hub.rc != 0
  when: wireguard_role == 'client'
  tags: [wireguard, wireguard_verify]

- name: WireGuard | Hub ping each spoke on overlay
  ansible.builtin.command:
    cmd: >-
      ping -c 3 -W 2
      {{ hostvars[item]['wireguard_address'] | ansible.utils.ipaddr('address') }}
  loop: "{{ wireguard_peers }}"
  register: wireguard_ping_spoke
  changed_when: false
  failed_when: wireguard_ping_spoke.rc != 0
  when:
    - wireguard_role == 'server'
    - wireguard_peers | length > 0
  tags: [wireguard, wireguard_verify]

- name: WireGuard | Hub show peer handshakes
  ansible.builtin.command:
    cmd: wg show {{ wireguard_interface }} latest-handshakes
  register: wireguard_handshakes
  changed_when: false
  when: wireguard_role == 'server'
  tags: [wireguard, wireguard_verify]

- name: WireGuard | Report hub peer handshakes
  ansible.builtin.debug:
    msg: "{{ wireguard_handshakes.stdout_lines }}"
  when:
    - wireguard_role == 'server'
    - wireguard_handshakes is defined
  tags: [wireguard, wireguard_verify]
