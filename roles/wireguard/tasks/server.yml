---
- name: WireGuard | Validate spoke public keys are available
  ansible.builtin.assert:
    that:
      - hostvars[item]['wireguard_public_key'] is defined
      - hostvars[item]['wireguard_public_key'] | length > 0
      - hostvars[item]['wireguard_address'] is defined
    fail_msg: >-
      Missing wireguard_public_key or wireguard_address for {{ item }}.
      Run wireguard_install on all fleet_nodes before wireguard_server.
  loop: "{{ wireguard_peers }}"
  when: wireguard_peers | length > 0
  tags: [wireguard, wireguard_server]

- name: WireGuard | Deploy hub server configuration
  ansible.builtin.template:
    src: wg0-server.conf.j2
    dest: "{{ wireguard_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard interface
  tags: [wireguard, wireguard_server]

- name: WireGuard | Install hub WireGuard peer restore script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/restore-hub-wg-peers.sh"
    dest: /usr/local/bin/umkim-restore-hub-wg-peers.sh
    owner: root
    group: root
    mode: "0755"
  tags: [wireguard, wireguard_server]

- name: WireGuard | Install hub WireGuard peer restore systemd unit
  ansible.builtin.template:
    src: umkim-restore-hub-wg-peers.service.j2
    dest: /etc/systemd/system/umkim-restore-hub-wg-peers.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and enable hub wg peer restore
  tags: [wireguard, wireguard_server]

- name: WireGuard | Enable and start wg-quick service
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
    daemon_reload: true
  tags: [wireguard, wireguard_server]
