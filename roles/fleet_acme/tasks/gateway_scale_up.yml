---
- name: Fleet ACME | Wait for in-flight ACME HTTP-01 challenges
  ansible.builtin.pause:
    seconds: "{{ fleet_acme_cert_obtain_wait_sec | default(90) | int }}"
  when: fleet_acme_gateway_replicas_before | default(1) | int > 1

- name: Fleet ACME | Restore gateway replica count
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ phase5_dcm_namespace }} scale deployment/gateway
      --replicas={{ fleet_acme_gateway_replicas_before }}
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  changed_when: true
  when: fleet_acme_gateway_replicas_before | default(1) | int > 1

- name: Fleet ACME | Restore gateway HA networking
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ phase5_dcm_namespace }} patch deployment gateway --type=json
      -p='[{"op":"replace","path":"/spec/strategy","value":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":{{ dcm_gateway_rolling_max_surge | default(1) }},"maxUnavailable":{{ dcm_gateway_rolling_max_unavailable | default(0) }}}}},{"op":"replace","path":"/spec/template/spec/hostNetwork","value":false},{"op":"replace","path":"/spec/template/spec/dnsPolicy","value":"ClusterFirst"}]'
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  changed_when: true
  when: fleet_acme_gateway_replicas_before | default(1) | int > 1

- name: Fleet ACME | Wait for gateway HA rollout
  ansible.builtin.command:
    cmd: kubectl -n {{ phase5_dcm_namespace }} rollout status deployment/gateway --timeout=300s
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  changed_when: false
  when: fleet_acme_gateway_replicas_before | default(1) | int > 1
