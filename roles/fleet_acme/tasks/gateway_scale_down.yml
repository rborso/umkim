---
- name: Fleet ACME | Remember gateway replica count
  ansible.builtin.set_fact:
    fleet_acme_gateway_replicas_before: "{{ dcm_gateway_replicas | default(1) | int }}"
  when: (dcm_gateway_replicas | default(1) | int) > 1

- name: Fleet ACME | Scale gateway to 1 for TLS-ALPN challenges
  ansible.builtin.command:
    cmd: kubectl -n {{ phase5_dcm_namespace }} scale deployment/gateway --replicas=1
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: fleet_acme_gateway_scale_down
  changed_when: >-
    'scaled' in (fleet_acme_gateway_scale_down.stdout | default(''))
    or fleet_acme_gateway_scale_down.rc == 0
  when: fleet_acme_gateway_replicas_before | default(1) | int > 1

- name: Fleet ACME | Enable hostNetwork on gateway for TLS-ALPN
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ phase5_dcm_namespace }} patch deployment gateway --type=json
      -p='[{"op":"replace","path":"/spec/strategy","value":{"type":"Recreate"}},{"op":"add","path":"/spec/template/spec/hostNetwork","value":true},{"op":"add","path":"/spec/template/spec/dnsPolicy","value":"ClusterFirstWithHostNet"}]'
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: fleet_acme_gateway_hostnet
  changed_when: fleet_acme_gateway_hostnet.rc == 0
  when: fleet_acme_gateway_replicas_before | default(1) | int > 1

- name: Fleet ACME | Wait for single gateway pod
  ansible.builtin.command:
    cmd: kubectl -n {{ phase5_dcm_namespace }} rollout status deployment/gateway --timeout=300s
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  changed_when: false
  when: fleet_acme_gateway_replicas_before | default(1) | int > 1
