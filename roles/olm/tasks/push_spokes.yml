---
- name: OLM | Push platform bootstrap ManifestWork to each spoke
  ansible.builtin.template:
    src: manifestwork-bootstrap.yaml.j2
    dest: "/tmp/manifestwork-phase4-{{ item }}.yaml"
    mode: "0600"
  loop: "{{ ocm_manifestwork_clusters | default(groups['spokes']) }}"
  vars:
    ocm_target_cluster: "{{ hostvars[item].ocm_cluster_name | default(item) }}"
  tags: [olm, phase4, phase4_push]

- name: OLM | Apply ManifestWork on hub
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/manifestwork-phase4-{{ item }}.yaml
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  loop: "{{ ocm_manifestwork_clusters | default(groups['spokes']) }}"
  register: olm_mw_apply
  changed_when: "'created' in olm_mw_apply.stdout or 'configured' in olm_mw_apply.stdout"
  tags: [olm, phase4, phase4_push]
