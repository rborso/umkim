---
- name: Fleet OLM SP | Push ManifestWork to each cluster
  ansible.builtin.template:
    src: manifestwork-olm-sp.yaml.j2
    dest: "/tmp/manifestwork-olm-sp-{{ item }}.yaml"
    mode: "0600"
  loop: "{{ ocm_olm_sp_clusters | default(groups['spokes']) }}"
  vars:
    ocm_target_cluster: "{{ item }}"
    dcm_olm_sp_nodeport: "{{ hostvars[item].dcm_olm_sp_nodeport | default(30192) }}"
    dcm_olm_sp_name: "{{ hostvars[item].dcm_olm_sp_name | default('olm-' ~ item) }}"
    dcm_olm_sp_endpoint_host: >-
      {{ hostvars[item].dcm_olm_sp_endpoint_host
         | default(hostvars[item].wireguard_address | ansible.utils.ipaddr('address'), true)
         | default(hostvars[item].ansible_host, true) }}
    dcm_olm_sp_image: "{{ hostvars[item].dcm_olm_sp_image | default(phase5_olm_sp_image) }}"
  tags: [fleet_olm_sp, phase5_olm_sp, phase5_push]

- name: Fleet OLM SP | Apply ManifestWork on hub
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/manifestwork-olm-sp-{{ item }}.yaml
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  loop: "{{ ocm_olm_sp_clusters | default(groups['spokes']) }}"
  register: fleet_olm_sp_mw_apply
  changed_when: "'created' in fleet_olm_sp_mw_apply.stdout or 'configured' in fleet_olm_sp_mw_apply.stdout"
  tags: [fleet_olm_sp, phase5_olm_sp, phase5_push]
