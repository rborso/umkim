---
- name: Fleet LLM | Hub apply or teardown
  when: fleet_llm_hub_enabled | default(false) | bool
  block:
    - name: Fleet LLM | Ensure namespace
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl create namespace "{{ fleet_llm_namespace }}" --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true

    - name: Fleet LLM | Ensure master key secret
      ansible.builtin.shell: |
        set -euo pipefail
        NS="{{ fleet_llm_namespace }}"
        SEC="{{ fleet_llm_master_key_secret }}"
        if ! kubectl -n "$NS" get secret "$SEC" >/dev/null 2>&1; then
          KEY="{{ fleet_llm_master_key | default(lookup('password', '/dev/null length=32 chars=ascii_letters,digits')) }}"
          kubectl -n "$NS" create secret generic "$SEC" \
            --from-literal=master_key="$KEY"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true

    - name: Fleet LLM | Render Redis manifest
      ansible.builtin.template:
        src: redis.yaml.j2
        dest: /tmp/fleet-llm-redis.yaml
        mode: "0644"

    - name: Fleet LLM | Apply Redis for LiteLLM router cache
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/fleet-llm-redis.yaml
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true

    - name: Fleet LLM | Render LiteLLM config
      ansible.builtin.template:
        src: litellm-config.yaml.j2
        dest: /tmp/litellm-config.yaml
        mode: "0644"

    - name: Fleet LLM | Apply config ConfigMap
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl -n {{ fleet_llm_namespace }} create configmap {{ fleet_llm_configmap }} \
          --from-file=config.yaml=/tmp/litellm-config.yaml \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true

    - name: Fleet LLM | Render deployment manifest
      ansible.builtin.template:
        src: litellm-deployment.yaml.j2
        dest: /tmp/litellm-deployment.yaml
        mode: "0644"

    - name: Fleet LLM | Apply LiteLLM workload
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/litellm-deployment.yaml
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true

    - name: Fleet LLM | Render Traefik LLM routes
      ansible.builtin.template:
        src: traefik-llm-routes.yaml.j2
        dest: /tmp/traefik-llm-routes.yaml
        mode: "0644"

    - name: Fleet LLM | Apply Traefik route fragment on hub ingress
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl -n {{ hub_ingress_namespace | default('fleet-ingress') }} create configmap {{ fleet_llm_traefik_fragment_cm }} \
          --from-file={{ fleet_llm_traefik_dynamic_file }}=/tmp/traefik-llm-routes.yaml \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true

    - name: Fleet LLM | Ensure hub gateway projects LLM routes into Traefik dynamic dir
      ansible.builtin.shell: |
        set -euo pipefail
        NS="{{ hub_ingress_namespace | default('fleet-ingress') }}"
        DEPLOY="{{ hub_ingress_gateway_name | default('gateway') }}"
        CM="{{ fleet_llm_traefik_fragment_cm }}"
        FILE="{{ fleet_llm_traefik_dynamic_file }}"
        if ! kubectl -n "$NS" get deploy "$DEPLOY" >/dev/null 2>&1; then
          echo "hub gateway deployment not found; skipping traefik LLM route mount"
          exit 0
        fi
        kubectl -n "$NS" get deploy "$DEPLOY" -o json | python3 -c "
        import json, sys
        d = json.load(sys.stdin)
        spec = d['spec']['template']['spec']
        # Drop legacy standalone LLM volume mounts.
        spec['volumes'] = [v for v in spec.get('volumes', []) if v.get('name') != 'traefik-llm-routes']
        ctr = spec['containers'][0]
        ctr['volumeMounts'] = [m for m in ctr.get('volumeMounts', []) if m.get('name') != 'traefik-llm-routes']
        vol = next((v for v in spec['volumes'] if v.get('name') == 'traefik-dynamic'), None)
        if not vol or 'projected' not in vol:
          raise SystemExit('traefik-dynamic projected volume missing on gateway')
        sources = vol['projected'].get('sources', [])
        sources = [s for s in sources if s.get('configMap', {}).get('name') != '${CM}']
        sources.append({
          'configMap': {
            'name': '${CM}',
            'items': [{'key': '${FILE}', 'path': '${FILE}'}],
          }
        })
        vol['projected']['sources'] = sources
        json.dump(d, sys.stdout)
        " | kubectl apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true

    - name: Fleet LLM | Rollout hub gateway to pick up Traefik LLM routes
      ansible.builtin.command:
        cmd: kubectl -n {{ hub_ingress_namespace | default('fleet-ingress') }} rollout restart deployment/{{ hub_ingress_gateway_name | default('gateway') }}
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true

- name: Fleet LLM | Teardown hub stack
  when: not (fleet_llm_hub_enabled | default(false) | bool)
  block:
    - name: Fleet LLM | Remove LiteLLM deployment
      ansible.builtin.command:
        cmd: kubectl -n {{ fleet_llm_namespace }} delete deploy,svc,cm {{ fleet_llm_release_name }},{{ fleet_llm_release_name }},{{ fleet_llm_configmap }},redis --ignore-not-found
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true

    - name: Fleet LLM | Remove Traefik LLM routes ConfigMap
      ansible.builtin.command:
        cmd: kubectl -n {{ hub_ingress_namespace | default('fleet-ingress') }} delete cm {{ fleet_llm_traefik_fragment_cm }} --ignore-not-found
      environment:
        KUBECONFIG: "{{ ocm_kubeconfig | default('/etc/rancher/k3s/k3s.yaml') }}"
      changed_when: true
