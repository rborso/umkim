---
- name: DCM | List providers from gateway
  ansible.builtin.command:
    cmd: curl -sf http://127.0.0.1:{{ phase5_gateway_nodeport }}/api/v1alpha1/providers
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_spm_providers
  changed_when: false
  failed_when: false
  tags: [dcm, phase6, phase6_verify]

- name: DCM | Registered providers
  ansible.builtin.debug:
    msg: "{{ dcm_spm_providers.stdout | default('(SPM unreachable or empty)') }}"
  tags: [dcm, phase6, phase6_verify]
