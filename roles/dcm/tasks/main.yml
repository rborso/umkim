---
- name: DCM | Warm Harbor cache for DCM images
  ansible.builtin.include_tasks: warm_images.yml
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_warm]

- name: DCM | Ensure namespace exists
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl create namespace {{ phase5_dcm_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  args:
    executable: /bin/bash
  changed_when: false
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Assert hub-only core install
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['hub']
    fail_msg: DCM core installs only on the hub (umkim-hub).
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Apply Traefik ConfigMaps and checksums
  ansible.builtin.import_tasks: traefik_config.yml
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Render control-plane placement RBAC
  ansible.builtin.template:
    src: control-plane-placement-rbac.yaml.j2
    dest: /tmp/dcm-control-plane-rbac.yaml
    mode: "0600"
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Apply control-plane placement RBAC
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/dcm-control-plane-rbac.yaml
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_rbac_apply
  changed_when: >-
    'configured' in (dcm_rbac_apply.stdout | default(''))
    or 'created' in (dcm_rbac_apply.stdout | default(''))
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Reset postgres PVC for monolith schema (one-time)
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n {{ phase5_dcm_namespace }} scale deploy/postgres --replicas=0
    kubectl -n {{ phase5_dcm_namespace }} wait --for=delete pod -l app=dcm-postgres --timeout=120s || true
    kubectl -n {{ phase5_dcm_namespace }} delete pvc dcm-postgres-data --ignore-not-found --wait=true
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  args:
    executable: /bin/bash
  when: fleet_dcm_monolith_reset_db | default(false) | bool
  changed_when: true
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Remove legacy manager deployments if present
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ phase5_dcm_namespace }} delete deploy,svc
      service-provider-manager catalog-manager policy-manager placement-manager
      --ignore-not-found
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_legacy_delete
  changed_when: "'deleted' in (dcm_legacy_delete.stdout | default(''))"
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Prepare gateway ACME hostPath (HA migrate)
  ansible.builtin.import_tasks: gateway_acme_migrate.yml
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Render hub stack manifest
  ansible.builtin.template:
    src: hub-stack.yaml.j2
    dest: /tmp/dcm-hub-stack.yaml
    mode: "0600"
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Apply hub stack
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/dcm-hub-stack.yaml
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_hub_apply
  changed_when: "'created' in dcm_hub_apply.stdout or 'configured' in dcm_hub_apply.stdout"
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Ensure gateway HA pod-network after hub stack apply
  ansible.builtin.import_tasks: gateway_ensure_ha_networking.yml
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Assert gateway HA networking after hub stack apply
  ansible.builtin.import_tasks: gateway_assert_ha_networking.yml
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Record hub stack apply for rollout wait
  ansible.builtin.set_fact:
    dcm_hub_stack_changed: "{{ dcm_hub_apply is changed }}"
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Sync gateway checksums after hub stack apply
  ansible.builtin.import_tasks: traefik_gateway_rollout.yml
  when:
    - dcm_hub_apply is defined
    - dcm_hub_apply is changed
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Wait for hub stack ready
  ansible.builtin.import_tasks: wait_hub_stack.yml
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_wait_ready]

- name: DCM | Show hub pods
  ansible.builtin.command:
    cmd: kubectl -n {{ phase5_dcm_namespace }} get pods -o wide
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_hub_pods
  changed_when: false
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Hub pod status
  ansible.builtin.debug:
    var: dcm_hub_pods.stdout_lines
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM | Seed fleet-console placement policies
  ansible.builtin.import_tasks: seed_fleet_policies.yml
  when: fleet_dcm_fleet_policies_seed | default(false) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_policies]

- name: DCM | Seed policy-driven placement policies
  ansible.builtin.import_tasks: seed_placement_policies.yml
  when: fleet_dcm_placement_policies_seed | default(true) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_placement_policies]

- name: DCM | Seed demo catalog
  ansible.builtin.import_tasks: seed_demo_catalog.yml
  when: fleet_dcm_demo_catalog_seed | default(true) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_demo]

- name: DCM | Seed vm-test catalog and KVM placement policy
  ansible.builtin.import_tasks: seed_vm_catalog.yml
  when: fleet_dcm_vm_test_catalog_seed | default(true) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]

- name: DCM | Seed Rocky 9 bridge VM catalog item
  ansible.builtin.import_tasks: seed_rocky9_vm_catalog.yml
  when: fleet_dcm_rocky9_vm_catalog_seed | default(true) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm, dcm_seed_rocky9_vm]

- name: DCM | Seed operator catalog and routing policies
  ansible.builtin.import_tasks: seed_operator_catalog.yml
  when: fleet_dcm_operator_catalog_seed | default(false) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_operator]

- name: DCM | Seed helm catalog and routing policies
  ansible.builtin.import_tasks: seed_helm_catalog.yml
  when: fleet_dcm_helm_catalog_seed | default(false) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_helm]

- name: DCM | Seed pet-clinic helm catalog item
  ansible.builtin.import_tasks: seed_pet_clinic_helm_catalog.yml
  when: fleet_dcm_pet_clinic_helm_catalog_seed | default(false) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_helm, dcm_seed_pet_clinic_helm]

- name: DCM | Seed llama-cpp-helm catalog item
  ansible.builtin.import_tasks: seed_llama_cpp_helm_catalog.yml
  when: fleet_dcm_llama_cpp_helm_catalog_seed | default(true) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_llama_cpp_helm]
