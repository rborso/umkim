---
# Seed vm-test catalog item + demo-vm-single placement policy (KVM clusters).
- name: DCM vm | API base for seed tasks
  ansible.builtin.set_fact:
    dcm_vm_api_url: "{{ fleet_dcm_seed_api_url | default(phase5_registration_url) }}"
    dcm_vm_catalog_fields:
      - path: metadata.name
        display_name: VM name (DNS label)
        editable: true
        default: "{{ fleet_dcm_vm_test_default_name }}"
        validation_schema:
          type: string
          x-ui-tier: required
          x-ui-widget: dns-label
          x-required: true
      - path: vcpu.count
        display_name: vCPUs
        editable: true
        default: 1
        validation_schema:
          type: integer
          minimum: 1
          maximum: 32
          x-ui-tier: common
          x-ui-widget: number
      - path: memory.size
        display_name: Memory
        editable: true
        default: 512MB
        validation_schema:
          type: string
          pattern: '^[0-9]+(MB|GB|TB)$'
          x-ui-tier: common
      - path: guest_os.type
        display_name: Guest OS image
        editable: true
        default: cirros
        description: "KubeVirt maps cirros, ubuntu, fedora, debian, centos to container disks"
        validation_schema:
          type: string
          enum: [cirros, ubuntu, fedora, debian, centos, centos-stream]
          x-ui-tier: common
      - path: storage.disks
        display_name: Disks
        editable: true
        default:
          - name: boot
            capacity: 1GB
        validation_schema:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, capacity]
            properties:
              name:
                type: string
              capacity:
                type: string
                pattern: '^[0-9]+(MB|GB|TB)$'
          x-ui-tier: advanced
      - path: routing.cluster
        display_name: Target cluster (OCM name)
        editable: true
        default: ""
        description: "Pin to a cluster with kubevirt provider Ready; otherwise policy selects a KVM cluster"
        validation_schema:
          type: string
          x-ui-tier: advanced
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]

- name: DCM vm | Register vm service_type in control-plane catalog API
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n {{ phase5_dcm_namespace }} exec deploy/postgres -- psql -U {{ phase5_db_user }} -d {{ phase5_dcm_app_db }} -v ON_ERROR_STOP=1 -c "
    INSERT INTO service_types (id, api_version, service_type, metadata, spec, path, create_time, update_time)
    VALUES (
      'vm',
      'v1alpha1',
      'vm',
      '{}'::jsonb,
      '{\"vcpu\":{},\"memory\":{},\"storage\":{},\"guest_os\":{},\"access\":{}}'::jsonb,
      'service-types/vm',
      NOW(),
      NOW()
    ) ON CONFLICT (service_type) DO NOTHING;
    "
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  args:
    executable: /bin/bash
  changed_when: true
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]

- name: DCM vm | Ensure vm-test catalog item exists
  ansible.builtin.uri:
    url: "{{ dcm_vm_api_url }}/catalog-items?id={{ fleet_dcm_vm_test_catalog_item_id }}"
    method: POST
    body_format: json
    status_code: [200, 201, 409]
    body:
      api_version: v1alpha1
      display_name: "{{ fleet_dcm_vm_test_catalog_display_name }}"
      description: "{{ fleet_dcm_vm_test_catalog_description }}"
      spec:
        resources:
          - name: app
            service_type: vm
            fields: "{{ dcm_vm_catalog_fields }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]

- name: DCM vm | Patch vm-test catalog item fields
  ansible.builtin.uri:
    url: "{{ dcm_vm_api_url }}/catalog-items/{{ fleet_dcm_vm_test_catalog_item_id }}"
    method: PATCH
    body_format: json
    status_code: [200, 404]
    headers:
      Content-Type: application/merge-patch+json
    body:
      display_name: "{{ fleet_dcm_vm_test_catalog_display_name }}"
      description: "{{ fleet_dcm_vm_test_catalog_description }}"
      spec:
        resources:
          - name: app
            service_type: vm
            fields: "{{ dcm_vm_catalog_fields }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]

- name: DCM vm | Render vm placement accept rego
  ansible.builtin.template:
    src: placement_vm_accept.rego.j2
    dest: /tmp/dcm-placement-vm-kvm.rego
    mode: "0644"
  vars:
    rego_package: dcm.fleet.vm.kvm
  register: dcm_placement_vm_kvm_rego
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]

- name: DCM vm | Read vm placement accept rego
  ansible.builtin.slurp:
    src: "{{ dcm_placement_vm_kvm_rego.dest }}"
  register: dcm_placement_vm_kvm_content
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]

- name: DCM vm | Ensure demo-vm-single placement policy
  ansible.builtin.uri:
    url: "{{ dcm_vm_api_url }}/policies?id={{ fleet_dcm_vm_test_placement_policy_id }}"
    method: POST
    body_format: json
    status_code: [200, 201, 409]
    body:
      display_name: "{{ fleet_dcm_vm_test_placement_policy_display_name }}"
      description: >-
        Place kubevirt-test VMs (profile={{ fleet_dcm_vm_test_workload_profile }},
        scope={{ fleet_dcm_vm_test_placement_scope }}) on one cluster with fleet.capability/kvm=true
      policy_type: GLOBAL
      enabled: true
      priority: "{{ fleet_dcm_vm_test_placement_policy_priority }}"
      label_selector:
        fleet.workload/profile: "{{ fleet_dcm_vm_test_workload_profile }}"
        fleet.placement/scope: "{{ fleet_dcm_vm_test_placement_scope }}"
      cluster_requirements:
        matchLabels:
          fleet.capability/kvm: "true"
        matchExpressions: []
      placement:
        cluster_count: 1
        strategy: single
        site_diversity: false
      rego_code: "{{ dcm_placement_vm_kvm_content.content | b64decode }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]

- name: DCM vm | Patch demo-vm-single placement policy
  ansible.builtin.uri:
    url: "{{ dcm_vm_api_url }}/policies/{{ fleet_dcm_vm_test_placement_policy_id }}"
    method: PATCH
    body_format: json
    status_code: [200, 404]
    headers:
      Content-Type: application/merge-patch+json
    body:
      enabled: true
      priority: "{{ fleet_dcm_vm_test_placement_policy_priority }}"
      rego_code: "{{ dcm_placement_vm_kvm_content.content | b64decode }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]

- name: DCM vm | Seed summary
  ansible.builtin.debug:
    msg: >-
      VM test catalog seeded: id={{ fleet_dcm_vm_test_catalog_item_id }},
      policy={{ fleet_dcm_vm_test_placement_policy_id }}.
      Prereq: POST /clusters/{name}/providers/kubevirt/install on a KVM cluster,
      then deploy via playbooks/flows/vm-test-deploy.yml.
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_catalog, dcm_seed_vm]
