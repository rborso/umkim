---
# Wait for DCM hub stack deployments before catalog seed / API calls.
- name: DCM | Wait for postgres ready
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ phase5_dcm_namespace }} wait
      --for=condition=Ready pod -l app=dcm-postgres --timeout=600s
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  changed_when: false
  tags: [dcm, dcm_hub, dcm_wait_ready, phase5, phase5_hub]

- name: DCM | Wait for hub deployments Available
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ phase5_dcm_namespace }} wait
      --for=condition=Available deployment/{{ item }} --timeout=900s
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  loop:
    - postgres
    - nats
    - control-plane
    - gateway
  changed_when: false
  tags: [dcm, dcm_hub, dcm_wait_ready, phase5, phase5_hub]

- name: DCM | Rollout restart control-plane when image changed
  ansible.builtin.command:
    cmd: kubectl -n {{ phase5_dcm_namespace }} rollout restart deployment/control-plane
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  when: dcm_hub_stack_changed | default(false) | bool
  register: dcm_cp_rollout_restart
  changed_when: dcm_cp_rollout_restart.rc == 0
  tags: [dcm, dcm_hub, dcm_wait_ready, phase5, phase5_hub]

- name: DCM | Wait for control-plane rollout after image change
  ansible.builtin.command:
    cmd: kubectl -n {{ phase5_dcm_namespace }} rollout status deployment/control-plane --timeout=600s
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  when: dcm_hub_stack_changed | default(false) | bool
  changed_when: false
  tags: [dcm, dcm_hub, dcm_wait_ready, phase5, phase5_hub]
