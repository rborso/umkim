---
- name: DCM | Warm Harbor cache for control-plane images
  ansible.builtin.command:
    cmd: >-
      skopeo copy
      docker://{{ harbor_host }}:{{ harbor_nodeport_https }}/{{ harbor_proxy_project_quay }}/{{ item }}:{{ phase5_image_tag }}
      dir:/tmp/dcm-warm/{{ item | regex_replace('/', '_') }}
      --src-creds=admin:{{ harbor_admin_password }}
      --src-tls-verify=false
  loop: "{{ phase5_dcm_images }}"
  register: dcm_warm
  changed_when: dcm_warm.rc == 0
  failed_when: false
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_warm]
