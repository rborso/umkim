---
# Default placement: container + helm policies for demo single and replicated profiles.
- name: DCM placement policies | Disable superseded policies
  ansible.builtin.import_tasks: disable_superseded_policies.yml
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | API base
  ansible.builtin.set_fact:
    dcm_placement_policy_api_url: "{{ fleet_dcm_seed_api_url | default(phase5_registration_url) }}"
    dcm_placement_rwo_cluster_requirements:
      matchLabels:
        fleet.capability/storage.rwo: "true"
      matchExpressions: []
    dcm_placement_demo_single_cluster:
      cluster_count: 1
      strategy: single
      site_diversity: false
    dcm_placement_demo_least_util_cluster:
      cluster_count: 1
      strategy: least_utilized
      site_diversity: false
    dcm_placement_demo_multi_cluster:
      cluster_count: 2
      strategy: spread
      site_diversity: true
    dcm_placement_demo_failover_standby:
      mode: standby
      hub_health_path: /
      failure_threshold: 3
      success_threshold: 2
      cooldown_seconds: 300
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | Render container accept rego
  ansible.builtin.template:
    src: placement_service_accept.rego.j2
    dest: /tmp/dcm-placement-container-rwo.rego
    mode: "0644"
  vars:
    rego_package: dcm.fleet.container.rwo
    service_type: container
  register: dcm_placement_container_rwo_rego
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | Read container accept rego
  ansible.builtin.slurp:
    src: "{{ dcm_placement_container_rwo_rego.dest }}"
  register: dcm_placement_container_rwo_content
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | Render helm accept rego
  ansible.builtin.template:
    src: placement_service_accept.rego.j2
    dest: /tmp/dcm-placement-helm-rwo.rego
    mode: "0644"
  vars:
    rego_package: dcm.fleet.helm.rwo
    service_type: helm
  register: dcm_placement_helm_rwo_rego
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | Read helm accept rego
  ansible.builtin.slurp:
    src: "{{ dcm_placement_helm_rwo_rego.dest }}"
  register: dcm_placement_helm_rwo_content
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | Ensure demo policy (create)
  ansible.builtin.uri:
    url: "{{ dcm_placement_policy_api_url }}/policies?id={{ item.policy_id }}"
    method: POST
    body_format: json
    body: "{{ lookup('ansible.builtin.template', 'placement_demo_policy_body.json.j2') }}"
    status_code: [200, 201, 409]
  loop: "{{ fleet_dcm_demo_placement_policy_specs }}"
  loop_control:
    label: "{{ item.policy_id }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | Ensure demo policy (update)
  ansible.builtin.uri:
    url: "{{ dcm_placement_policy_api_url }}/policies/{{ item.policy_id }}"
    method: PATCH
    body_format: json
    headers:
      Content-Type: application/merge-patch+json
    body: "{{ lookup('ansible.builtin.template', 'placement_demo_policy_patch.json.j2') }}"
    status_code: [200, 404]
  loop: "{{ fleet_dcm_demo_placement_policy_specs }}"
  loop_control:
    label: "{{ item.policy_id }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | Ensure pool policy (create)
  ansible.builtin.uri:
    url: "{{ dcm_placement_policy_api_url }}/policies?id={{ item.policy_id }}"
    method: POST
    body_format: json
    body: "{{ lookup('ansible.builtin.template', 'placement_pool_policy_body.json.j2') }}"
    status_code: [200, 201, 409]
  loop: "{{ fleet_dcm_pool_placement_policy_specs }}"
  loop_control:
    label: "{{ item.policy_id }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | Ensure pool policy (update)
  ansible.builtin.uri:
    url: "{{ dcm_placement_policy_api_url }}/policies/{{ item.policy_id }}"
    method: PATCH
    body_format: json
    headers:
      Content-Type: application/merge-patch+json
    body: "{{ lookup('ansible.builtin.template', 'placement_pool_policy_patch.json.j2') }}"
    status_code: [200, 404]
  loop: "{{ fleet_dcm_pool_placement_policy_specs }}"
  loop_control:
    label: "{{ item.policy_id }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]

- name: DCM placement policies | Seed summary
  ansible.builtin.debug:
    msg: >-
      Demo placement policies seeded:
      demo-container-single, demo-helm-single,
      demo-container-ha-standby, demo-helm-ha-standby,
      demo-container-least-util, demo-helm-least-util,
      shared-pool-default-container, shared-pool-default-helm,
      dedicated-pool-default-container, dedicated-pool-default-helm.
      Labels: fleet.workload/profile=demo, fleet.placement/scope=single|ha-standby,
      fleet.placement/picker=least-utilized (opt-in). Console pre-fills scope=single.
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_placement_policies]
