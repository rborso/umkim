---
- name: DCM | Wait for spoke ManifestWork Applied
  ansible.builtin.command:
    argv:
      - kubectl
      - -n
      - "{{ item }}"
      - get
      - manifestwork
      - "{{ phase5_manifestwork_name }}"
      - -o
      - 'jsonpath={.status.conditions[?(@.type=="Applied")].status}'
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  loop: "{{ ocm_manifestwork_clusters | default(groups['spokes']) }}"
  register: dcm_mw_applied
  until: dcm_mw_applied.stdout | trim == 'True'
  retries: 20
  delay: 10
  changed_when: false
  tags: [dcm, phase5, dcm_verify, phase5_verify]

- name: DCM | Gateway ping
  ansible.builtin.command:
    cmd: curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:{{ phase5_gateway_nodeport }}/ping
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_health
  retries: 10
  delay: 5
  until: dcm_health.stdout | trim == '200'
  changed_when: false
  tags: [dcm, phase5, dcm_verify, phase5_verify]

- name: DCM | List registered providers via gateway
  ansible.builtin.command:
    cmd: >-
      curl -sf
      http://127.0.0.1:{{ phase5_gateway_nodeport }}/api/v1alpha1/providers
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_providers
  changed_when: false
  retries: 10
  delay: 5
  until: "'providers' in dcm_providers.stdout"
  tags: [dcm, phase5, dcm_verify, phase5_verify]

- name: DCM | Provider registration summary
  ansible.builtin.debug:
    msg:
      gateway_health: "{{ dcm_health.stdout | trim }}"
      providers: "{{ dcm_providers.stdout | default('(no response)') }}"
  tags: [dcm, phase5, dcm_verify, phase5_verify]
