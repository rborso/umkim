---
# Prepare shared ACME storage when gateway runs multiple replicas (hostPath).

- name: DCM gateway | Ensure ACME hostPath directory on hub node
  ansible.builtin.file:
    path: "{{ dcm_gateway_acme_host_path }}"
    state: directory
    mode: "0755"
  when:
    - (dcm_gateway_replicas | default(1) | int) > 1
    - fleet_edge_acme_enabled | default(false) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM gateway | Check legacy ACME PVC exists
  ansible.builtin.command:
    cmd: kubectl -n {{ phase5_dcm_namespace }} get pvc dcm-traefik-acme
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_gateway_acme_pvc_check
  failed_when: false
  changed_when: false
  when:
    - (dcm_gateway_replicas | default(1) | int) > 1
    - fleet_edge_acme_enabled | default(false) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub]

- name: DCM gateway | Migrate acme.json from legacy PVC to hostPath
  ansible.builtin.shell: |
    set -euo pipefail
    HOST_PATH="{{ dcm_gateway_acme_host_path }}"
    if [[ -s "${HOST_PATH}/acme.json" ]]; then
      echo "hostPath acme.json already present; skip migrate"
      exit 0
    fi
    kubectl -n {{ phase5_dcm_namespace }} run dcm-acme-migrate \
      --restart=Never \
      --image={{ phase5_traefik_image }} \
      --overrides='{
        "spec": {
          "containers": [{
            "name": "migrate",
            "image": "{{ phase5_traefik_image }}",
            "command": ["sh", "-c", "test -f /pvc/acme.json && cp -a /pvc/acme.json /host/acme.json && chmod 600 /host/acme.json; ls -la /host"],
            "volumeMounts": [
              {"name": "pvc", "mountPath": "/pvc"},
              {"name": "host", "mountPath": "/host"}
            ]
          }],
          "volumes": [
            {"name": "pvc", "persistentVolumeClaim": {"claimName": "dcm-traefik-acme"}},
            {"name": "host", "hostPath": {"path": "{{ dcm_gateway_acme_host_path }}", "type": "Directory"}}
          ]
        }
      }'
    kubectl -n {{ phase5_dcm_namespace }} wait --for=condition=Ready pod/dcm-acme-migrate --timeout=120s || true
    kubectl -n {{ phase5_dcm_namespace }} logs dcm-acme-migrate || true
    kubectl -n {{ phase5_dcm_namespace }} delete pod dcm-acme-migrate --ignore-not-found --wait=true
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  args:
    executable: /bin/bash
  when:
    - (dcm_gateway_replicas | default(1) | int) > 1
    - fleet_edge_acme_enabled | default(false) | bool
    - dcm_gateway_acme_pvc_check.rc == 0
  changed_when: true
  tags: [dcm, phase5, dcm_hub, phase5_hub]
