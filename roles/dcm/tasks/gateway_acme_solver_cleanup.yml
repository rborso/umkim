---
# When hostNetwork legacy ACME is active, gateway-acme must not hold WAN externalIPs
# (kube-proxy REJECTs :80/:443 on externalIPs with no endpoints).

- name: DCM gateway | Remove stale gateway-acme solver resources
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ phase5_dcm_namespace }} delete deploy,svc,cm gateway-acme,dcm-traefik-acme-routes
      --ignore-not-found --wait=true
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_gateway_acme_cleanup
  changed_when: "'deleted' in (dcm_gateway_acme_cleanup.stdout | default(''))"
  when:
    - fleet_edge_acme_enabled | default(false) | bool
    - not (dcm_gateway_acme_solver_enabled | default(fleet_edge_acme_enabled | default(false)) | bool)
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]
