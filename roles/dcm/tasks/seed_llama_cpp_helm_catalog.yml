---
# Seed llama-cpp-helm catalog item and llm-gpu-* placement policies.
- name: DCM llama cpp helm | API base for seed tasks
  ansible.builtin.set_fact:
    dcm_llama_api_url: "{{ fleet_dcm_seed_api_url | default(phase5_registration_url) }}"
    dcm_helm_chart_oci: "{{ harbor_charts_oci_prefix | default('oci://10.10.0.1:30443/charts') }}"
    dcm_llama_repo_root: "{{ playbook_dir | regex_replace('/playbooks/?$', '') }}"
    fleet_dcm_llm_workload_profile: llm
    fleet_dcm_llm_placement_scope: single
    fleet_dcm_llm_placement_policy_id: llm-gpu-single
    fleet_dcm_llm_placement_policy_display_name: LLM inference · one GPU cluster
    fleet_dcm_llm_placement_policy_priority: 108
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Read fleet default values
  ansible.builtin.slurp:
    src: "{{ dcm_llama_repo_root }}/deploy/llama-cpp-helm/values-fleet.yaml"
  register: dcm_llama_values_slurp
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Default values YAML for catalog field
  ansible.builtin.set_fact:
    dcm_llama_cpp_helm_values_default: "{{ dcm_llama_values_slurp.content | b64decode }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Build catalog fields
  ansible.builtin.set_fact:
    dcm_llama_cpp_catalog_fields: "{{ lookup('template', 'helm_llama_cpp_catalog_fields.json.j2') }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Ensure catalog item exists
  ansible.builtin.uri:
    url: "{{ dcm_llama_api_url }}/catalog-items?id=llama-cpp-helm"
    method: POST
    body_format: json
    status_code: [200, 201, 409]
    body:
      api_version: v1alpha1
      display_name: llama.cpp inference (Helm)
      spec:
        resources:
          - name: release
            service_type: helm
            fields: "{{ dcm_llama_cpp_catalog_fields }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Patch catalog item
  ansible.builtin.uri:
    url: "{{ dcm_llama_api_url }}/catalog-items/llama-cpp-helm"
    method: PATCH
    body_format: json
    status_code: [200, 404]
    headers:
      Content-Type: application/merge-patch+json
    body:
      display_name: llama.cpp inference (Helm)
      spec:
        resources:
          - name: release
            service_type: helm
            fields: "{{ dcm_llama_cpp_catalog_fields }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Render helm accept rego
  ansible.builtin.template:
    src: placement_service_accept.rego.j2
    dest: /tmp/dcm-placement-llm-helm.rego
    mode: "0644"
  vars:
    rego_package: dcm.fleet.llm.helm.gpu
    service_type: helm
  register: dcm_placement_llm_helm_rego
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Read helm accept rego
  ansible.builtin.slurp:
    src: "{{ dcm_placement_llm_helm_rego.dest }}"
  register: dcm_placement_llm_helm_content
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Ensure llm-gpu-single placement policy
  ansible.builtin.uri:
    url: "{{ dcm_llama_api_url }}/policies?id={{ fleet_dcm_llm_placement_policy_id }}"
    method: POST
    body_format: json
    status_code: [200, 201, 409]
    body:
      display_name: "{{ fleet_dcm_llm_placement_policy_display_name }}"
      description: >-
        Place llama-cpp-helm workloads (profile={{ fleet_dcm_llm_workload_profile }},
        scope={{ fleet_dcm_llm_placement_scope }}) on one GPU cluster with RWO storage
      policy_type: GLOBAL
      enabled: true
      priority: "{{ fleet_dcm_llm_placement_policy_priority }}"
      label_selector:
        fleet.workload/profile: "{{ fleet_dcm_llm_workload_profile }}"
        fleet.placement/scope: "{{ fleet_dcm_llm_placement_scope }}"
      cluster_requirements:
        matchLabels:
          fleet.capability/gpu: "true"
          fleet.capability/storage.rwo: "true"
        matchExpressions: []
      placement:
        cluster_count: 1
        strategy: least_utilized
        site_diversity: false
      rego_code: "{{ dcm_placement_llm_helm_content.content | b64decode }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Patch llm-gpu-single placement policy
  ansible.builtin.uri:
    url: "{{ dcm_llama_api_url }}/policies/{{ fleet_dcm_llm_placement_policy_id }}"
    method: PATCH
    body_format: json
    status_code: [200, 404]
    headers:
      Content-Type: application/merge-patch+json
    body:
      enabled: true
      priority: "{{ fleet_dcm_llm_placement_policy_priority }}"
      rego_code: "{{ dcm_placement_llm_helm_content.content | b64decode }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Ensure llm-gpu-binpack placement policy (Phase 2)
  ansible.builtin.uri:
    url: "{{ dcm_llama_api_url }}/policies?id=llm-gpu-binpack"
    method: POST
    body_format: json
    status_code: [200, 201, 409]
    body:
      display_name: LLM inference · GPU bin-pack (fleet-wide)
      description: >-
        Spread llama-cpp-helm GPU instances across clusters using gpu_binpack strategy
      policy_type: GLOBAL
      enabled: true
      priority: 107
      label_selector:
        fleet.workload/profile: "{{ fleet_dcm_llm_workload_profile }}"
        fleet.placement/scope: fleet
      cluster_requirements:
        matchLabels:
          fleet.capability/gpu: "true"
          fleet.capability/storage.rwo: "true"
        matchExpressions: []
      placement:
        strategy: gpu_binpack
        site_diversity: false
      rego_code: "{{ dcm_placement_llm_helm_content.content | b64decode }}"
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]

- name: DCM llama cpp helm | Seed summary
  ansible.builtin.debug:
    msg: >-
      llama-cpp-helm catalog seeded (chart {{ dcm_helm_chart_oci }}/llama-cpp-helm:0.1.2).
      Policy {{ fleet_dcm_llm_placement_policy_id }} requires fleet.capability/gpu=true.
      Set values.model, values.hfRepo, values.ctxSize.
      Deploy labels: fleet.workload/profile=llm, fleet.placement/scope=single,
      fleet.placement/pool=shared|dedicated, fleet.org=<slug>.
  run_once: true
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_seed_llama_cpp_helm]
