---
# Multi-replica hub gateway must use pod network (not hostNetwork) so several
# Traefik pods can run on a single node and RollingUpdate can surge without port conflicts.

- name: DCM gateway | Read gateway hostNetwork (HA check)
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ phase5_dcm_namespace }} get deployment gateway
      -o jsonpath={.spec.template.spec.hostNetwork}
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_gateway_hostnetwork_current
  changed_when: false
  failed_when: false
  when: (dcm_gateway_replicas | default(1) | int) > 1
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM gateway | Enforce pod-network mode for HA replicas
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ phase5_dcm_namespace }} patch deployment gateway --type=json
      -p='[{"op":"replace","path":"/spec/strategy","value":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":{{ dcm_gateway_rolling_max_surge | default(1) }},"maxUnavailable":{{ dcm_gateway_rolling_max_unavailable | default(0) }}}}},{"op":"replace","path":"/spec/template/spec/hostNetwork","value":false},{"op":"replace","path":"/spec/template/spec/dnsPolicy","value":"ClusterFirst"}]'
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_gateway_ha_network_patch
  changed_when: dcm_gateway_ha_network_patch.rc == 0
  when:
    - (dcm_gateway_replicas | default(1) | int) > 1
    - not (fleet_gateway_wireguard_upstream | default((groups.get('spokes', {}) | default({}) | length > 0)) | bool)
    - dcm_gateway_hostnetwork_current.stdout | trim == 'true'
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]
