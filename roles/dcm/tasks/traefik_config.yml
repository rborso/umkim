---
- name: DCM Traefik | Render fleet edge route fragments
  ansible.builtin.import_role:
    name: fleet_edge
    tasks_from: render_fragments.yml
  when:
    - fleet_edge_enable | default(false) | bool
    - not (fleet_edge_skip_render | default(false) | bool)
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik, fleet_edge]

# Stage Traefik configs, apply ConfigMaps, and compute checksums for gateway auto-rollout.
# ConfigMap subPath mounts do not hot-reload; pod template checksum annotations trigger
# a rolling update when Ansible updates routes or static config (no manual rollout restart).

- name: DCM Traefik | Ensure config staging directory
  ansible.builtin.file:
    path: /tmp/dcm-config
    state: directory
    mode: "0755"
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM Traefik | Stage static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /tmp/dcm-config/traefik.yml
    mode: "0644"
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM Traefik | Render dynamic routes
  ansible.builtin.template:
    src: routes.yml.j2
    dest: /tmp/dcm-config/routes.yml
    mode: "0644"
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM Traefik | Read staged static config
  ansible.builtin.slurp:
    src: /tmp/dcm-config/traefik.yml
  register: dcm_traefik_static_slurp
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM Traefik | Read staged dynamic routes
  ansible.builtin.slurp:
    src: /tmp/dcm-config/routes.yml
  register: dcm_traefik_dynamic_slurp
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM Traefik | Set config checksum facts
  ansible.builtin.set_fact:
    dcm_traefik_static_checksum: "{{ dcm_traefik_static_slurp.content | b64decode | hash('sha256') }}"
    dcm_traefik_dynamic_checksum: "{{ dcm_traefik_dynamic_slurp.content | b64decode | hash('sha256') }}"
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM Traefik | Apply static ConfigMap
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl create configmap dcm-traefik-static \
      -n {{ phase5_dcm_namespace }} \
      --from-file=traefik.yml=/tmp/dcm-config/traefik.yml \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  args:
    executable: /bin/bash
  register: dcm_traefik_static_apply
  changed_when: "'created' in dcm_traefik_static_apply.stdout or 'configured' in dcm_traefik_static_apply.stdout"
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM Traefik | Apply dynamic ConfigMap
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl create configmap dcm-traefik-dynamic \
      -n {{ phase5_dcm_namespace }} \
      --from-file=routes.yml=/tmp/dcm-config/routes.yml \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  args:
    executable: /bin/bash
  register: dcm_traefik_dynamic_apply
  changed_when: "'created' in dcm_traefik_dynamic_apply.stdout or 'configured' in dcm_traefik_dynamic_apply.stdout"
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM Traefik | Stage fleet routes fragment (middlewares only when no fleet routers)
  ansible.builtin.template:
    src: fleet-routes-middlewares-only.yml.j2
    dest: /tmp/dcm-config/fleet-routes.yml
    mode: "0644"
  when: fleet_edge_skip_render | default(false) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik, fleet_edge]

- name: DCM Traefik | Read existing fleet routes ConfigMap
  ansible.builtin.command:
    cmd: kubectl -n {{ phase5_dcm_namespace }} get configmap dcm-traefik-fleet-routes -o jsonpath='{.data.fleet-routes\.yml}'
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_traefik_existing_fleet_routes
  changed_when: false
  failed_when: false
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik, fleet_edge]

- name: DCM Traefik | Stage empty fleet routes placeholder
  ansible.builtin.copy:
    dest: /tmp/dcm-config/fleet-routes.yml
    mode: "0644"
    content: "{}\n"
  when:
    - not (fleet_edge_skip_render | default(false) | bool)
    - dcm_traefik_existing_fleet_routes.stdout | default('') | trim in ['', '{}']
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik, fleet_edge]

- name: DCM Traefik | Keep controller-owned fleet routes (skip empty overwrite)
  ansible.builtin.copy:
    dest: /tmp/dcm-config/fleet-routes.yml
    mode: "0644"
    content: "{{ dcm_traefik_existing_fleet_routes.stdout }}\n"
  when:
    - not (fleet_edge_skip_render | default(false) | bool)
    - dcm_traefik_existing_fleet_routes.stdout | default('') | trim not in ['', '{}']
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik, fleet_edge]

- name: DCM Traefik | Apply fleet routes ConfigMap (controller-owned content)
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl create configmap dcm-traefik-fleet-routes \
      -n {{ phase5_dcm_namespace }} \
      --from-file=fleet-routes.yml=/tmp/dcm-config/fleet-routes.yml \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  args:
    executable: /bin/bash
  register: dcm_traefik_fleet_routes_apply
  changed_when: "'created' in dcm_traefik_fleet_routes_apply.stdout or 'configured' in dcm_traefik_fleet_routes_apply.stdout"
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik, fleet_edge]

- name: DCM Traefik | Check gateway deployment exists
  ansible.builtin.command:
    cmd: kubectl -n {{ phase5_dcm_namespace }} get deployment gateway
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path }}"
  register: dcm_gateway_deploy_check
  failed_when: false
  changed_when: false
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]

- name: DCM Traefik | Trigger gateway rollout when config checksums change
  ansible.builtin.import_tasks: traefik_gateway_rollout.yml
  when:
    - dcm_gateway_deploy_check.rc == 0
    - >-
      dcm_traefik_static_apply is changed or
      dcm_traefik_dynamic_apply is changed or
      dcm_traefik_force_gateway_rollout | default(false) | bool
  tags: [dcm, phase5, dcm_hub, phase5_hub, dcm_traefik]
