---
phase5_dcm_namespace: dcm
phase5_worker_namespace: dcm-worker
phase5_manifestwork_name: phase5-k8s-container-sp

phase5_gateway_nodeport: 30908
phase5_gateway_https_nodeport: 30909
phase5_nats_nodeport: 30222
phase5_traefik_acme_pvc_size: 1Mi
dcm_gateway_cluster_port: "{{ 80 if (fleet_edge_acme_enabled | default(false) | bool) else 9080 }}"

# Hub Traefik gateway HA (inventory hub.yml overrides replicas to 3).
dcm_gateway_replicas: 1
dcm_gateway_rolling_max_surge: 1
dcm_gateway_rolling_max_unavailable: 0
dcm_gateway_min_ready_seconds: 5
dcm_gateway_acme_host_path: /var/lib/umkim/traefik-acme
# Hub public IPv4 for gateway Service externalIPs when gateway_ha + ACME (defaults to ansible_host).
dcm_gateway_external_ip: "{{ ansible_host }}"
# Dedicated TLS-ALPN solver Deployment (gateway-acme); only when HA pod-network (see hub-stack.yaml.j2).
dcm_gateway_acme_solver_enabled: "{{ (dcm_gateway_replicas | default(1) | int) > 1 and not (fleet_gateway_wireguard_upstream | default(false) | bool) }}"
phase5_gateway_acme_http_nodeport: 30918
phase5_gateway_acme_https_nodeport: 30919

phase5_postgres_image: docker.io/library/postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
phase5_nats_image: docker.io/library/nats:2-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
phase5_traefik_image: docker.io/traefik:v3.4@sha256:06ddf61ee653caf4f4211a604e657f084f4727f762c16f826c97aafbefcb279e

phase5_image_tag: "{{ umkim_version | default('0.1.0') }}"
phase5_dcm_registry: "{{ harbor_host }}:{{ harbor_nodeport_https }}/{{ harbor_proxy_project_quay }}"

# Control-plane monolith (catalog + policy + placement + SPM in one process).
phase5_control_plane_version: "{{ umkim_version | default('0.1.0') }}"
phase5_control_plane_image: "{{ harbor_fleet_image_prefix }}/control-plane:{{ phase5_control_plane_version }}"
phase5_dcm_app_db: control-plane
# One-time lab migration: delete postgres PVC before schema reset.
fleet_dcm_monolith_reset_db: false

# Placement HTTP client timeouts (SPM calls; OLM SP returns async by default).
dcm_placement_sprm_timeout: 120s
dcm_placement_policy_timeout: 30s
dcm_spm_provider_http_timeout: 10m
dcm_control_plane_write_timeout: 5m

# Multi-cluster placement (OCM ManagedCluster lister + selected_providers[]).
fleet_dcm_phase2_placement: false
fleet_dcm_demo_policy_spread_ha: false
phase5_k8s_container_sp_version: "{{ phase5_upstream_image_tag }}"
# Fleet-built k8s SP (millicore CPU); overrides quay-proxy upstream.
dcm_k8s_sp_image: "{{ harbor_fleet_image_prefix }}/k8s-container-service-provider:{{ harbor_fleet_image_tag | default(umkim_version) }}"
dcm_kubevirt_sp_image: "{{ harbor_fleet_image_prefix }}/kubevirt-service-provider:{{ harbor_fleet_image_tag | default(umkim_version) }}"

phase5_postgres_pvc_size: 10Gi
phase5_db_user: admin

phase5_k8s_sp_external_svc_type: NodePort
phase5_k8s_sp_workload_namespace: default

# Warm Harbor quay-proxy for control-plane only (k8s SP is fleet-built; see harbor_push_fleet).
phase5_dcm_images:
  - rborso/control-plane

# Hub WireGuard IP — registration and NATS for spoke workers.
phase5_hub_wireguard_ip: "{{ fleet_hub_wireguard_ip | default('10.10.0.1') }}"
phase5_registration_url: "http://{{ phase5_hub_wireguard_ip }}:{{ phase5_gateway_nodeport }}/api/v1alpha1"
# Lab: demo whoami catalog + routing policies (see tasks/seed_demo_catalog.yml)
fleet_dcm_demo_catalog_seed: true
fleet_dcm_demo_catalog_item_id: demo-webapp
fleet_dcm_demo_catalog_display_name: Demo Webapp
fleet_dcm_demo_catalog_container_name: demo-webapp
fleet_dcm_demo_disable_allow_all_policy: true
fleet_dcm_fleet_policies_seed: false
# Policy-driven placement: container + helm on clusters with storage.rwo (Phase 2).
fleet_dcm_placement_policies_seed: true
fleet_dcm_require_routing_cluster: false
fleet_dcm_site_route_policies: false
fleet_dcm_superseded_policy_ids:
  - fleet-routing-cluster-override
  - fleet-container-homelab
  - fleet-helm-homelab
  - fleet-container-spread-rwx
  - fleet-container-resources
  - fleet-container-require-cluster
  - fleet-helm-require-cluster
  - homelab-operator-virt02
  - homelab-operator-virt02-t2
  - fleet-nested-cluster
  - lab-route-virt02
  - lab-route-virt01
  - lab-spread-storage-rwx
  - lab-spread-ha-storage
  - homelab-helm-virt01
  - homelab-helm-virt02
  - lab-helm-hubonly-virt02
  - lab-helm-dual
  # Retired demo placement policies (replication=1/2 label scheme).
  - fleet-container-rwo
  - fleet-container-rwo-repl2
  - fleet-helm-rwo
  - fleet-helm-rwo-repl2
  - fleet-container-least-util
  - fleet-helm-least-util
fleet_dcm_legacy_policy_ids: "{{ fleet_dcm_superseded_policy_ids }}"
fleet_dcm_demo_catalog_image: docker.io/traefik/whoami:v1.10@sha256:1699d99cb4b9acc17f74ca670b3d8d0b7ba27c948b3445f0593b58ebece92f04
# VM smoke-test catalog (cirros via kubevirt SP); see tasks/seed_vm_catalog.yml
fleet_dcm_vm_test_catalog_seed: true
fleet_dcm_vm_test_catalog_item_id: vm-test
fleet_dcm_vm_test_catalog_display_name: VM test (cirros)
fleet_dcm_vm_test_catalog_description: >-
  Minimal KubeVirt VM template for provider smoke tests (cirros container disk).
fleet_dcm_vm_test_default_name: vm-test
fleet_dcm_vm_test_workload_profile: kubevirt-test
fleet_dcm_vm_test_placement_scope: single
fleet_dcm_vm_test_placement_policy_id: demo-vm-single
fleet_dcm_vm_test_placement_policy_display_name: Demo VM · one KVM cluster
fleet_dcm_vm_test_placement_policy_priority: 105
# Rocky 9 LAN VM (bridge + cloud-init); see tasks/seed_rocky9_vm_catalog.yml
fleet_dcm_rocky9_vm_catalog_seed: true
fleet_dcm_rocky9_vm_catalog_item_id: rocky9-vm
fleet_dcm_rocky9_vm_catalog_display_name: Rocky 9 VM
fleet_dcm_rocky9_vm_catalog_description: >-
  Rocky Linux 9 guest on Multus bridge (host L2). Configurable CPU, memory, disk,
  static IP, and SSH public key via cloud-init.
fleet_dcm_rocky9_vm_default_name: rocky9-vm
fleet_dcm_rocky9_vm_default_multus_network: default/mgmt-l2
fleet_dcm_rocky9_vm_default_gateway: "192.168.1.1"
fleet_dcm_rocky9_vm_default_nameservers:
  - "192.168.1.1"
# Demo placement labels: fleet.workload/profile + fleet.placement/scope (+ optional fleet.placement/picker).
fleet_dcm_demo_workload_profile: demo
fleet_dcm_demo_placement_scope_single: single
fleet_dcm_demo_placement_scope_ha: ha-standby
fleet_dcm_demo_placement_picker_least_util: least-utilized
fleet_dcm_demo_instance_label_selector:
  fleet.workload/profile: "{{ fleet_dcm_demo_workload_profile }}"
  fleet.placement/scope: "{{ fleet_dcm_demo_placement_scope_single }}"
# Default catalog pod replica count (not cluster placement scope).
fleet_dcm_demo_catalog_replicas: 1
fleet_dcm_demo_placement_policy_specs:
  - policy_id: demo-container-single
    service_type: container
    scope: "{{ fleet_dcm_demo_placement_scope_single }}"
    display_name: Demo containers · one cluster
    priority: 100
    rego: container
  - policy_id: demo-helm-single
    service_type: helm
    scope: "{{ fleet_dcm_demo_placement_scope_single }}"
    display_name: Demo Helm · one cluster
    priority: 110
    rego: helm
  - policy_id: demo-container-ha-standby
    service_type: container
    scope: "{{ fleet_dcm_demo_placement_scope_ha }}"
    display_name: Demo containers · HA across two sites
    priority: 120
    rego: container
    ha_standby: true
  - policy_id: demo-helm-ha-standby
    service_type: helm
    scope: "{{ fleet_dcm_demo_placement_scope_ha }}"
    display_name: Demo Helm · HA across two sites
    priority: 130
    rego: helm
    ha_standby: true
  - policy_id: demo-container-least-util
    service_type: container
    scope: "{{ fleet_dcm_demo_placement_scope_single }}"
    picker: "{{ fleet_dcm_demo_placement_picker_least_util }}"
    display_name: Demo containers · least utilized cluster
    priority: 140
    rego: container
    least_utilized: true
  - policy_id: demo-helm-least-util
    service_type: helm
    scope: "{{ fleet_dcm_demo_placement_scope_single }}"
    picker: "{{ fleet_dcm_demo_placement_picker_least_util }}"
    display_name: Demo Helm · least utilized cluster
    priority: 150
    rego: helm
    least_utilized: true
fleet_dcm_pool_placement_policy_specs:
  - policy_id: shared-pool-default-container
    service_type: container
    pool: shared
    display_name: Shared pool · containers
    priority: 50
  - policy_id: shared-pool-default-helm
    service_type: helm
    pool: shared
    display_name: Shared pool · Helm
    priority: 55
  - policy_id: dedicated-pool-default-container
    service_type: container
    pool: dedicated
    display_name: Dedicated pool · containers
    priority: 60
  - policy_id: dedicated-pool-default-helm
    service_type: helm
    pool: dedicated
    display_name: Dedicated pool · Helm
    priority: 65
# Helm whoami-helm catalog (see tasks/seed_helm_catalog.yml); requires harbor_push_charts.
fleet_dcm_helm_catalog_seed: true
# Three-tier Pet Clinic (Postgres PVC + Spring + nginx) — see tasks/seed_pet_clinic_helm_catalog.yml
fleet_dcm_pet_clinic_helm_catalog_seed: true
# llama.cpp inference chart (GPU clusters); see docs/components/fleet-llm.md
fleet_dcm_llama_cpp_helm_catalog_seed: true
# App catalog items (gitea, paperless, …) — seed from sibling umkim-catalog repo.
# CloudNativePG operator catalog (see tasks/seed_operator_catalog.yml)
fleet_dcm_operator_catalog_seed: false
# Use loopback on hub when seed runs via ansible -l hub (NodePort gateway).
fleet_dcm_seed_api_url: "http://127.0.0.1:{{ phase5_gateway_nodeport }}/api/v1alpha1"
phase5_nats_url: "nats://{{ phase5_hub_wireguard_ip }}:{{ phase5_nats_nodeport }}"
