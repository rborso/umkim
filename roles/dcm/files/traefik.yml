entryPoints:
  web:
    address: ":9080"

providers:
  file:
    # Use subPath file mounts (not directory+watch). ConfigMap dirs use symlinks that break
    # fsnotify ("too many open files"). watch=false is correct: subPath ConfigMaps do not
    # update in-place; gateway pods roll automatically via checksum annotations when Ansible
    # updates the ConfigMaps (see traefik_config.yml / gateway-rollout-patch.yaml.j2).
    filename: /etc/traefik/dynamic/routes.yml
    watch: false

ping:
  entryPoint: web

log:
  level: INFO

accessLog: {}
