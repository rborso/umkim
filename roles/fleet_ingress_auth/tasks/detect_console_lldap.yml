---
# When fleet-console already runs LLDAP, Authelia must authenticate against it
# (same users/passwords as console login) — not a second LLDAP in fleet-ingress-auth.
- name: Fleet ingress auth | Detect fleet-console LLDAP deployment
  ansible.builtin.command:
    cmd: kubectl -n {{ fleet_webui_namespace | default('fleet-console') }} get deployment lldap -o json
  register: fia_console_lldap_deploy
  failed_when: false
  changed_when: false
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path | default('/usr/local/bin:/usr/bin:/bin') }}"

- name: Fleet ingress auth | Read console LLDAP bind password
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ fleet_webui_namespace | default('fleet-console') }}
      get secret lldap-credentials -o jsonpath='{.data.LLDAP_LDAP_USER_PASS}'
  register: fia_console_lldap_pass_b64
  failed_when: false
  changed_when: false
  when: fia_console_lldap_deploy.rc == 0
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path | default('/usr/local/bin:/usr/bin:/bin') }}"

- name: Fleet ingress auth | Use shared fleet-console LLDAP for Authelia
  ansible.builtin.set_fact:
    fleet_ingress_auth_use_console_lldap: true
    fleet_ingress_auth_lldap_deploy: false
    fleet_ingress_auth_lldap_external_url: >-
      ldap://lldap.{{ fleet_webui_namespace | default('fleet-console') }}.svc.cluster.local:{{
      fleet_auth_lldap_ldap_port | default(fleet_ingress_auth_lldap_ldap_port) | default(3890) }}
    fleet_ingress_auth_lldap_base_dn: "{{ _base_dn }}"
    fleet_ingress_auth_lldap_admin_password: "{{ fia_console_lldap_pass_b64.stdout | b64decode | trim }}"
  vars:
    _deploy: "{{ fia_console_lldap_deploy.stdout | default('{}') | from_json }}"
    _base_dn: >-
      {{ (_deploy.spec.template.spec.containers[0].env | default([])
          | selectattr('name', 'equalto', 'LLDAP_LDAP_BASE_DN')
          | map(attribute='value') | first)
         | default(fleet_auth_ldap_base_dn | default(fleet_ingress_auth_lldap_base_dn)) }}
  when:
    - fia_console_lldap_deploy.rc == 0
    - (_deploy.status.availableReplicas | default(0) | int) > 0
    - fia_console_lldap_pass_b64.rc == 0
    - fia_console_lldap_pass_b64.stdout | length > 0
