---
# Spoke ManifestWork render needs per-cluster Authelia secrets. Console enable writes
# fleet-ingress-auth-<cluster> on the hub; Ansible Jobs mount that Secret under secrets_dir.
# When the directory is not a mount (local ansible-playbook), sync from the hub Secret when
# present; otherwise seed from vault/hub defaults (force: false).
- name: Fleet ingress auth | Spoke secret file definitions (defaults)
  ansible.builtin.set_fact:
    fia_spoke_secret_files:
      lldapAdminPassword: "{{ fleet_ingress_auth_lldap_admin_password }}"
      lldapJwtSecret: "{{ fleet_ingress_auth_lldap_jwt_secret }}"
      sessionSecret: "{{ fleet_ingress_auth_session_secret }}"
      storageEncryptionKey: "{{ fleet_ingress_auth_storage_encryption_key }}"
      resetJwtSecret: "{{ fleet_ingress_auth_reset_jwt_secret }}"
      oidcHmacSecret: "{{ fleet_ingress_auth_oidc_hmac_secret | default('') }}"
      oidcIssuerPrivateKey: "{{ fleet_ingress_auth_oidc_issuer_private_key | default('') }}"
      oidcClientSecrets: "{{ fleet_ingress_auth_oidc_client_secrets | default('{}') }}"
  tags: [fleet_ingress_auth, fleet_ingress_auth_spokes]

- name: Fleet ingress auth | Stat spoke secrets directory
  ansible.builtin.stat:
    path: "{{ _secrets_dir }}"
  loop: "{{ fia_cluster_config_items }}"
  loop_control:
    label: "{{ item.key }}"
    index_var: fia_cluster_idx
  vars:
    _cfg: "{{ item.value | default({}) }}"
    _secrets_dir: "{{ _cfg.secrets_dir | default('/secrets/ingress-auth/clusters/' + item.key) }}"
  register: fia_spoke_secrets_dir_stat
  tags: [fleet_ingress_auth, fleet_ingress_auth_spokes]

- name: Fleet ingress auth | Ensure spoke secrets directory
  ansible.builtin.file:
    path: "{{ _secrets_dir }}"
    state: directory
    mode: "0700"
  loop: "{{ fia_cluster_config_items }}"
  loop_control:
    label: "{{ item.key }}"
    index_var: fia_cluster_idx
  vars:
    _cfg: "{{ item.value | default({}) }}"
    _secrets_dir: "{{ _cfg.secrets_dir | default('/secrets/ingress-auth/clusters/' + item.key) }}"
  when: not (fia_spoke_secrets_dir_stat.results[fia_cluster_idx].stat.exists | default(false))
  tags: [fleet_ingress_auth, fleet_ingress_auth_spokes]

- name: Fleet ingress auth | Read hub per-cluster ingress-auth Secret
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ fleet_console_namespace | default('fleet-console') }}
      get secret fleet-ingress-auth-{{ item.key }} -o json
  loop: "{{ fia_cluster_config_items }}"
  loop_control:
    label: "{{ item.key }}"
  register: fia_cluster_hub_secret
  failed_when: false
  changed_when: false
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path | default('/usr/local/bin:/usr/bin:/bin') }}"
  tags: [fleet_ingress_auth, fleet_ingress_auth_spokes]

- name: Fleet ingress auth | Sync spoke secret files from hub Secret
  ansible.builtin.copy:
    dest: "{{ _secrets_dir }}/{{ item.1 }}"
    content: "{{ _decoded }}\n"
    mode: "0600"
  loop: "{{ fia_cluster_config_items | product(['lldapAdminPassword', 'lldapJwtSecret', 'sessionSecret', 'storageEncryptionKey', 'resetJwtSecret', 'oidcHmacSecret', 'oidcIssuerPrivateKey', 'oidcClientSecrets']) | list }}"
  loop_control:
    label: "{{ item.0.key }}/{{ item.1 }}"
  vars:
    _cfg: "{{ item.0.value | default({}) }}"
    _secrets_dir: "{{ _cfg.secrets_dir | default('/secrets/ingress-auth/clusters/' + item.0.key) }}"
    # K8s Secret volume mounts expose a ..data symlink; skip writes for those.
    _k8s_secret_mount: "{{ ((_secrets_dir + '/..data') is exists) | bool }}"
    _secret_result: "{{ fia_cluster_hub_secret.results | selectattr('item.key', 'equalto', item.0.key) | list | first }}"
    _data: "{{ (_secret_result.stdout | default('{}') | from_json).data | default({}) }}"
    _b64: "{{ _data[item.1] | default('') }}"
    _decoded: "{{ (_b64 | b64decode) if (_b64 | length > 0) else '' }}"
  when:
    - not _k8s_secret_mount
    - _secret_result.rc | default(1) == 0
    - _decoded | length > 0
  tags: [fleet_ingress_auth, fleet_ingress_auth_spokes]

- name: Fleet ingress auth | Write missing spoke secret files from defaults
  ansible.builtin.copy:
    dest: "{{ _secrets_dir }}/{{ item.1.key }}"
    content: "{{ item.1.value }}\n"
    mode: "0600"
    force: false
  loop: "{{ fia_cluster_config_items | product(fia_spoke_secret_files | dict2items) | list }}"
  loop_control:
    label: "{{ item.0.key }}/{{ item.1.key }}"
  vars:
    _cfg: "{{ item.0.value | default({}) }}"
    _secrets_dir: "{{ _cfg.secrets_dir | default('/secrets/ingress-auth/clusters/' + item.0.key) }}"
    _k8s_secret_mount: "{{ ((_secrets_dir + '/..data') is exists) | bool }}"
  when: not _k8s_secret_mount
  tags: [fleet_ingress_auth, fleet_ingress_auth_spokes]
