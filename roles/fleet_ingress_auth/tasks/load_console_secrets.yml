---
# When ingress auth was enabled via the console, Authelia session secrets live in
# fleet-console and must not be overwritten by Ansible vault defaults.
- name: Fleet ingress auth | Read console ingress-auth secret
  ansible.builtin.command:
    cmd: kubectl -n fleet-console get secret fleet-ingress-auth-secrets -o json
  register: fia_console_secret
  failed_when: false
  changed_when: false
  environment:
    KUBECONFIG: "{{ ocm_kubeconfig }}"
    PATH: "{{ k3s_command_path | default('/usr/local/bin:/usr/bin:/bin') }}"

- name: Fleet ingress auth | Apply console-generated Authelia secrets
  ansible.builtin.set_fact:
    fleet_ingress_auth_bootstrap_password: "{{ _bootstrap }}"
    fleet_ingress_auth_lldap_jwt_secret: "{{ _jwt }}"
    fleet_ingress_auth_session_secret: "{{ _session }}"
    fleet_ingress_auth_storage_encryption_key: "{{ _storage }}"
    fleet_ingress_auth_reset_jwt_secret: "{{ _reset }}"
    fleet_ingress_auth_lldap_admin_password: "{{ _bootstrap }}"
  vars:
    _data: "{{ (fia_console_secret.stdout | default('{}') | from_json).data | default({}) }}"
    _bootstrap: "{{ (_data.bootstrapPassword | default('') | b64decode) | trim }}"
    _jwt: "{{ (_data.lldapJwtSecret | default('') | b64decode) | trim }}"
    _session: "{{ (_data.sessionSecret | default('') | b64decode) | trim }}"
    _storage: "{{ (_data.storageEncryptionKey | default('') | b64decode) | trim }}"
    _reset: "{{ (_data.resetJwtSecret | default('') | b64decode) | trim }}"
  when:
    - fia_console_secret.rc == 0
    - _bootstrap | length > 0
    - not (fleet_ingress_auth_use_console_lldap | default(false) | bool)

- name: Fleet ingress auth | Apply console-generated Authelia secrets (shared LLDAP)
  ansible.builtin.set_fact:
    fleet_ingress_auth_bootstrap_password: "{{ _bootstrap }}"
    fleet_ingress_auth_lldap_jwt_secret: "{{ _jwt }}"
    fleet_ingress_auth_session_secret: "{{ _session }}"
    fleet_ingress_auth_storage_encryption_key: "{{ _storage }}"
    fleet_ingress_auth_reset_jwt_secret: "{{ _reset }}"
  vars:
    _data: "{{ (fia_console_secret.stdout | default('{}') | from_json).data | default({}) }}"
    _bootstrap: "{{ (_data.bootstrapPassword | default('') | b64decode) | trim }}"
    _jwt: "{{ (_data.lldapJwtSecret | default('') | b64decode) | trim }}"
    _session: "{{ (_data.sessionSecret | default('') | b64decode) | trim }}"
    _storage: "{{ (_data.storageEncryptionKey | default('') | b64decode) | trim }}"
    _reset: "{{ (_data.resetJwtSecret | default('') | b64decode) | trim }}"
  when:
    - fia_console_secret.rc == 0
    - _bootstrap | length > 0
    - fleet_ingress_auth_use_console_lldap | default(false) | bool
