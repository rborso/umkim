---
# Deploy fleet-olm-subscription-sp to workload clusters via OCM ManifestWork.
#
# Prerequisites: phase4 (OLM on spokes), phase5 hub DCM, harbor_push_fleet for image.
#
# Usage:
#   ansible-playbook fleet-olm-sp.yml -l hub
#   ansible-playbook fleet-olm-sp.yml -e 'ocm_olm_sp_clusters=["virt02"]'

- name: Fleet OLM SP | Push to clusters
  hosts: hub
  become: true
  gather_facts: false
  roles:
    - role: fleet_olm_sp
      tags: [fleet_olm_sp, phase5_olm_sp, phase5_push]
